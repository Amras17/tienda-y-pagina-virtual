<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Llamado · Emporio Andino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap">
<link rel="stylesheet" href="../nucleo/emporio.css">
<style>
/* Pantalla de llamado: para una tele o un segundo monitor que vea la fila.
   El turno llamado ocupa casi toda la pantalla; abajo, los próximos. */
html,body{height:100%}
body{overflow:hidden}
.pant{position:relative;z-index:1;height:100vh;height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:2vh;padding:3vh 4vw;box-sizing:border-box}
.cab{display:flex;justify-content:space-between;align-items:center;gap:16px}
.cab b{font-family:"Caveat Brush",var(--f-num);font-size:clamp(28px,4vw,54px);color:var(--accent)}
.cab .clock{font-size:clamp(22px,3vw,40px)}
.centro{display:grid;place-items:center;text-align:center;border-radius:32px;border:2px solid var(--stroke);background:var(--glass);padding:3vh 3vw}
.centro.on{border-color:var(--warn);box-shadow:0 0 0 6px color-mix(in srgb,var(--warn) 18%,transparent),0 30px 80px -30px rgba(0,0,0,.6);animation:latido 2.4s ease-in-out infinite}
@keyframes latido{0%,100%{transform:scale(1)}50%{transform:scale(1.012)}}
.et{font-size:clamp(18px,2.6vw,34px);font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--warn)}
.num{display:block;font-family:var(--f-num);font-weight:800;font-size:clamp(120px,26vh,300px);line-height:.9;letter-spacing:-.04em;color:var(--fg)}
.nom{display:block;font-family:var(--f-num);font-weight:700;font-size:clamp(32px,6vh,72px);margin-top:1vh}
.dest{display:inline-block;margin-top:2vh;font-family:var(--f-num);font-weight:800;font-size:clamp(28px,5vh,60px);padding:.2em .7em;border-radius:99px;background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--warn)}
.calma{font-family:var(--f-num);font-size:clamp(28px,5vh,56px);color:var(--fg-2)}
.calma small{display:block;font-family:inherit;font-size:.5em;margin-top:1vh;color:var(--muted)}
.pie{display:grid;grid-template-columns:1fr 1fr;gap:2vw}
.caja2{border-radius:22px;border:1px solid var(--stroke);background:var(--glass);padding:1.6vh 1.6vw}
.caja2 h2{margin:0 0 1vh;font-size:clamp(16px,2vw,26px)}
.turnos{display:flex;gap:10px;flex-wrap:wrap}
.turnos span{font-family:var(--f-num);font-weight:800;font-size:clamp(22px,3.4vh,40px);padding:.15em .55em;border-radius:14px;background:var(--glass-2);border:1px solid var(--stroke-2)}
.turnos span.ok{border-color:var(--ok);color:var(--ok)}
.turnos em{font-style:normal;color:var(--muted);font-size:clamp(16px,2.4vh,26px)}
#sonido{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:rgba(0,0,0,.55);border:0;color:#fff;font:inherit;font-size:clamp(20px,3vw,34px);font-weight:800;cursor:pointer}
@media (prefers-reduced-motion:reduce){.centro.on{animation:none}}
</style>

<div class="pant">
  <div class="cab"><b>Emporio Andino</b><span class="clock num" id="reloj">--:--</span></div>
  <div class="centro" id="centro"></div>
  <div class="pie">
    <div class="caja2"><h2>Próximos para mesa</h2><div class="turnos" id="proximos"></div></div>
    <div class="caja2"><h2>Para llevar</h2><div class="turnos" id="llevar"></div></div>
  </div>
</div>
<button id="sonido" type="button">Toca la pantalla para activar el sonido del llamado</button>

<script src="../nucleo/datos.js"></script>
<script src="../nucleo/nucleo.js"></script>
<script src="../nucleo/fila.js"></script>
<script src="../nucleo/emporio.js"></script>
<script>
/* Seguridad: sin sesión o fuera del área del cargo, 403 (nucleo/nucleo.js). */
EAPOS.seguridad.guardia("fila");
/* El llamado lo hace el módulo Fila y mesas; esta pantalla solo lo muestra y
   suena. Se actualiza sola cuando cambia la fila en este equipo. */
var F=EAPOS.fila, ultimo="", AC=null;
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function sonar(){ try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==="suspended") AC.resume();
  [[784,0],[988,.22],[1175,.44],[988,.9],[1175,1.12]].forEach(function(n){ var o=AC.createOscillator(), g=AC.createGain(), t=AC.currentTime+n[1];
    o.type="sine"; o.frequency.value=n[0]; g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.25,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+.4);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+.45); }); }catch(e){} }
function pintar(){
  var l=F.llamado(), c=$("centro");
  if(l){ c.className="centro on";
    c.innerHTML='<div><span class="et">'+(l.destino==="llevar"?"Tu pedido está listo":"Tu mesa está lista")+'</span><span class="num">'+l.num+'</span><span class="nom">'+esc(l.nombre)+'</span>'+
      '<span class="dest">'+(l.destino==="llevar"?"Retíralo en el mesón":"Mesa "+(l.mesa||""))+'</span></div>';
    var k=l.grupo+"|"+l.ts; if(k!==ultimo){ ultimo=k; sonar(); } }
  else { c.className="centro"; ultimo="";
    var em=F.esperanMesa(); c.innerHTML='<div class="calma">'+(em.length?"Te llamamos aquí cuando tu mesa esté lista":"Bienvenidos")+'<small>'+(em.length?em.length+(em.length===1?" grupo espera mesa":" grupos esperan mesa"):"Pide tu turno en el mesón")+'</small></div>'; }
  var pr=F.esperanMesa().filter(function(g){ return g.estado==="esperando"; }).slice(0,8);
  $("proximos").innerHTML=pr.map(function(g){ return '<span>'+g.num+'</span>'; }).join("")||'<em>Nadie en espera</em>';
  var ll=F.llevar();
  $("llevar").innerHTML=ll.map(function(g){ return '<span class="'+(g.estado==="listo"?"ok":"")+'">'+g.num+'</span>'; }).join("")||'<em>Sin pedidos en espera</em>';
}
$("sonido").addEventListener("click",function(){ this.hidden=true; sonar(); try{ document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen(); }catch(e){} });
addEventListener("storage",function(ev){ if(ev.key==="eapos_fila") pintar(); });
if(EAPOS.canal) EAPOS.canal.addEventListener("message",function(){ pintar(); });
EA_UI.reloj($("reloj")); pintar(); setInterval(pintar,3000);
</script>
</body></html>
