<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><script>/* EmporioAndinoPOS: deja que el lanzador escuche errores desde el inicio */try{if(parent!==window&&parent.__eaGancho)parent.__eaGancho(window)}catch(e){}</script></head><body>
<title>Control de Salón</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Sora:wght@500;600;700;800&display=swap">
<style>
/* ===== Paleta Emporio Andino =====
   Turquesa #40E0D0 · Arena #D9CBA3 · Terracota #E2725B · Madera clara #C19A6B
   Gris volcánico #4B4B4B · Coral #FF7F50 · Dorado envejecido #B8860B
   Los tonos profundos y los lavados son tintes de esos mismos colores,
   usados donde el texto necesita contraste suficiente para leerse. */
:root{
  --turquesa:#40E0D0; --turquesa-ink:#7DEFD8; --turquesa-soft:rgba(64,224,208,.18);
  --arena:#D9CBA3;     --arena-soft:rgba(217,203,163,.20);
  --terracota:#E2725B; --terracota-ink:#FFB4A0; --terracota-soft:rgba(226,114,91,.22);
  --madera:#C19A6B;    --madera-ink:#EBCFA6;
  --volcan:#4B4B4B;
  --coral:#FF7F50;     --coral-ink:#FFB499; --coral-soft:rgba(255,127,80,.20);
  --dorado:#E3B33C;    --dorado-soft:rgba(227,179,60,.20);

  /* Fondo vivo: turquesa profundo con luz cálida entrando y bandas que cruzan.
     Las tarjetas son vidrio oscuro para que el texto blanco se lea encima. */
  --bg:#0B4A48; --cielo-alto:#12706B; --cielo-bajo:#062E30; --luz:rgba(255,196,132,.55); --suelo:rgba(184,134,11,.34);
  --velo-1:rgba(255,190,120,.42); --velo-2:rgba(11,74,72,0);
  --velo-3:rgba(226,114,91,.44);  --velo-4:rgba(64,224,208,.34);
  --surface:rgba(6,42,44,.62); --surface-2:rgba(255,255,255,.10); --surface-3:rgba(6,42,44,.44);
  --ink:#FFFFFF; --ink-soft:rgba(255,255,255,.76); --line:rgba(255,255,255,.22);
  --accent:#E2725B; --on-accent:#FFFFFF;
  --ok:#7DEFD8; --ok-soft:rgba(125,239,216,.16);
  --avisa:#FFCF6B; --avisa-soft:rgba(255,207,107,.18);
  --falta:#FF9E82; --falta-soft:rgba(255,158,130,.18);

  --c-espresso:#4A2C18; --c-crema:#C19A6B; --c-filter:#8A5530; --c-tea:#B8860B;
  --c-milk:#F0E4CC; --c-foam:#FDF8EE; --c-choc:#5E3722; --c-milkchoc:#B07D57;
  --c-tonic:#DCF6F2; --c-juice:#E2A33C; --c-chanar:#A9702F; --c-ice:#FFFFFF;
  --c-matcha:#8FAE5B; --c-chai:#C08E5A; --c-golden:#B8860B; --c-berry:#C24A6B;
  --c-soda:#7C5B3F; --c-water:#DCF6F2;

  --shadow:0 1px 2px rgba(0,0,0,.20), 0 14px 32px -16px rgba(0,0,0,.55);
  --r:14px;
}
/* Ya no hay dos temas: la carta es siempre la noche del desierto, texto
   blanco sobre vidrio oscuro. Así se ve igual en cualquier teléfono, tenga o
   no el modo oscuro puesto. */
:root[data-theme="dark"],:root[data-theme="light"]{color-scheme:dark}

*{box-sizing:border-box}
/* El suelo turquesa deja de ser plano: se lee como cielo del desierto,
   con la luz cálida entrando por arriba y un tono más profundo al pie. */
body{margin:0; background:var(--bg); color:var(--ink);
  background-image:
    radial-gradient(135% 58% at 50% -10%, var(--luz) 0%, transparent 60%),
    linear-gradient(0deg, var(--suelo) 0%, transparent 16%),
    linear-gradient(180deg, var(--cielo-alto) 0%, var(--bg) 42%, var(--cielo-bajo) 100%);
  background-attachment:fixed; background-repeat:no-repeat;
  min-height:100%;
  font-family:"Plus Jakarta Sans","Hiragino Sans","Yu Gothic","Noto Sans JP","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased}
/* La paleta se desplaza: una banda alta con los mismos siete colores cruza la
   pantalla de abajo hacia arriba en poco más de un minuto, de modo que el
   turquesa se entibia con arena, luego con coral y dorado, y vuelve. Solo se
   mueve (transform), así que la tarjeta gráfica lo resuelve sin repintar. */
body::before{content:""; position:fixed; left:-25%; right:-25%; top:-100%; height:300%;
  background:linear-gradient(176deg,
    var(--velo-1) 0%, var(--velo-2) 14%, var(--velo-3) 30%, var(--velo-2) 44%,
    var(--velo-4) 58%, var(--velo-2) 72%, var(--velo-1) 88%, var(--velo-3) 100%);
  opacity:.9; pointer-events:none; z-index:-1; will-change:transform;
  transform:translate3d(0,0,0); animation:deriva 68s ease-in-out infinite alternate}
@keyframes deriva{
  from{transform:translate3d(-2%,0,0)}
  to{transform:translate3d(2%,-30%,0)}}
/* Y una luz cálida suelta que se pasea por encima, con otro ritmo. */
body::after{content:""; position:fixed; inset:-35% -30% auto -30%; height:85%;
  background:radial-gradient(46% 50% at 32% 42%, var(--luz) 0%, transparent 64%);
  opacity:.5; pointer-events:none; z-index:-1; will-change:transform,opacity;
  animation:sol 53s ease-in-out infinite alternate}
@keyframes sol{
  0%{transform:translate3d(-10%,-4%,0) scale(1); opacity:.28}
  50%{opacity:.62}
  100%{transform:translate3d(14%,8%,0) scale(1.18); opacity:.40}}
h1,h2,h3{font-family:"Sora","Plus Jakarta Sans",system-ui,sans-serif; text-wrap:balance; margin:0;
  color:var(--ink); text-shadow:0 1px 2px rgba(0,0,0,.42), 0 4px 16px rgba(0,0,0,.30)}
/* Los títulos que van sobre el turquesa necesitan algo más de apoyo */
.gate h2,.familia,.bft{text-shadow:0 2px 4px rgba(0,0,0,.5), 0 6px 22px rgba(0,0,0,.35)}
body{text-shadow:0 1px 2px rgba(0,0,0,.28)}
button{font:inherit}
button:focus-visible,summary:focus-visible{outline:2.5px solid var(--accent); outline-offset:2px}
.wrap{max-width:480px; margin:0 auto; padding:0 16px 48px; display:flex; flex-direction:column; gap:14px}

/* ---------- cabecera con ruta de capas ---------- */
.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:30; background:var(--bg);
  background:color-mix(in srgb, var(--bg) 58%, transparent);
  backdrop-filter:blur(14px) saturate(1.2); -webkit-backdrop-filter:blur(14px) saturate(1.2);
  padding-block:10px; margin:0 -16px; padding-inline:16px; border-bottom:1px solid var(--line);
  display:grid; gap:8px}
.navrow{display:flex; align-items:center; gap:9px}
.back{border:1.5px solid var(--line); background:var(--surface); color:var(--ink);
  width:34px; height:34px; border-radius:50%; cursor:pointer; flex:none;
  display:grid; place-items:center; padding:0}
.back svg{width:17px; height:17px}
.navrow h1{font-size:15px; font-weight:800; letter-spacing:-.01em; flex:1; min-width:0;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.corner{border:1.5px solid var(--line); background:var(--surface); color:var(--ink-soft);
  font-size:11.5px; font-weight:700; padding:7px 11px; border-radius:999px; cursor:pointer;
  flex:none; line-height:1}
.ruta{display:flex; align-items:center; gap:5px; font-size:10px; font-weight:700;
  letter-spacing:.1em; text-transform:uppercase; color:var(--ink); opacity:.72; overflow:hidden}
.ruta span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:11ch}
.ruta span.on{color:var(--terracota-ink); max-width:16ch}
.ruta i{font-style:normal; opacity:.5; flex:none}
.pasos[hidden]{display:none}
.pasos{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.pasos .pn{font-size:10px; font-weight:800; letter-spacing:.1em; text-transform:uppercase;
  background:var(--accent); color:var(--on-accent); padding:3px 8px; border-radius:999px; flex:none}
.pasos .pt{font-size:11.5px; font-weight:700; color:var(--ink); opacity:.8; min-width:0;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.pasos .pb{display:flex; gap:3px; margin-left:auto; flex:none}
.pasos .pb i{width:14px; height:4px; border-radius:2px; background:rgba(255,255,255,.28); display:block;
  transition:background .3s ease, width .3s ease}
.pasos .pb i.on{background:var(--accent)}
.pasos .pb i.ahora{width:20px}
.pasosnota{font-size:11px; color:var(--ink); opacity:.7; text-align:center; margin:2px 0 0; line-height:1.5}
.niveles{flex:none; margin-left:auto; width:17px; height:17px; border-radius:50%; background:var(--accent); color:var(--on-accent); display:grid; place-items:center; opacity:1; font-size:9.5px; font-weight:800; letter-spacing:.1em; font-variant-numeric:tabular-nums; letter-spacing:0}



/* ---------- capas ---------- */
.layer{display:grid; gap:14px}
.layer.push{animation:capaAvanza .34s cubic-bezier(.2,.75,.3,1) both}
.layer.pop{animation:capaVuelve .3s cubic-bezier(.2,.75,.3,1) both}
@keyframes capaAvanza{from{transform:translateX(30px); opacity:0} to{transform:none; opacity:1}}
@keyframes capaVuelve{from{transform:translateX(-24px); opacity:0} to{transform:none; opacity:1}}

/* ---------- portada de selección ---------- */
.gate{display:grid; gap:13px; padding-top:6px}
.gate .kicker{font-size:10px; font-weight:800; letter-spacing:.2em; text-transform:uppercase;
  color:var(--terracota-ink); text-align:center}
.gate h2{font-size:26px; font-weight:800; letter-spacing:-.025em; line-height:1.14; text-align:center}
.gate p{font-size:13px; color:var(--ink); opacity:.75; margin:0; text-align:center; max-width:34ch; justify-self:center}
.opts{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.opt{border:1.5px solid var(--line); background:var(--surface); color:var(--ink); border-radius:16px;
  padding:0; cursor:pointer; box-shadow:var(--shadow); overflow:hidden; text-align:left; display:grid;
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px)}
.opt:hover{border-color:var(--accent); transform:translateY(-1px)}
.opt .tile{height:78px; background:var(--surface-2); position:relative; overflow:hidden; display:grid; place-items:center}
.opt .tile img{width:100%; height:100%; object-fit:cover; display:block}
.opt .tile svg{width:52px; height:52px}
.opt .lbl{padding:10px 11px 12px}
.opt .lbl b{display:block; font-family:"Sora",system-ui,sans-serif;
  font-size:15px; font-weight:800; letter-spacing:-.01em; line-height:1.15}
.opt .lbl small{display:block; font-size:11px; color:var(--ink-soft); margin-top:3px; line-height:1.35}
.opt.wide{grid-column:1/-1; grid-template-columns:96px 1fr; align-items:center}
.opt.wide .tile{height:100%; min-height:74px}
.opt.plain{display:block; padding:15px 14px}
.opt.plain b{display:block; font-family:"Sora",system-ui,sans-serif; font-size:16px; font-weight:800}
.opt.plain small{display:block; font-size:11.5px; color:var(--ink-soft); margin-top:4px; line-height:1.4}

/* ---------- piezas comunes ---------- */
.nota{font-size:12px; color:var(--ink-soft); background:var(--surface);
  border:1px solid var(--line); border-radius:12px; padding:10px 12px;
  backdrop-filter:blur(9px); -webkit-backdrop-filter:blur(9px)}
.block{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:14px; box-shadow:var(--shadow);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px)}
.block > h3{font-size:14.5px; font-weight:800; letter-spacing:-.01em}
.block > .bs{font-size:11.5px; color:var(--ink-soft); margin:3px 0 11px}
.plabel{font-size:10px; font-weight:800; letter-spacing:.13em; text-transform:uppercase;
  color:var(--terracota-ink); display:flex; align-items:center; gap:8px}
.plabel::after{content:""; flex:1; height:1px; background:rgba(255,255,255,.28)}
.list{display:grid; gap:9px}
.card{display:grid; grid-template-columns:86px 1fr; gap:11px; align-items:center; width:100%;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:9px;
  box-shadow:var(--shadow); cursor:pointer; text-align:left; color:var(--ink);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px)}
.card:hover{border-color:var(--accent)}
.card .thumb{width:86px; height:70px; border-radius:10px; object-fit:cover; display:block; background:var(--surface-2)}
.card .art{width:86px; display:grid; place-items:center}
.card.art-s{grid-template-columns:62px 1fr}
.card.art-s .art{width:62px}
.card .n{font-size:15.5px; font-weight:700; line-height:1.18; letter-spacing:-.01em;
  font-family:"Sora",system-ui,sans-serif}
.card .d{font-size:11.5px; color:var(--ink-soft); margin-top:3px; line-height:1.38;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.card .meta{display:flex; align-items:center; gap:5px; margin-top:6px; flex-wrap:wrap}
.card.gone{opacity:.5} .card.gone .thumb{filter:grayscale(1)}
.mini{display:grid; grid-template-columns:repeat(2,1fr); gap:8px}
.mcard{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:10px;
  box-shadow:var(--shadow); cursor:pointer; text-align:left; color:var(--ink); display:grid; gap:6px;
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px)}
.mcard:hover{border-color:var(--accent)}
.mcard.gone{opacity:.5}
.mcard .mn{font-size:12.5px; font-weight:700; line-height:1.25}
.egrid{display:grid; grid-template-columns:1fr 1fr; gap:9px}
.ecard{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:11px;
  box-shadow:var(--shadow); cursor:pointer; text-align:left; color:var(--ink); display:grid; gap:7px;
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px)}
.ecard:hover{border-color:var(--accent)}
.ecard.gone{opacity:.5}
.ecard .etop{display:flex; align-items:center; gap:8px}
.ecard .en{font-size:14.5px; font-weight:800; line-height:1.1; letter-spacing:-.01em;
  font-family:"Sora",system-ui,sans-serif}
.ecard .ed{font-size:11px; color:var(--ink-soft); line-height:1.35}

.badge{font-size:9.5px; font-weight:800; letter-spacing:.06em; text-transform:uppercase;
  padding:3px 7px; border-radius:999px; line-height:1.3}
.b-off{background:var(--falta); color:var(--on-accent)}
.b-pocas{background:var(--dorado); color:#FFF8E9}
.b-hoy{background:var(--terracota); color:#FFF8F2}
.b-veg{background:var(--turquesa-soft); color:var(--turquesa-ink)}
.b-vegan{background:var(--turquesa-ink); color:var(--on-accent)}
.b-opt{background:transparent; border:1px solid var(--turquesa-ink); color:var(--turquesa-ink)}
.b-sg{background:transparent; border:1px solid var(--madera-ink); color:var(--madera-ink)}
.b-casa{background:var(--arena-soft); color:var(--madera-ink)}
.b-inc{background:var(--arena-soft); color:var(--madera-ink)}
.b-local{background:transparent; border:1px solid var(--turquesa-ink); color:var(--turquesa-ink)}
.b-hot{background:var(--terracota-soft); color:var(--terracota-ink)}
.b-cold{background:var(--turquesa-soft); color:var(--turquesa-ink)}

.bigbtn{width:100%; border:0; border-radius:13px; padding:15px; font-weight:800; font-size:15.5px;
  background:var(--accent); color:var(--on-accent); cursor:pointer; box-shadow:var(--shadow);
  font-family:"Sora",system-ui,sans-serif; letter-spacing:-.01em}
.bigbtn:disabled{opacity:.45; cursor:not-allowed}
.ghostbtn{width:100%; border:1.5px solid var(--line); border-radius:13px; padding:13px;
  font-weight:700; font-size:14px; background:var(--surface); color:var(--ink-soft); cursor:pointer}
.ghostbtn:hover{border-color:var(--accent); color:var(--accent)}
.btnrow{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.step{display:flex; align-items:center; gap:2px; background:var(--surface-3);
  border:1.5px solid var(--line); border-radius:999px; padding:3px}
.step button{width:30px; height:30px; border:0; background:transparent; color:var(--ink);
  font-size:18px; font-weight:700; line-height:1; border-radius:50%; cursor:pointer}
.step .cnt{min-width:32px; text-align:center; font-size:16px; font-weight:800;
  font-variant-numeric:tabular-nums; font-family:"Sora",system-ui,sans-serif}
.facts{display:grid}
.fact{display:grid; grid-template-columns:96px 1fr; gap:10px; padding:9px 0; border-bottom:1px solid var(--line)}
.fact:last-child{border-bottom:0}
.fact .k{font-size:10px; font-weight:800; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-soft); padding-top:2px}
.fact .v{font-size:13px; line-height:1.4}
footer{font-size:11px; color:var(--ink); opacity:.65; text-align:center; line-height:1.6;
  padding-top:10px; border-top:1px solid rgba(255,255,255,.22)}

/* ---------- entrada escalonada de las tarjetas ---------- */
.layer.push .list > *, .layer.push .mini > *, .layer.push .egrid > *,
.layer.push .opts > *, .layer.push .pills > *{animation:entraFicha .34s cubic-bezier(.2,.75,.3,1) both}
.layer.push .list > :nth-child(1),.layer.push .mini > :nth-child(1),.layer.push .egrid > :nth-child(1),.layer.push .opts > :nth-child(1){animation-delay:.03s}
.layer.push .list > :nth-child(2),.layer.push .mini > :nth-child(2),.layer.push .egrid > :nth-child(2),.layer.push .opts > :nth-child(2){animation-delay:.07s}
.layer.push .list > :nth-child(3),.layer.push .mini > :nth-child(3),.layer.push .egrid > :nth-child(3),.layer.push .opts > :nth-child(3){animation-delay:.11s}
.layer.push .list > :nth-child(4),.layer.push .mini > :nth-child(4),.layer.push .egrid > :nth-child(4),.layer.push .opts > :nth-child(4){animation-delay:.15s}
.layer.push .list > :nth-child(5),.layer.push .mini > :nth-child(5),.layer.push .egrid > :nth-child(5),.layer.push .opts > :nth-child(5){animation-delay:.19s}
.layer.push .list > :nth-child(n+6),.layer.push .mini > :nth-child(n+6),.layer.push .egrid > :nth-child(n+6),.layer.push .opts > :nth-child(n+6){animation-delay:.22s}
@keyframes entraFicha{from{transform:translateY(12px); opacity:0} to{transform:none; opacity:1}}

/* ---------- respuesta al toque ---------- */
.opt,.card,.mcard,.ecard,.bigbtn,.ghostbtn,.step button,.pill{
  transition:transform .12s ease, border-color .18s ease, box-shadow .18s ease}
.opt:active,.card:active,.mcard:active,.ecard:active,.bigbtn:active,.ghostbtn:active,.pill:active{transform:scale(.975)}
.step button:active{transform:scale(.88)}
.opt .tile img{transition:transform .5s cubic-bezier(.2,.75,.3,1)}
.opt:active .tile img{transform:scale(1.06)}

/* ---------- aviso flotante ---------- */
.toast{position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px));
  transform:translate(-50%,16px); z-index:80; max-width:min(92vw,420px);
  background:var(--ink); color:var(--surface); border-radius:13px; padding:11px 15px;
  font-size:12.5px; font-weight:700; line-height:1.4; text-align:center;
  box-shadow:0 14px 34px -14px rgba(0,0,0,.6); opacity:0; pointer-events:none;
  transition:opacity .2s ease, transform .24s cubic-bezier(.2,.75,.3,1)}
.toast.ver{opacity:1; transform:translate(-50%,0)}
.toast.campana{background:var(--accent); color:var(--on-accent)}


/* ---------- guía de formas de empanada ---------- */
.guia{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:14px; box-shadow:var(--shadow); display:grid; gap:10px}
.guia .gt{font-family:"Sora",system-ui,sans-serif; font-size:14.5px; font-weight:800; letter-spacing:-.01em}
.guia .gs{font-size:11.5px; color:var(--ink-soft); line-height:1.45; margin-top:-6px}
.gformas{display:grid; grid-template-columns:repeat(3,1fr); gap:9px}
.gf{display:grid; justify-items:center; gap:4px; padding:9px 4px; border-radius:11px;
  background:var(--surface-3); border:1px solid var(--line); color:var(--terracota-ink)}
.gf span{font-size:10.5px; font-weight:700; color:var(--ink); text-align:center; line-height:1.2}

/* ---------- galería para la espera ---------- */
.galeria{display:grid; grid-template-columns:1fr 1fr; gap:9px}
.gfoto{position:relative; padding:0; border:1px solid var(--line); background:var(--surface-2);
  border-radius:13px; overflow:hidden; cursor:pointer; display:block; box-shadow:var(--shadow);
  transition:transform .2s ease, box-shadow .25s ease}
.gfoto img{width:100%; height:150px; object-fit:cover; display:block;
  transition:height .32s cubic-bezier(.2,.75,.3,1)}
.gfoto .gpie{position:absolute; left:0; right:0; bottom:0; padding:16px 9px 7px;
  background:linear-gradient(180deg,rgba(29,28,25,0),rgba(29,28,25,.78));
  color:#FBF7EE; font-size:10.5px; font-weight:700; text-align:left; line-height:1.25;
  opacity:0; transition:opacity .25s}
.gfoto.abierta{grid-column:1/-1}
.gfoto.abierta img{height:auto; max-height:76vh; object-fit:contain; background:var(--surface-3)}
.gfoto.abierta .gpie{opacity:1}
.gfoto:active{transform:scale(.985)}
@media (hover:hover){.gfoto:hover .gpie{opacity:1} .gfoto:hover{border-color:var(--accent)}}


/* ---------- familias de la barra ---------- */
.familia{font-family:"Sora",system-ui,sans-serif; font-size:19px; font-weight:800;
  letter-spacing:-.02em; color:var(--ink); margin-top:6px; padding-bottom:7px;
  border-bottom:2.5px solid var(--accent); display:flex; align-items:baseline; gap:8px}

/* ---------- horario de servicio ---------- */
.horario{display:flex; align-items:center; gap:9px; flex-wrap:wrap;
  background:var(--accent); color:var(--on-accent); border-radius:13px; padding:11px 13px;
  box-shadow:var(--shadow)}
.horario svg{width:19px; height:19px; flex:none}
.horario b{font-family:"Sora",system-ui,sans-serif; font-size:16px;
  font-weight:800; letter-spacing:-.01em}
.horario span{font-size:11.5px; opacity:.9; width:100%; line-height:1.35}
.horario.fuera{background:var(--dorado); color:#FFF8E9}
.opt{position:relative}
.reloj{position:absolute; top:7px; left:7px; z-index:2; font-size:10px; font-weight:800;
  letter-spacing:.04em; background:var(--accent); color:var(--on-accent);
  padding:4px 8px; border-radius:999px; line-height:1.2; box-shadow:0 2px 8px rgba(0,0,0,.25)}
.reloj.fuera{background:var(--dorado); color:#FFF8E9}

/* ---------- resumen del paso a paso de la barra ---------- */
.resumenbarra{display:flex; gap:6px; flex-wrap:wrap}
.resumenbarra .rb{font-size:11px; font-weight:800; letter-spacing:.04em; padding:6px 11px;
  border-radius:999px; background:var(--surface); border:1.5px solid var(--line); color:var(--ink)}
.resumenbarra .rb.leche{background:var(--arena-soft); border-color:var(--madera); color:var(--madera-ink)}
.b-esp{background:var(--dorado); color:#FFF8E9}
.b-leche{background:var(--arena-soft); color:var(--madera-ink)}


/* ---------- idiomas: los frecuentes como botón, el resto en lista ---------- */
.maslang{display:grid; gap:6px; margin-top:4px}
.maslang span{font-size:11px; color:var(--ink); opacity:.72; text-align:center; line-height:1.4}
.maslang select{width:100%; font:inherit; font-size:15px; padding:13px 12px; border-radius:13px;
  border:1.5px solid var(--line); background:var(--surface); color:var(--ink); cursor:pointer;
  -webkit-appearance:none; appearance:none; text-align:center; text-align-last:center;
  box-shadow:var(--shadow)}
.maslang select:focus-visible{outline:2.5px solid var(--accent); outline-offset:2px}

/* ---------- aviso antes de empezar ---------- */
.aviso-legal{position:relative; overflow:hidden; border:0; border-radius:20px;
  padding:20px 17px; display:grid; gap:11px; margin-top:6px;
  background:var(--surface); box-shadow:0 14px 32px -18px rgba(107,36,23,.55);
  border:1.5px solid var(--line)}
.aviso-legal::before{content:""; position:absolute; inset:0 0 auto 0; height:5px;
  background:linear-gradient(90deg,var(--terracota),var(--dorado),var(--turquesa))}
.aviso-legal .ah{display:flex; align-items:center; gap:9px; color:var(--accent)}
.aviso-legal .ah svg{width:26px; height:26px; flex:none}
.aviso-legal .ah b{font-family:"Sora",system-ui,sans-serif; font-size:17px;
  font-weight:800; letter-spacing:-.015em; line-height:1.2}
.aviso-legal .a1{margin:0; font-size:14.5px; line-height:1.5; font-weight:700}
.aviso-legal .a2{margin:0; font-size:13px; line-height:1.5; color:var(--ink-soft)}
.aviso-legal .bigbtn{margin-top:4px}

/* ---------- lectura de derecha a izquierda (עברית) ---------- */
:root[dir="rtl"] .ruta i{transform:scaleX(-1)}
:root[dir="rtl"] .back svg{transform:scaleX(-1)}
:root[dir="rtl"] .card,:root[dir="rtl"] .tkline{text-align:right}
:root[dir="rtl"] .plabel::after{margin-right:8px; margin-left:0}
:root[dir="rtl"] .enl .fl{transform:scaleX(-1)}


/* ---------- banda de fotos que adorna la espera ---------- */
.bandafotos{display:grid; gap:9px; margin:2px 0}
.bandafotos .bft{font-family:"Sora",system-ui,sans-serif; font-size:19px;
  font-weight:800; letter-spacing:-.015em; color:var(--ink)}
.bfpista{overflow:hidden; margin:0 -16px; padding:2px 0;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 24px,#000 calc(100% - 24px),transparent);
  mask-image:linear-gradient(90deg,transparent,#000 24px,#000 calc(100% - 24px),transparent)}
.bfcinta{display:flex; gap:10px; width:max-content; animation:cinta 82s linear infinite}
.bfcinta:hover{animation-play-state:paused}
@keyframes cinta{from{transform:translateX(0)} to{transform:translateX(-50%)}}
.bfimg{flex:none; padding:0; border:1px solid var(--line); border-radius:12px; overflow:hidden;
  background:var(--surface-2); cursor:pointer; display:block; box-shadow:var(--shadow);
  transition:transform .18s ease}
.bfimg img{width:168px; height:126px; object-fit:cover; display:block}
.bfimg:active{transform:scale(.96)}
.bfver{width:100%; border:1.5px solid var(--line); border-radius:13px; padding:11px;
  font-weight:700; font-size:13px; background:var(--surface); color:var(--ink-soft); cursor:pointer}

/* ---------- invitación a Instagram ---------- */
.insta{position:relative; display:flex; align-items:center; gap:13px; overflow:hidden;
  border-radius:20px; padding:16px 15px; text-decoration:none; isolation:isolate;
  color:#FFF6F0; background:linear-gradient(118deg,#B44A34 0%,#E2725B 42%,#FF7F50 68%,#B8860B 100%);
  background-size:220% 220%; animation:instaFondo 16s ease-in-out infinite alternate;
  box-shadow:0 12px 28px -14px rgba(107,36,23,.75)}
@keyframes instaFondo{from{background-position:0% 50%} to{background-position:100% 50%}}
.insta .brillo{position:absolute; inset:-40% -60%; z-index:-1; pointer-events:none;
  background:radial-gradient(38% 46% at 30% 30%, rgba(255,255,255,.34), transparent 70%);
  animation:instaBrillo 11s ease-in-out infinite alternate}
@keyframes instaBrillo{from{transform:translate3d(-8%,-6%,0)} to{transform:translate3d(14%,10%,0)}}
.insta .ico{flex:none; width:44px; height:44px; border-radius:14px; display:grid; place-items:center;
  background:rgba(255,255,255,.18); border:1.5px solid rgba(255,255,255,.4)}
.insta .ico svg{width:24px; height:24px}
.insta .txt{display:grid; gap:3px; min-width:0}
.insta .txt b{font-family:"Sora",system-ui,sans-serif; font-size:17px;
  font-weight:800; letter-spacing:-.015em; line-height:1.15; text-shadow:0 1px 3px rgba(80,25,15,.35)}
.insta .txt .s{font-size:12.5px; line-height:1.45; opacity:.95}
.insta .txt .arroba{font-weight:800; font-size:13px; letter-spacing:.01em;
  text-decoration:underline; text-underline-offset:3px; margin-top:2px}

@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}


/* ---------- estado del turno ---------- */
.alertbar{display:flex; align-items:center; gap:9px; width:100%;
  border:1.5px solid var(--line); background:var(--surface); border-radius:12px;
  padding:9px 11px; cursor:pointer; text-align:left; color:var(--ink)}
.alertbar.warn{border-color:var(--dorado); background:var(--avisa-soft)}
.alertbar.crit{border-color:var(--coral); background:var(--falta-soft)}
.alertbar i{width:9px; height:9px; border-radius:50%; display:block; flex:none}
.alertbar .txt{flex:1; font-size:12.5px; font-weight:700; line-height:1.3; min-width:0}
.alertbar .txt em{display:block; font-style:normal; font-weight:400; font-size:11px;
  color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.alertbar .go{font-size:11px; font-weight:700; color:var(--accent); flex:none}
.i-ok{background:var(--ok)} .i-bajo{background:var(--dorado)} .i-off{background:var(--coral)} .i-hoy{background:var(--terracota)}

.legend{display:flex; gap:6px; flex-wrap:wrap}
.legend span{display:inline-flex; align-items:center; gap:5px; font-size:10.5px; font-weight:700;

.stocklist{display:grid; gap:6px}
.srow{display:grid; grid-template-columns:1fr auto; gap:10px; align-items:center;

.srow.s-push{border-color:var(--terracota); background:var(--terracota-soft)}
.srow.s-bajo{border-color:var(--dorado); background:var(--avisa-soft)}

.srow .nm{font-size:13.5px; font-weight:700; line-height:1.25}

.srow .nm .dd{display:block; font-weight:400; font-size:11.5px; color:var(--ink-soft);
  line-height:1.4; margin-top:3px}
.srow .nm .soloeq{font-style:normal; font-size:9.5px; font-weight:800; letter-spacing:.08em;
  text-transform:uppercase; color:var(--dorado); background:var(--dorado-soft);
  padding:2px 6px; border-radius:999px; margin-left:5px; vertical-align:middle}
.state{border:0; border-radius:999px; padding:7px 11px; font-size:11.5px; font-weight:800;
  cursor:pointer; white-space:nowrap; line-height:1; background:var(--ok-soft); color:var(--ok)}
.state.s-push{background:var(--terracota); color:#FFF8F2}
.state.s-bajo{background:var(--dorado); color:#FFF8E9}
.state.s-off{background:var(--coral); color:#3A1A0E}
.pills{display:flex; flex-wrap:wrap; gap:5px}
.pill{border:1.5px solid var(--line); background:var(--surface-3); color:var(--ink);
  border-radius:999px; padding:6px 10px; font-size:11.5px; font-weight:700; cursor:pointer; line-height:1.3}
.pill.s-push{background:var(--terracota-soft); border-color:var(--terracota); color:var(--terracota-ink)}
.pill.s-bajo{background:var(--avisa-soft); border-color:var(--dorado); color:var(--avisa)}
.pill.s-off{background:var(--falta-soft); border-color:var(--coral); color:var(--falta); text-decoration:line-through}
.pill.tog[aria-pressed="true"]{background:var(--turquesa-soft); border-color:var(--turquesa-ink); color:var(--turquesa-ink)}
.subcat{font-size:10.5px; font-weight:700; color:var(--ink-soft); margin-bottom:3px}
.eprow{display:grid; grid-template-columns:auto 1fr auto; gap:9px; align-items:center;
  border:1.5px solid var(--line); background:var(--surface-3); border-radius:11px; padding:7px 9px}
.eprow.s-alto{border-color:var(--terracota); background:var(--terracota-soft)}
.eprow.s-bajo{border-color:var(--dorado); background:var(--avisa-soft)}
.eprow.s-off{border-color:var(--coral); background:var(--falta-soft)}
.eprow .nm{font-size:13.5px; font-weight:700; line-height:1.2}
.eprow .nm em{display:block; font-style:normal; font-weight:400; font-size:10.5px; color:var(--ink-soft); margin-top:2px}
.eprow .step{background:var(--surface)}
.step.s-bajo .cnt{color:var(--avisa)} .step.s-off .cnt{color:var(--falta)}
.units{font-size:11px; font-weight:800; font-variant-numeric:tabular-nums; color:var(--ink-soft)}
.units b{font-size:15px; color:var(--ink); font-family:"Sora",system-ui,sans-serif}
.units.s-bajo b{color:var(--avisa)} .units.s-off b{color:var(--falta)}
.units.s-alto b{color:var(--terracota-ink)}
.step.s-alto .cnt{color:var(--terracota-ink)}
.notablk textarea.notaTxt{width:100%; box-sizing:border-box; margin-top:10px;
  border:1.5px solid var(--line); background:var(--surface-3); color:var(--ink);
  border-radius:12px; padding:11px 12px; font:inherit; font-size:14px; line-height:1.5;
  resize:vertical; min-height:76px}
.notablk textarea.notaTxt:focus{outline:none; border-color:var(--terracota)}
.notapie{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:7px}
.notapie span{font-size:11px; color:var(--ink-soft)}
.notaDel{border:0; background:transparent; color:var(--falta); font-size:11.5px;
  font-weight:800; cursor:pointer; padding:4px 2px}
.nrow{display:block; width:100%; text-align:left; cursor:pointer; font:inherit}
.salir{margin-left:auto; flex:none; display:inline-flex; align-items:center; gap:5px;
  border:1.5px solid var(--terracota); background:var(--terracota-soft);
  color:var(--terracota-ink); border-radius:999px; padding:6px 11px; font-size:11.5px;
  font-weight:800; cursor:pointer; line-height:1; white-space:nowrap}
.salir svg{width:14px; height:14px}
.salir[hidden]{display:none}
/* el título cede espacio antes que el botón de salida */
.top .navrow h1{min-width:0}
/* ---------- horno ---------- */
.marq{display:flex; align-items:center; gap:9px; margin-top:8px; padding:8px 10px;
  background:var(--madera-soft,var(--surface-3)); border:1.5px solid var(--dorado);

.mlab{flex:none; font-size:9.5px; font-weight:800; letter-spacing:.12em; text-transform:uppercase;

.mrun{display:flex; gap:40px; width:max-content; animation:corre 18s linear infinite}
.mrun span{font-size:12.5px; font-weight:700; white-space:nowrap; font-variant-numeric:tabular-nums}
@keyframes corre{from{transform:translateX(0)} to{transform:translateX(calc(-50% - 20px))}}
@media (prefers-reduced-motion:reduce){ .mrun{animation:none} }
.mtot{flex:none; font-family:"Sora",system-ui,sans-serif; font-size:16px; font-weight:800;
  color:var(--dorado); font-variant-numeric:tabular-nums}
.cq em{display:block; font-family:"Plus Jakarta Sans",sans-serif; font-style:normal; font-size:11.5px;
  font-weight:400; color:var(--ink-soft); margin-top:3px}
.selgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:7px}
.selemp{position:relative; display:grid; justify-items:center; gap:5px; cursor:pointer;

.tpb{border:1.5px solid var(--line); background:var(--surface-3); color:var(--ink-soft);
  border-radius:999px; padding:7px 11px; font-size:11.5px; font-weight:800; cursor:pointer}
.tpb[aria-pressed="true"]{background:var(--dorado-soft); border-color:var(--dorado); color:var(--dorado)}
.cnota{font-size:11.5px; color:var(--ink-soft); margin-top:9px; text-align:center}
.resetbox{background:var(--falta-soft); border:1.5px solid var(--falta); border-radius:15px;
  padding:13px; margin-top:13px}
.resetbox b{display:block; font-family:"Sora",system-ui,sans-serif; font-size:15px; font-weight:800}
.resetbox p{font-size:12.5px; color:var(--ink-soft); line-height:1.45; margin:5px 0 11px}
.ghostbtn.rojo{border-color:var(--falta); color:var(--falta)}
.hornol{display:grid; gap:8px}
.hrow{display:grid; grid-template-columns:34px 1fr auto auto auto; gap:10px; align-items:center;
  background:var(--surface); border:1.5px solid var(--dorado); border-radius:14px; padding:10px 11px}
.hn{font-size:14px; font-weight:800; line-height:1.15; min-width:0}
.hn em{display:block; font-style:normal; font-size:10.5px; font-weight:400; color:var(--ink-soft); margin-top:2px}
.hq{font-family:"Sora",system-ui,sans-serif; font-size:19px; font-weight:800;
  font-variant-numeric:tabular-nums; text-align:center}
.hq small{display:block; font-size:9px; font-weight:700; color:var(--ink-soft)}
.hcron{text-align:center; min-width:52px}
.hcron b{display:block; font-family:"Sora",system-ui,sans-serif; font-size:18px;
  font-weight:800; color:var(--dorado); font-variant-numeric:tabular-nums}
.hcron small{display:block; font-size:8.5px; font-weight:700; letter-spacing:.06em;
  text-transform:uppercase; color:var(--ink-soft)}
.hya{border:1.5px solid var(--ok); background:transparent; color:var(--ok); border-radius:999px;
  padding:7px 11px; font-size:11px; font-weight:800; cursor:pointer; white-space:nowrap}
.carga{background:var(--surface); border:1.5px solid var(--line); border-radius:16px; padding:13px}
.cq{font-family:"Sora",system-ui,sans-serif; font-size:14px; font-weight:800; margin-bottom:9px}
.crow{display:grid; gap:7px; margin-top:13px}
.crow .edl{display:block}
.cctl{display:flex; align-items:center; gap:7px; flex-wrap:wrap}
.carga .bigbtn{margin-top:13px}
.pw{display:inline-flex; align-items:stretch; border-radius:999px; overflow:hidden}

.pw .pab{border:1.5px solid var(--line); border-left:0; border-radius:0 999px 999px 0;

.pw.ab .pab{background:var(--terracota-soft); border-color:var(--terracota); color:var(--terracota-ink)}

.pill .un{display:inline-block; font-style:normal; margin-left:6px; font-size:10.5px; font-weight:800;
  background:var(--surface-2); border-radius:999px; padding:1px 6px; vertical-align:1px}
.editlist{display:grid; gap:8px}
.editlist.abre{margin-top:9px; animation:despliega .22s cubic-bezier(.2,.8,.3,1) both}
@keyframes despliega{from{opacity:0; transform:translateY(-6px)} to{opacity:1; transform:none}}
.edit{background:var(--surface); border:1.5px solid var(--line); border-radius:14px; padding:11px 12px;
  display:grid; gap:10px}
.edit.s-off{border-color:var(--falta)} .edit.s-bajo{border-color:var(--avisa)}

.edn{font-family:"Sora",system-ui,sans-serif; font-size:15px; font-weight:800; line-height:1.15}
.edn em{display:block; font-style:normal; font-family:"Plus Jakarta Sans",sans-serif; font-size:10px; font-weight:800;

.edest{display:grid; grid-template-columns:repeat(4,1fr); gap:5px}

.eduni{display:flex; align-items:center; gap:9px; flex-wrap:wrap}

.pcard{background:var(--surface); border:1.5px solid var(--line); border-radius:18px;
  padding:18px 16px; min-height:210px; text-align:center}
.pcard.vuelta{border-color:var(--turquesa-ink); text-align:left}

<script>
/* La carta sale de nucleo/datos.js con los precios del sistema general. */
var DATOS = EAPOS.datos(EAPOS.general());
var COMIDA=DATOS.COMIDA, EMP=DATOS.EMP, BEB=DATOS.BEB, PAST=DATOS.PAST,
    MILKS=DATOS.MILKS;

var SEC=[
  {id:"desayunos", n:"Desayunos", img:"img/atacamena.webp", hora:"Hasta las 12:00", note:"Hasta medio día. Incluye jugo de naranja exprimido y taza de café americano, espresso o té negro."},
  {id:"brunch", n:"Brunch", img:"img/atacama.webp", hora:"Desde las 12:00", note:"Desde el medio día. Incluye jugo natural del día y café a elección."},
  {id:"bruschettas", n:"Bruschettas", img:"img/caspana.webp", note:"Sobre pan artesanal de masa madre, horneado en la casa."},
  {id:"tostadas", n:"Tostadas", img:"img/t-palta.webp", note:"Canasto de tostadas de masa madre con el acompañamiento elegido."},
  {id:"ensaladas", n:"Ensaladas y bowls", img:"img/licancabur.webp", note:"Ensaladas con aderezo de la casa. Bowls sobre base de yoghurt natural y mix de frutas."},
  {id:"empanadas", n:"Empanadas", img:"img/s-empanadas.webp", note:"De horno, especialidad de la casa. El contador de unidades se actualiza durante el turno."},
  {id:"bebidas", n:"Bebidas", img:"img/s-bebidas.webp", note:"Barra de especialidad. La intensidad sigue la proporción café : bebida de cada receta, bajo estándar SCA."},
  {id:"pasteleria", n:"Pastelería", img:"img/s-pasteleria.webp", note:"La vitrina cambia todos los días. Marca en el control lo que no salió del horno."}
];
var FAMB=[{g:["cafe","metodo"], n:"Cafetería"},
          {g:["te","choc"], n:"Té y chocolate"},
          {g:["jugo"], n:"Jugos y refrescos"}];
var GRUPOB={cafe:"Café", metodo:"Métodos y autor", te:"Té e infusiones", choc:"Chocolate", jugo:"Jugos, smoothies y refrescos"};
var CATP={tarta:"Tartas", kuchen:"Kuchen", cheese:"Cheesecakes", torta:"Tortas", minitorta:"Mini tortas",
  panqueque:"Tortas panqueque", galleta:"Galletas", galleton:"Galletones", paquete:"Paquetes",
  muffin:"Muffins", milhojas:"Mil hojas", treslech:"Tres leches"};
var GRUPOS_STOCK=[
  {id:"g-emp", n:"Empanadas", s:"Unidades en bandeja, con aviso bajo 6"},
  {id:"g-cocina", n:"Cocina", s:"Desayunos, brunch, bruschettas, tostadas, ensaladas y bowls"},
  {id:"g-beb", n:"Bebidas", s:"Las 33 de la barra, por grupo"},
  {id:"g-leche", n:"Leches y café", s:"Qué leches hay y si hay descafeinado"},
  {id:"g-past", n:"Pastelería", s:"Toda la vitrina, por categoría"}
];
var LATA=15;    /* las empanadas llegan por lata y cada lata trae 15 */
var UMBRAL=6;   /* bajo esto, la campana avisa */
var ALTO=15;    /* desde aquí la bandeja está llena: conviene ofrecerla primero */
var LANGN={en:"English", pt:"Português", zh:"中文", ja:"日本語"};

/* ---------- estado ---------- */
var HOY=new Date().toISOString().slice(0,10);
var cfg={fecha:"", st:{}, emp:{}, milks:{}, decaf:1, tocado:"", son:1};
try{ var raw=localStorage.getItem("ea_control"); if(raw){ var o=JSON.parse(raw); if(o&&typeof o==="object") cfg=Object.assign(cfg,o); } }catch(e){}
if(cfg.fecha!==HOY){ cfg.fecha=HOY; cfg.st={}; cfg.emp={}; cfg.uni={}; cfg.milks={}; cfg.decaf=1; cfg.tocado=""; }
if(typeof cfg.son!=="number") cfg.son=1;
COMIDA.forEach(function(d){ if(!cfg.st[d.id]) cfg.st[d.id]="ok"; });
BEB.forEach(function(d){ if(!cfg.st[d.id]) cfg.st[d.id]="ok"; });
PAST.forEach(function(p){ if(!cfg.st["P"+p.id]) cfg.st["P"+p.id]="ok"; });
/* Si el teléfono venía del formato anterior (unidades), se traduce una vez */
EMP.forEach(function(e){
  if(cfg.emp && typeof cfg.emp[e.id]==="number" && !cfg.st["E"+e.id]){
    var u=cfg.emp[e.id];
    if(u<=0) cfg.st["E"+e.id]="off";
    else if(u<=UMBRAL) cfg.st["E"+e.id]="bajo";
  }
});
cfg.emp={};
if(!cfg.uni || typeof cfg.uni!=="object") cfg.uni={};
MILKS.forEach(function(m){ if(typeof cfg.milks[m.id]!=="number") cfg.milks[m.id]=1; });
function save(){ cfg.tocado=new Date().toISOString(); try{ localStorage.setItem("ea_control", JSON.stringify(cfg)); }catch(e){} }

/* ---------- notas del equipo ----------
   Se guardan aparte de cfg porque cfg se reinicia cada día y una nota no.
   Son del teléfono que las escribió: no viajan a la carta ni al cliente. */
var notas={};
try{ var rn=localStorage.getItem("ea_notas"); if(rn){ var on=JSON.parse(rn); if(on&&typeof on==="object") notas=on; } }catch(e){}
function saveNotas(){ try{ localStorage.setItem("ea_notas", JSON.stringify(notas)); }catch(e){} }
function nota(k){ return (notas[k]&&notas[k].t) || ""; }
function fijarNota(k,t){
  t=String(t||"").slice(0,900);
  if(t.trim()) notas[k]={t:t, f:new Date().toISOString()};
  else delete notas[k];
  saveNotas();
}
function nombreClave(k){
  var p=k.split(":"), tipo=p[0], id=p.slice(1).join(":");
  try{
    if(tipo==="com") return find(COMIDA,id).n;
    if(tipo==="emp") return find(EMP,id).n;
    if(tipo==="beb") return nEs(find(BEB,id));
    if(tipo==="past") return find(PAST,id).n.es;
  }catch(e){}
  return id;
}
function bloqueNota(k){
  var t=nota(k), f=notas[k]&&notas[k].f;
  return '<div class="block notablk"><h3>Mis notas</h3>'+
    '<div class="bs">Lo que aprendiste sirviendo este producto: lo que preguntan, lo que conviene decir, lo que salió mal una vez. Queda en este teléfono.</div>'+
    '<textarea class="notaTxt" data-nota="'+esc(k)+'" rows="3" maxlength="900" '+
    'placeholder="Escribe aquí tu nota…">'+esc(t)+'</textarea>'+
    '<div class="notapie"><span id="notaEstado">'+(f?"Guardada el "+new Date(f).toLocaleDateString("es-CL"):"Sin nota todavía")+'</span>'+
    (t?'<button class="notaDel" type="button" data-notadel="'+esc(k)+'">Borrar</button>':'')+'</div></div>';
}
function capaNotas(){
  var ks=Object.keys(notas).filter(function(k){ return nota(k); });
  var h='<div class="gate"><h2>Mis notas</h2>'+
    '<p>Todo lo que el equipo anotó sobre la carta en este teléfono. Toca una para ir a su ficha.</p></div>';
  if(!ks.length){
    h+='<div class="nota">Todavía no hay notas. Entra a la ficha de cualquier producto y escribe abajo, en <b>Mis notas</b>: lo que preguntan los clientes, lo que conviene decir, el detalle que se olvida.</div>';
    return h;
  }
  ks.sort(function(a,b){ return (notas[b].f||"").localeCompare(notas[a].f||""); });
  h+='<div class="glist">'+ks.map(function(k){
    var p=k.split(":");
    return '<button class="grow nrow" type="button" data-ficha="'+esc(k)+'">'+
      '<div class="gt2">'+esc(nombreClave(k))+'</div>'+
      '<div class="gd">'+esc(nota(k))+'</div>'+
      '<div class="gm">'+esc(new Date(notas[k].f).toLocaleDateString("es-CL"))+'</div></button>';
  }).join("")+'</div>';
  h+='<div class="nota">Las notas son de este teléfono: no se ven en la carta del cliente ni en otros equipos.</div>';
  return h;
}

/* pila de capas: cada entrada es {v:vista, p:parámetro, t:título} */
var pila=[{v:"inicio", p:null, t:"Control de salón"}];
var dir="push", trLang=null;
var rv={step:0,total:0,timer:null};
function actual(){ return pila[pila.length-1]; }
function entrar(v,p,t){ pila.push({v:v,p:p,t:t}); dir="push"; pintar(); window.scrollTo({top:0}); }
function salir(){ if(pila.length>1){ pila.pop(); dir="pop"; pintar(); window.scrollTo({top:0}); } }
function volverA(n){ pila=pila.slice(0,n+1); dir="pop"; pintar(); window.scrollTo({top:0}); }

/* ---------- utilidades ---------- */
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function est(id){ return cfg.st[id]||"ok"; }
/* Las empanadas se marcan igual que la vitrina: disponibilidad, no unidades.
   La clave lleva E delante para no chocar con los platos de cocina. */
function estEmp(e){ return est("E"+e.id); }
/* "alto" y "push" siguen siendo disponibles: solo cambian el orden en que se ofrecen */
function hayDe(s){ return s!=="off"; }
function nEs(x){ return typeof x.n==="string"?x.n:x.n.es; }
function find(a,id){ for(var i=0;i<a.length;i++){ if(a[i].id===id) return a[i]; } return null; }
function secDe(id){ return SEC.filter(function(s){ return s.id===id; })[0]; }
function estLbl(s){ return s==="ok"?"Disponible":s==="push"?"Ofrecer primero":s==="alto"?"Bandeja llena":s==="bajo"?"Quedan pocas":"Agotado"; }
function estBadge(s){ return s==="bajo"?'<span class="badge b-pocas">Quedan pocas</span>'
  : s==="off"?'<span class="badge b-off">Agotado</span>'
  : (s==="push"||s==="alto")?'<span class="badge b-hoy">Ofrecer primero</span>':""; }
function tagBadge(t){ return t==="veg"?'<span class="badge b-veg">Vegetariano</span>'
  : t==="vegan"?'<span class="badge b-vegan">Vegano</span>'
  : t==="vegopt"?'<span class="badge b-opt">Opción vegana</span>':""; }
function conteo(){
  var bajo=0, off=0, faltan=[], pocas=[];
  EMP.forEach(function(e){ var s=estEmp(e); if(s==="off"){off++;faltan.push(e.n);} else if(s==="bajo"){bajo++;pocas.push(e.n);} });
  COMIDA.forEach(function(d){ var s=est(d.id); if(s==="off"){off++;faltan.push(d.n);} else if(s==="bajo"){bajo++;pocas.push(d.n);} });
  BEB.forEach(function(d){ var s=est(d.id); if(s==="off"){off++;faltan.push(nEs(d));} else if(s==="bajo"){bajo++;pocas.push(nEs(d));} });
  PAST.forEach(function(p){ var s=est("P"+p.id); if(s==="off"){off++;faltan.push(p.n.es);} else if(s==="bajo"){bajo++;pocas.push(p.n.es);} });
  return {bajo:bajo, off:off, faltan:faltan, pocas:pocas};
}

/* ---------- campana de cocina ----------
   Un timbre de mostrador sintetizado en el momento: no hay archivo de audio,
   así que suena igual con o sin conexión. Solo suena después de que alguien
   tocó la pantalla, que es lo que el navegador exige para reproducir sonido. */
var AC=null;
function campana(veces){
  if(!cfg.son) return;
  try{
    var Ctx=window.AudioContext||window.webkitAudioContext; if(!Ctx) return;
    AC=AC||new Ctx();
    if(AC.state==="suspended") AC.resume();
    var t0=AC.currentTime+0.02, n=veces||1;
    for(var r=0;r<n;r++){
      var t=t0+r*0.40;
      [[2093,0.26],[3136,0.13],[4186,0.06]].forEach(function(par){
        var o=AC.createOscillator(), g=AC.createGain();
        o.type="sine"; o.frequency.setValueAtTime(par[0],t);
        g.gain.setValueAtTime(0.0001,t);
        g.gain.exponentialRampToValueAtTime(par[1],t+0.006);
        g.gain.exponentialRampToValueAtTime(0.0001,t+1.45);
        o.connect(g); g.connect(AC.destination);
        o.start(t); o.stop(t+1.5);
      });
    }
  }catch(e){}
}
var toastT=null;
function avisar(txt, fuerte){
  var t=document.getElementById("toast"); if(!t) return;
  t.textContent=txt;
  t.className="toast ver"+(fuerte?" campana":"");
  if(toastT) clearTimeout(toastT);
  toastT=setTimeout(function(){ t.classList.remove("ver"); toastT=null; }, 4200);
}
/* foto del stock para comparar antes y después de cada cambio */
function foto(){
  var m={};
  EMP.forEach(function(e){ m["emp:"+e.id]=estEmp(e); });
  COMIDA.forEach(function(d){ m["com:"+d.id]=est(d.id); });
  BEB.forEach(function(d){ m["beb:"+d.id]=est(d.id); });
  PAST.forEach(function(x){ m["past:"+x.id]=est("P"+x.id); });
  return m;
}
function nombreDe(clave){
  var pr=clave.split(":"), id=pr.slice(1).join(":");
  if(pr[0]==="emp") return find(EMP,id).n;
  if(pr[0]==="com") return find(COMIDA,id).n;
  if(pr[0]==="beb") return nEs(find(BEB,id));
  return find(PAST,id).n.es;
}
var antes=foto();
function vigilar(){
  var ahora=foto(), caidos=[], bajos=[];
  for(var k in ahora){
    var a=antes[k]||"ok", b=ahora[k];
    if(a===b) continue;
    if(b==="off") caidos.push(nombreDe(k));
    else if(b==="bajo" && a!=="off") bajos.push(nombreDe(k));
  }
  antes=ahora;
  if(caidos.length){ campana(2); avisar("Se acabó: "+caidos.join(" · "), true); }
  else if(bajos.length){ campana(1); avisar("Quedan pocas: "+bajos.join(" · "), true); }
}

/* =================== revisar y cargar =====================
   Una fila editable que sirve en los dos lugares: en la revisión, para
   arreglar lo que falta sin buscarlo; en el stock, desplegada bajo el producto
   que se toca, para cargar las unidades que salieron. */

/* Unidades cargadas por producto. Van aparte del estado porque el estado se
   marca a mano y las unidades se cuentan; una cosa no reemplaza a la otra. */
function uni(k){ return Math.max(0, +(cfg.uni && cfg.uni[k]) || 0); }
/* Las empanadas se cuentan por lata; el resto, por unidad suelta */
function porLata(k){ return k.charAt(0)==="E"; }
function enLatas(n){
  var l=Math.floor(n/LATA), r=n%LATA;
  if(!l) return r+" u.";
  return l+(l===1?" lata":" latas")+(r?" y "+r+" u.":"")+" · "+n+" u.";
}
function fijarUni(k, n){
  if(!cfg.uni) cfg.uni={};
  n=Math.max(0, Math.min(999, n|0));
  if(n) cfg.uni[k]=n; else delete cfg.uni[k];
  /* Cargar unidades dice, por sí solo, que hay: si estaba agotado, vuelve */
  if(n>0 && est(k)==="off") cfg.st[k]="ok";
  if(n===0 && est(k)!=="off" && cfg.uni && !(k in cfg.uni)) { /* sin cambios */ }
  save(); vigilar();
}

/* Nombre y clave de cada cosa, resueltos en un solo lugar */
function nombreDeClave(k){
  try{
    if(k.charAt(0)==="E") { var e=find(EMP, k.slice(1)); if(e) return e.n; }
    if(k.charAt(0)==="P") { var p=find(PAST, k.slice(1)); if(p) return p.n.es; }
    var d=COMIDA.filter(function(x){ return x.id===k; })[0];
    if(d) return d.n;
    var b=BEB.filter(function(x){ return x.id===k; })[0];
    if(b) return nEs(b);
  }catch(e){}
  return k;
}
function grupoDeClave(k){
  if(k.charAt(0)==="E") return "Empanadas";
  if(k.charAt(0)==="P") return "Pastelería";
  var d=COMIDA.filter(function(x){ return x.id===k; })[0];
  if(d) return secDe(d.s).n;

}
/* Todas las claves del control, en el orden en que se recorre la barra */
function todasLasClaves(){
  var out=[];

/* =================== el horno =====================
   Las empanadas se venden mientras están adentro, así que lo que importa no es
   cuántas hay sino cuántas salen y cuándo. Cocina carga la hornada, el reloj
   corre solo y al llegar a cero las unidades entran al stock y suena la campana.
   El aviso de arriba se desplaza para que se lea desde lejos. */

var MIN_HORNO=5;                 /* lo que tarda una hornada, por defecto */
var relojHorno=null;
/* Se cargan varias variedades de una vez: la bandeja casi nunca lleva una sola */
var cargando={sel:{}, n:LATA, min:MIN_HORNO};
function selN(){ return Object.keys(cargando.sel).filter(function(k){ return cargando.sel[k]; }); }

function hornadas(){
  if(!Array.isArray(cfg.horno)) cfg.horno=[];
  return cfg.horno;
}
function restaMs(hd){
  var t=new Date(hd.eta).getTime();
  return isNaN(t) ? 0 : t-Date.now();
}
function relojTxt(ms){
  var s=Math.max(0, Math.round(ms/1000));
  return Math.floor(s/60)+":"+("0"+(s%60)).slice(-2);
}
function enHorno(empId){
  var n=0;
  hornadas().forEach(function(hd){ if(hd.emp===empId) n+=hd.n; });
  return n;
}
function totalHorno(){
  var n=0; hornadas().forEach(function(hd){ n+=hd.n; }); return n;
}
function meterAlHorno(empId, n, min){
  n=Math.max(1, Math.min(99, n|0));
  min=Math.max(1, Math.min(60, min|0));
  hornadas().push({ id:"h"+Date.now()+Math.floor(Math.random()*999),
    emp:empId, n:n, desde:new Date().toISOString(),
    eta:new Date(Date.now()+min*60000).toISOString() });
  save();
}
/* Al cumplirse el tiempo, la hornada entra al stock sola */
function sacarHornada(hd){
  var k="E"+hd.emp;
  if(!cfg.uni) cfg.uni={};
  cfg.uni[k]=uni(k)+hd.n;
  delete cfg.st[k];                       /* sale del horno: hay */
  cfg.horno=hornadas().filter(function(x){ return x.id!==hd.id; });
  save();
  var e=find(EMP, hd.emp);
  campana(2);
  avisar("Listas: "+hd.n+" "+(e?e.n:hd.emp), true);
}
function revisarHorno(){
  var cambio=false;
  hornadas().slice().forEach(function(hd){
    if(restaMs(hd)<=0){ sacarHornada(hd); cambio=true; }
  });
  return cambio;
}
/* El reloj corre siempre, pinte lo que pinte la pantalla */
function arrancarReloj(){
  if(relojHorno) return;
  relojHorno=setInterval(function(){
    if(revisarHorno()){ dir=""; pintar(); return; }
    /* sin repintar toda la pantalla: solo los números que corren */
    Array.prototype.forEach.call(document.querySelectorAll("[data-eta]"), function(n){
      var hd=hornadas().filter(function(x){ return x.id===n.dataset.eta; })[0];
      n.textContent = hd ? relojTxt(restaMs(hd)) : "0:00";
    });
    var m=document.getElementById("marqTxt");
    if(m) m.textContent=textoMarquesina();
  }, 1000);
}
function textoMarquesina(){
  var hs=hornadas().slice().sort(function(a,b){ return restaMs(a)-restaMs(b); });
  if(!hs.length) return "";
  return hs.map(function(hd){
    var e=find(EMP, hd.emp);
    return hd.n+" "+(e?e.n:hd.emp)+" · "+relojTxt(restaMs(hd));
  }).join("     ·     ");
}
/* El aviso que se desplaza. Se repite el texto para que el giro no deje hueco */
function bloqueMarquesina(){
  if(!hornadas().length) return "";
  var t=textoMarquesina();
  return '<div class="marq"><span class="mlab">En el horno</span>'+
    '<div class="mvia"><div class="mrun"><span id="marqTxt">'+esc(t)+'</span>'+
    '<span aria-hidden="true">'+esc(t)+'</span></div></div>'+
    '<span class="mtot">'+totalHorno()+'</span></div>';
}

        (on?'<i class="tic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></i>':'')+
        '</button>';
    }).join("")+'</div>';
  h+='<div class="crow"><span class="edl">Cuánto de cada una</span><div class="cctl">'+
     [1,2,3].map(function(l){
       return '<button class="tpb" type="button" data-hlata="'+l+'" aria-pressed="'+(cargando.n===l*LATA?"true":"false")+'">'+
         l+(l===1?" lata":" latas")+'</button>';

     '<div class="step chico"><button type="button" data-hn="-1" aria-label="Menos">&minus;</button>'+

     '<button type="button" data-hn="1" aria-label="Más">+</button></div></div>'+
     '<span class="edlat">'+esc(enLatas(cargando.n))+' por variedad · la lata trae '+LATA+'</span></div>';
  h+='<div class="crow"><span class="edl">Tiempo en el horno</span><div class="cctl">'+
     [5,10,15].map(function(m){
       return '<button class="tpb" type="button" data-hpre="'+m+'" aria-pressed="'+(cargando.min===m?"true":"false")+'">'+m+' min</button>';
     }).join("")+
     '<div class="step chico"><button type="button" data-hm="-1" aria-label="Menos">&minus;</button>'+
     '<span class="cnt">'+cargando.min+'</span>'+
     '<button type="button" data-hm="1" aria-label="Más">+</button></div></div></div>';
  h+='<button class="bigbtn" type="button" id="alHorno"'+(sel.length?'':' disabled')+'>'+
     (sel.length
        ? 'Al horno · '+sel.length+(sel.length===1?' variedad':' variedades')+' × '+cargando.n+' u.'
        : 'Elige cuáles entraron')+'</button>';
  if(sel.length) h+='<div class="cnota">Entran '+esc(enLatas(sel.length*cargando.n))+' en total, con el mismo reloj.</div>';
  h+='</div>';

  /* Volver a cero: el horno se vacía sin tocar el stock ya cargado */
  h+= resetHorno
    ? '<div class="resetbox"><b>¿Vaciar el horno?</b>'+
      '<p>Se borran las '+hornadas().length+' hornada'+(hornadas().length===1?'':'s')+' en curso. Las unidades que ya salieron al stock no se tocan.</p>'+
      '<div class="btnrow"><button class="ghostbtn rojo" type="button" id="resetSi">Vaciar</button>'+
      '<button class="ghostbtn" type="button" id="resetNo">Volver</button></div></div>'
    : '<button class="ghostbtn" type="button" id="resetHorno"'+(hornadas().length?'':' disabled')+'>Vaciar el horno y partir de cero</button>';

  h+='<div class="nota">Este horno corre en este equipo. Lo que sale se suma solo al stock que ven la Caja, la Carta y las Comandas.</div>';
  return h;
}

function capaStock(gid){
  /* Todo el stock se marca igual que la vitrina: una pastilla por producto y
     un toque para avanzar. Se recorre la barra entera sin scroll infinito. */
  var h='<div class="nota">Un toque avanza el estado: disponible → ofrecer primero → quedan pocas → agotado. Toca la flecha para cargar unidades.</div>';
  /* La rejilla se corta donde está el producto abierto, para que su fila de
     carga quede justo debajo y no al final de todo el grupo. */
  function rejilla(items, clave, nombre){
    var out='', fila='', abierto=-1;
    items.forEach(function(x,i){ if(clave(x)===abiertoEn) abierto=i; });
    out+='<div class="pills">'+items.map(function(x){
      var k=clave(x), ab=(k===abiertoEn);
      return '<span class="pw'+(ab?" ab":"")+'">'+
        '<button class="pill s-'+est(k)+'" type="button" data-cyc="'+k+'">'+esc(nombre(x))+
        (uni(k)?'<i class="un">'+uni(k)+'</i>':'')+'</button>'+
        '<button class="pab" type="button" data-abrir="'+k+'" aria-label="Cargar unidades" aria-expanded="'+(ab?"true":"false")+'">'+
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button></span>';
    }).join("")+'</div>';
    if(abierto>=0) out+='<div class="editlist abre">'+filaEditable(abiertoEn,true)+'</div>';
    return out;
  }
  if(gid==="g-emp"){
    h+='<div class="nota">La forma de cada empanada está en su ficha, dentro de Estudiar la carta.</div>';
    h+=rejilla(EMP, function(e){ return "E"+e.id; }, function(e){ return e.n; });
    h+='<div class="btnrow" style="margin-top:11px">'+
       '<button class="ghostbtn" type="button" id="empTodo">Todas disponibles</button>'+
       '<button class="ghostbtn" type="button" id="empNada">Todas agotadas</button></div>';
  }
  else if(gid==="g-cocina"){
    SEC.forEach(function(sc){
      if(["empanadas","bebidas","pasteleria"].indexOf(sc.id)>=0) return;
      var items=COMIDA.filter(function(d){ return d.s===sc.id; });
      if(!items.length) return;
      h+='<div class="plabel">'+esc(sc.n)+'</div>'+
         rejilla(items, function(d){ return d.id; }, function(d){ return d.n; });
    });
  }
  else if(gid==="g-beb"){
    FAMB.forEach(function(fam){
      if(!fam.g.some(function(g){ return BEB.some(function(d){ return d.g===g; }); })) return;
      h+='<div class="familia">'+esc(fam.n)+'</div>';
      fam.g.forEach(function(g){
        var items=BEB.filter(function(d){ return d.g===g; });
        if(!items.length) return;
        h+='<div class="plabel">'+esc(GRUPOB[g])+'</div>'+
           rejilla(items, function(d){ return d.id; }, function(d){ return nEs(d)+(d.eq?" ·":""); });
      });
    });
    h+='<div class="nota">La receta y la descripción de cada bebida están en su ficha, dentro de Estudiar la carta.</div>';
  }
  else if(gid==="g-leche"){
    h='<div class="nota">Lo que quede sin marcar deja de ofrecerse en la ficha de cada bebida.</div>';
    h+='<div class="plabel">Leches</div><div class="pills">'+MILKS.map(function(m){
      var hay=cfg.milks[m.id]?1:0;
      return '<button class="pill'+(hay?'':' s-off')+'" type="button" data-milk="'+m.id+'">'+esc(m.n.es)+'</button>';
    }).join("")+'</div>';
    h+='<div class="plabel">Café</div><div class="pills">'+
      '<button class="pill tog" type="button" data-decaf="1" aria-pressed="'+(cfg.decaf?"true":"false")+'">Hay descafeinado</button></div>';
  }
  else {
    var cats={}; PAST.forEach(function(p){ (cats[p.cat]=cats[p.cat]||[]).push(p); });
    Object.keys(cats).forEach(function(c){
      h+='<div class="plabel">'+esc(CATP[c]||c)+'</div>'+
         rejilla(cats[c], function(p){ return "P"+p.id; }, function(p){ return p.n.es; });
    });
  }
  return h;
}

/* ---------- pintar ---------- */
function contenido(){
  var a=actual();
  switch(a.v){
    case "inicio": return capaInicio();
    case "stock": return capaStockGrupos();
    case "grupo": return capaStock(a.p);
    case "revisar": return capaRevisar();
    case "horno": return capaHorno();
    case "carta": return capaSecciones();
    case "gloss": return capaGlosario();
    case "practica": return capaPractica();
    case "notas": return capaNotas();
    case "lista": return capaLista(a.p);
    case "com": return fichaComida(a.p);
    case "emp": return fichaEmp(a.p);
    case "beb": return fichaBeb(a.p);
    case "past": return fichaPast(a.p);
  }
  return "";
}
function pintar(){
  var a=actual();
  document.getElementById("app").innerHTML='<section class="layer '+dir+'">'+contenido()+'</section>';
  document.getElementById("titulo").textContent=a.t;
  var mq=document.getElementById("marquesina");
  if(mq){ mq.innerHTML = (a.v==="horno") ? "" : bloqueMarquesina(); }
  document.getElementById("back").hidden = pila.length<2;
  var r=document.getElementById("ruta");
  r.innerHTML = pila.map(function(x,i){
    return '<span class="'+(i===pila.length-1?"on":"")+'" data-nivel="'+i+'">'+esc(x.t)+'</span>';
  }).join('<i>›</i>') + (pila.length>1 ? '<span class="niveles">'+pila.length+'</span>' : '');
  pintarEstado();
  if(a.v==="com"){ rv.step=0; rv.total=find(COMIDA,a.p).capas.length; }
  /* La nota se guarda sola mientras se escribe: nadie va a buscar un botón
     con el salón lleno. Sin repintar, para no perder el cursor. */
  var ta=document.querySelector(".notaTxt");
  if(ta){
    var t=null;
    ta.addEventListener("input", function(){
      if(t) clearTimeout(t);
      var est=document.getElementById("notaEstado");
      if(est) est.textContent="Escribiendo…";
      t=setTimeout(function(){
        fijarNota(ta.dataset.nota, ta.value);
        if(est) est.textContent = ta.value.trim() ? "Guardada" : "Sin nota todavía";
      }, 500);
    });
    ta.addEventListener("blur", function(){
      if(t){ clearTimeout(t); t=null; }
      fijarNota(ta.dataset.nota, ta.value);
      var est=document.getElementById("notaEstado");
      if(est) est.textContent = ta.value.trim() ? "Guardada" : "Sin nota todavía";
    });
  }
}
function pintarEstado(){
  var bar=document.getElementById("alertBar"), c=conteo();
  bar.className="alertbar"+(c.off?" crit":c.bajo?" warn":"");
  var t,dd;
  if(c.off){ t=c.off+(c.off===1?" agotado":" agotados")+(c.bajo?" · "+c.bajo+" por acabarse":"");
    dd=c.faltan.slice(0,3).join(" · ")+(c.faltan.length>3?" +"+(c.faltan.length-3):""); }
  else if(c.bajo){ t=c.bajo+" por acabarse";
    dd=c.pocas.slice(0,3).join(" · ")+(c.pocas.length>3?" +"+(c.pocas.length-3):""); }
  else { t="Carta completa"; dd="Todo disponible"; }
  bar.innerHTML='<i class="'+(c.off?"i-off":c.bajo?"i-bajo":"i-ok")+'"></i>'+
    '<span class="txt">'+esc(t)+'<em>'+esc(dd)+'</em></span><span class="go">Revisar</span>';
  document.getElementById("reloj").textContent = cfg.tocado
    ? new Date(cfg.tocado).toLocaleTimeString("es-CL",{hour:"2-digit",minute:"2-digit"})
    : "—";
}

/* ---------- reveal ---------- */
function clearTimer(){ if(rv.timer){ clearTimeout(rv.timer); rv.timer=null; } }
function pintarReveal(){
  var a=actual(); if(a.v!=="com") return;
  var d=find(COMIDA,a.p), rev=document.getElementById("rev"); if(!rev) return;
  rev.classList.toggle("live", rv.step>0);
  var mks=rev.querySelectorAll(".mk");
  for(var i=0;i<mks.length;i++){ mks[i].classList.toggle("in", i<rv.step); mks[i].classList.toggle("cur", i===rv.step-1); }
  var cb=document.getElementById("capbar");
  if(rv.step>0){
    var c=d.capas[rv.step-1];
    cb.querySelector(".cstep").textContent="Capa "+rv.step+" de "+rv.total;
    cb.querySelector(".cn").textContent=c.n;
    cb.querySelector(".cd").textContent=c.d;
    cb.classList.add("show");
  } else cb.classList.remove("show");
  var pr=document.getElementById("prog").children;
  for(var j=0;j<pr.length;j++) pr[j].classList.toggle("on", j<rv.step);
  var ly=document.getElementById("lays").children;
  for(var k=0;k<ly.length;k++) ly[k].classList.toggle("done", k<rv.step);
  var p=document.getElementById("revP"), s=document.getElementById("revS");
  if(rv.step===0){ p.textContent="Mostrar cómo se arma"; s.textContent="Ver todo"; }
  else if(rv.step<rv.total){ p.textContent="Siguiente capa"; s.textContent="Ver todo"; }
  else { p.textContent="Repetir"; s.textContent="Reiniciar"; }
}
function avanzar(auto){
  clearTimer();
  if(rv.step>=rv.total){ rv.step=0; pintarReveal(); return; }
  rv.step++; pintarReveal();
  if(auto && rv.step<rv.total){
    var lento=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    rv.timer=setTimeout(function(){ avanzar(true); }, lento?2600:2000);
  }
}

/* ---------- eventos ---------- */
document.addEventListener("click", function(ev){
  var nivel=ev.target.closest("[data-nivel]");
  if(nivel && !ev.target.closest("button")){ volverA(+nivel.dataset.nivel); return; }
  var b=ev.target.closest("button");
  if(!b && actual().v==="com" && ev.target.closest("#rev")){ avanzar(false); return; }
  if(!b) return;

  if(b.id==="back"){ salir(); return; }
  if(b.id==="alertBar"){
    if(actual().v==="revisar") return;
    pila=[pila[0]]; entrar("revisar",null,"Revisar"); return;
  }
  if(b.dataset.ir==="horno"){ entrar("horno",null,"El horno"); return; }
  if(b.dataset.hemp){
    var he=b.dataset.hemp;
    if(cargando.sel[he]) delete cargando.sel[he]; else cargando.sel[he]=1;
    dir=""; pintar(); return;
  }
  if(b.dataset.hpre){ cargando.min=+b.dataset.hpre; dir=""; pintar(); return; }
  if(b.dataset.hlata){ cargando.n=(+b.dataset.hlata)*LATA; dir=""; pintar(); return; }
  if(b.id==="resetHorno"){ resetHorno=true; dir=""; pintar(); return; }
  if(b.id==="resetNo"){ resetHorno=false; dir=""; pintar(); return; }
  if(b.id==="resetSi"){
    cfg.horno=[]; save(); resetHorno=false;
    avisar("Horno vacío"); dir=""; pintar(); return;
  }
  if(b.dataset.hn){
    var dn=+b.dataset.hn;
    cargando.n = Math.max(1, Math.min(99, (dn===12||dn===24) ? cargando.n+dn : cargando.n+dn));
    dir=""; pintar(); return;
  }
  if(b.dataset.hm){
    cargando.min = Math.max(1, Math.min(60, cargando.min+(+b.dataset.hm)));
    dir=""; pintar(); return;
  }
  if(b.id==="alHorno"){
    var sels=selN();
    if(!sels.length) return;
    sels.forEach(function(id){ meterAlHorno(id, cargando.n, cargando.min); });
    campana(1);
    avisar(sels.length===1
      ? cargando.n+" "+((find(EMP,sels[0])||{}).n||"")+" al horno"
      : (sels.length*cargando.n)+" unidades al horno · "+sels.length+" variedades");
    cargando.sel={};
    dir=""; pintar(); return;
  }
  if(b.dataset.sacar){
    var hd=hornadas().filter(function(x){ return x.id===b.dataset.sacar; })[0];
    if(hd) sacarHornada(hd);
    dir=""; pintar(); return;
  }
  if(b.dataset.abrir){
    abiertoEn = (abiertoEn===b.dataset.abrir) ? null : b.dataset.abrir;
    dir=""; pintar(); return;
  }
  if(b.dataset.uni){
    var ku=b.dataset.uni, du=+b.dataset.d;
    fijarUni(ku, du===12 ? uni(ku)+12 : uni(ku)+du);
    dir=""; pintar(); return;
  }
  if(b.id==="todoOk"){
    todasLasClaves().forEach(function(k){ delete cfg.st[k]; });
    save(); vigilar(); dir=""; pintar(); return;
  }
  if(b.dataset.ir==="stock"){ entrar("stock",null,"Control de stock"); return; }
  if(b.id==="sonBtn"){
    cfg.son=cfg.son?0:1; save(); dir=""; pintar();
    if(cfg.son){ campana(1); avisar("Campana activada",true); } else avisar("Campana en silencio");
    return;
  }
  if(b.dataset.ir==="carta"){ entrar("carta",null,"Estudio"); return; }
  if(b.dataset.grupo){
    var g=GRUPOS_STOCK.filter(function(x){ return x.id===b.dataset.grupo; })[0];
    abiertoEn=null; entrar("grupo", b.dataset.grupo, g.n); return;
  }
  if(b.dataset.sec){ entrar("lista", b.dataset.sec, secDe(b.dataset.sec).n); return; }
  if(b.dataset.ir==="gloss"){ entrar("gloss",null,"Diccionario"); return; }
  if(b.dataset.ir==="notas"){ entrar("notas",null,"Mis notas"); return; }
  if(b.dataset.notadel){ fijarNota(b.dataset.notadel,""); dir=""; pintar(); return; }
  if(b.dataset.ir==="practica"){ prac={i:0,ver:false,baraja:null,tipo:prac.tipo}; entrar("practica",null,"Ponerse a prueba"); return; }
  if(b.dataset.prac){ prac.tipo=b.dataset.prac; prac.i=0; prac.ver=false; prac.baraja=null; dir=""; pintar(); return; }
  if(b.id==="pVer"){
    if(prac.ver){ prac.ver=false; prac.i=(prac.i+1)%prac.baraja.length; }
    else prac.ver=true;
    dir=""; pintar(); return;
  }
  if(b.id==="pAnt"){ prac.ver=false; prac.i=(prac.i-1+prac.baraja.length)%prac.baraja.length; dir=""; pintar(); return; }
  if(b.id==="pBarajar"){ prac.baraja=null; prac.i=0; prac.ver=false; dir=""; pintar(); return; }
  if(b.dataset.ficha){
    var pr=b.dataset.ficha.split(":"); trLang=null;
    var nombre = pr[0]==="com"?find(COMIDA,pr[1]).n
      : pr[0]==="emp"?find(EMP,pr[1]).n
      : pr[0]==="beb"?nEs(find(BEB,pr[1])) : find(PAST,pr[1]).n.es;
    entrar(pr[0], pr[1], nombre); return;
  }

  if(b.dataset.cyc){
    var id=b.dataset.cyc, s=est(id);
    cfg.st[id]= s==="ok"?"push":s==="push"?"bajo":s==="bajo"?"off":"ok";
    save(); vigilar(); dir=""; pintar(); return;
  }
  if(b.id==="empTodo"){ EMP.forEach(function(x){ delete cfg.st["E"+x.id]; }); save(); vigilar(); dir=""; pintar(); return; }
  if(b.id==="empNada"){ EMP.forEach(function(x){ cfg.st["E"+x.id]="off"; }); save(); vigilar(); dir=""; pintar(); return; }
  if(b.dataset.milk){ cfg.milks[b.dataset.milk]=cfg.milks[b.dataset.milk]?0:1; save(); dir=""; pintar(); return; }
  if(b.dataset.decaf){ cfg.decaf=cfg.decaf?0:1; save(); dir=""; pintar(); return; }
  if(b.id==="reset"){
    COMIDA.forEach(function(d){ cfg.st[d.id]="ok"; });
    BEB.forEach(function(d){ cfg.st[d.id]="ok"; });
    PAST.forEach(function(p){ cfg.st["P"+p.id]="ok"; });
    EMP.forEach(function(x){ cfg.st["E"+x.id]="ok"; });
    MILKS.forEach(function(m){ cfg.milks[m.id]=1; });
    cfg.decaf=1; save(); antes=foto(); dir=""; pintar(); return;
  }
  if(b.dataset.set){ cfg.st[b.dataset.set]=b.dataset.v; save(); vigilar(); dir=""; pintar(); return; }
  if(b.dataset.tr){ trLang=(trLang===b.dataset.tr)?null:b.dataset.tr; dir=""; pintar(); return; }
  if(b.id==="revP"){
    if(rv.step===0) avanzar(true);
    else if(rv.step<rv.total) avanzar(false);
    else { rv.step=0; clearTimer(); pintarReveal(); }
    return;
  }
  if(b.id==="revS"){ clearTimer(); rv.step=(rv.step>=rv.total)?0:rv.total; pintarReveal(); return; }
});

/* ---------- cuando va dentro de la carta ----------
   El Control se abre en su propio marco desde el sello del pie de la carta.
   En ese caso muestra su propia salida, para no tener dos encabezados. */
(function(){
  var dentroDeLaCarta=false;
  try{ dentroDeLaCarta = window.parent && window.parent !== window; }catch(e){ dentroDeLaCarta=true; }
  if(!dentroDeLaCarta) return;
  var btn=document.getElementById("volverCarta");
  btn.hidden=false;
  btn.addEventListener("click", function(){
    /* postMessage funciona aunque el marco no comparta origen con la carta */
    try{ window.parent.postMessage({ea:"cerrar-salon"}, "*"); }catch(e){}
  });
})();

pintar();
revisarHorno();
arrancarReloj();
</script>

<style>
/* ===== Horizontal y pantallas anchas ==============================

   media pantalla en blanco y el diálogo se cortaba por abajo. Estas
   reglas no cambian nada del diseño vertical; solo reparten el ancho
   cuando existe, y aprietan el alto cuando falta.
   ================================================================= */
@media (min-width:720px){
