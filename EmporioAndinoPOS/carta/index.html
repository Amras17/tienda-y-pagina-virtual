<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><script>/* EmporioAndinoPOS: deja que el lanzador escuche errores desde el inicio */try{if(parent!==window&&parent.__eaGancho)parent.__eaGancho(window)}catch(e){}</script></head><body>
<title>Carta Interactiva</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Karla:ital,wght@0,400;0,500;0,700&display=swap">
<style>
/* ===== Paleta Emporio Andino =====
   Turquesa #40E0D0 · Arena #D9CBA3 · Terracota #E2725B · Madera clara #C19A6B
   Gris volcánico #4B4B4B · Coral #FF7F50 · Dorado envejecido #B8860B
   Los tonos profundos y los lavados son tintes de esos mismos colores,
   usados donde el texto necesita contraste suficiente para leerse. */
:root{
  --turquesa:#40E0D0; --turquesa-ink:#7DEFD8; --turquesa-soft:rgba(64,224,208,.18);
  --arena:#D9CBA3;     --arena-soft:rgba(217,203,163,.20);
  --terracota:#E2725B; --terracota-ink:#FFB4A0; --terracota-soft:rgba(226,114,91,.22);
  --madera:#C19A6B;    --madera-ink:#EBCFA6;
  --volcan:#4B4B4B;
  --coral:#FF7F50;     --coral-ink:#FFB499; --coral-soft:rgba(255,127,80,.20);
  --dorado:#E3B33C;    --dorado-soft:rgba(227,179,60,.20);

  /* Fondo vivo: turquesa profundo con luz cálida entrando y bandas que cruzan.
     Las tarjetas son vidrio oscuro para que el texto blanco se lea encima. */
  --bg:#0B4A48; --cielo-alto:#12706B; --cielo-bajo:#062E30; --luz:rgba(255,196,132,.55); --suelo:rgba(184,134,11,.34);
  --velo-1:rgba(255,190,120,.42); --velo-2:rgba(11,74,72,0);
  --velo-3:rgba(226,114,91,.44);  --velo-4:rgba(64,224,208,.34);
  --surface:rgba(6,42,44,.62); --surface-2:rgba(255,255,255,.10); --surface-3:rgba(6,42,44,.44);
  --ink:#FFFFFF; --ink-soft:rgba(255,255,255,.76); --line:rgba(255,255,255,.22);
  --accent:#E2725B; --on-accent:#FFFFFF;
  --ok:#7DEFD8; --ok-soft:rgba(125,239,216,.16);
  --avisa:#FFCF6B; --avisa-soft:rgba(255,207,107,.18);
  --falta:#FF9E82; --falta-soft:rgba(255,158,130,.18);

  --c-espresso:#4A2C18; --c-crema:#C19A6B; --c-filter:#8A5530; --c-tea:#B8860B;
  --c-milk:#F0E4CC; --c-foam:#FDF8EE; --c-choc:#5E3722; --c-milkchoc:#B07D57;
  --c-tonic:#DCF6F2; --c-juice:#E2A33C; --c-chanar:#A9702F; --c-ice:#FFFFFF;
  --c-matcha:#8FAE5B; --c-chai:#C08E5A; --c-golden:#B8860B; --c-berry:#C24A6B;
  --c-soda:#7C5B3F; --c-water:#DCF6F2;

  --shadow:0 1px 2px rgba(0,0,0,.20), 0 14px 32px -16px rgba(0,0,0,.55);
  --r:14px;
}
/* Ya no hay dos temas: la carta es siempre la noche del desierto, texto
   blanco sobre vidrio oscuro. Así se ve igual en cualquier teléfono, tenga o
   no el modo oscuro puesto. */
:root[data-theme="dark"],:root[data-theme="light"]{color-scheme:dark}

*{box-sizing:border-box}
/* El suelo turquesa deja de ser plano: se lee como cielo del desierto,
   con la luz cálida entrando por arriba y un tono más profundo al pie. */
body{margin:0; background:var(--bg); color:var(--ink);
  background-image:
    radial-gradient(135% 58% at 50% -10%, var(--luz) 0%, transparent 60%),
    linear-gradient(0deg, var(--suelo) 0%, transparent 16%),
    linear-gradient(180deg, var(--cielo-alto) 0%, var(--bg) 42%, var(--cielo-bajo) 100%);
  background-attachment:fixed; background-repeat:no-repeat;
  min-height:100%;
  font-family:"Karla","Hiragino Sans","Yu Gothic","Noto Sans JP","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased}
/* La paleta se desplaza: una banda alta con los mismos siete colores cruza la
   pantalla de abajo hacia arriba en poco más de un minuto, de modo que el
   turquesa se entibia con arena, luego con coral y dorado, y vuelve. Solo se
   mueve (transform), así que la tarjeta gráfica lo resuelve sin repintar. */
body::before{content:""; position:fixed; left:-25%; right:-25%; top:-100%; height:300%;
  background:linear-gradient(176deg,
    var(--velo-1) 0%, var(--velo-2) 14%, var(--velo-3) 30%, var(--velo-2) 44%,
    var(--velo-4) 58%, var(--velo-2) 72%, var(--velo-1) 88%, var(--velo-3) 100%);
  opacity:.9; pointer-events:none; z-index:-1; will-change:transform;
  transform:translate3d(0,0,0); animation:deriva 68s ease-in-out infinite alternate}
@keyframes deriva{
  from{transform:translate3d(-2%,0,0)}
  to{transform:translate3d(2%,-30%,0)}}
/* Y una luz cálida suelta que se pasea por encima, con otro ritmo. */
body::after{content:""; position:fixed; inset:-35% -30% auto -30%; height:85%;
  background:radial-gradient(46% 50% at 32% 42%, var(--luz) 0%, transparent 64%);
  opacity:.5; pointer-events:none; z-index:-1; will-change:transform,opacity;
  animation:sol 53s ease-in-out infinite alternate}
@keyframes sol{
  0%{transform:translate3d(-10%,-4%,0) scale(1); opacity:.28}
  50%{opacity:.62}
  100%{transform:translate3d(14%,8%,0) scale(1.18); opacity:.40}}
h1,h2,h3{font-family:"Bricolage Grotesque","Karla",system-ui,sans-serif; text-wrap:balance; margin:0;
  color:var(--ink); text-shadow:0 1px 2px rgba(0,0,0,.42), 0 4px 16px rgba(0,0,0,.30)}
/* Los títulos que van sobre el turquesa necesitan algo más de apoyo */
.gate h2,.familia,.bft{text-shadow:0 2px 4px rgba(0,0,0,.5), 0 6px 22px rgba(0,0,0,.35)}
body{text-shadow:0 1px 2px rgba(0,0,0,.28)}
button{font:inherit}
button:focus-visible,summary:focus-visible{outline:2.5px solid var(--accent); outline-offset:2px}
.wrap{max-width:480px; margin:0 auto; padding:0 16px 48px; display:flex; flex-direction:column; gap:14px}

/* ---------- cabecera con ruta de capas ---------- */
.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:30; background:var(--bg);
  background:color-mix(in srgb, var(--bg) 58%, transparent);
  backdrop-filter:blur(14px) saturate(1.2); -webkit-backdrop-filter:blur(14px) saturate(1.2);
  padding-block:10px; margin:0 -16px; padding-inline:16px; border-bottom:1px solid var(--line);
  display:grid; gap:8px}
.navrow{display:flex; align-items:center; gap:9px}
.back{border:1.5px solid var(--line); background:var(--surface); color:var(--ink);
  width:34px; height:34px; border-radius:50%; cursor:pointer; flex:none;
  display:grid; place-items:center; padding:0}
.back svg{width:17px; height:17px}
.navrow h1{font-size:15px; font-weight:800; letter-spacing:-.01em; flex:1; min-width:0;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.corner{border:1.5px solid var(--line); background:var(--surface); color:var(--ink-soft);
  font-size:11.5px; font-weight:700; padding:7px 11px; border-radius:999px; cursor:pointer;
  flex:none; line-height:1}
.ruta{display:flex; align-items:center; gap:5px; font-size:10px; font-weight:700;
  letter-spacing:.1em; text-transform:uppercase; color:var(--ink); opacity:.72; overflow:hidden}
.ruta span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:11ch}
.ruta span.on{color:var(--terracota-ink); max-width:16ch}
.ruta i{font-style:normal; opacity:.5; flex:none}
.pasos[hidden]{display:none}
.pasos{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.pasos .pn{font-size:10px; font-weight:800; letter-spacing:.1em; text-transform:uppercase;
  background:var(--accent); color:var(--on-accent); padding:3px 8px; border-radius:999px; flex:none}
.pasos .pt{font-size:11.5px; font-weight:700; color:var(--ink); opacity:.8; min-width:0;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.pasos .pb{display:flex; gap:3px; margin-left:auto; flex:none}
.pasos .pb i{width:14px; height:4px; border-radius:2px; background:rgba(255,255,255,.28); display:block;
  transition:background .3s ease, width .3s ease}
.pasos .pb i.on{background:var(--accent)}
.pasos .pb i.ahora{width:20px}
.pasosnota{font-size:11px; color:var(--ink); opacity:.7; text-align:center; margin:2px 0 0; line-height:1.5}
.niveles{flex:none; margin-left:auto; width:17px; height:17px; border-radius:50%; background:var(--accent); color:var(--on-accent); display:grid; place-items:center; opacity:1; font-size:9.5px; font-weight:800; letter-spacing:.1em; font-variant-numeric:tabular-nums; letter-spacing:0}



/* ---------- capas ---------- */
.layer{display:grid; gap:14px}
.layer.push{animation:capaAvanza .34s cubic-bezier(.2,.75,.3,1) both}
.layer.pop{animation:capaVuelve .3s cubic-bezier(.2,.75,.3,1) both}
@keyframes capaAvanza{from{transform:translateX(30px); opacity:0} to{transform:none; opacity:1}}
@keyframes capaVuelve{from{transform:translateX(-24px); opacity:0} to{transform:none; opacity:1}}

/* ---------- portada de selección ---------- */
.gate{display:grid; gap:13px; padding-top:6px}
.gate .kicker{font-size:10px; font-weight:800; letter-spacing:.2em; text-transform:uppercase;
  color:var(--terracota-ink); text-align:center}
.gate h2{font-size:26px; font-weight:800; letter-spacing:-.025em; line-height:1.14; text-align:center}
.gate p{font-size:13px; color:var(--ink); opacity:.75; margin:0; text-align:center; max-width:34ch; justify-self:center}
.opts{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.opt{border:1.5px solid var(--line); background:var(--surface); color:var(--ink); border-radius:16px;
  padding:0; cursor:pointer; box-shadow:var(--shadow); overflow:hidden; text-align:left; display:grid;
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px)}
.opt:hover{border-color:var(--accent); transform:translateY(-1px)}
.opt .tile{height:78px; background:var(--surface-2); position:relative; overflow:hidden; display:grid; place-items:center}
.opt .tile img{width:100%; height:100%; object-fit:cover; display:block}
.opt .tile svg{width:52px; height:52px}
.opt .lbl{padding:10px 11px 12px}
.opt .lbl b{display:block; font-family:"Bricolage Grotesque",system-ui,sans-serif;
  font-size:15px; font-weight:800; letter-spacing:-.01em; line-height:1.15}
.opt .lbl small{display:block; font-size:11px; color:var(--ink-soft); margin-top:3px; line-height:1.35}
.opt.wide{grid-column:1/-1; grid-template-columns:96px 1fr; align-items:center}
.opt.wide .tile{height:100%; min-height:74px}
.opt.plain{display:block; padding:15px 14px}
.opt.plain b{display:block; font-family:"Bricolage Grotesque",system-ui,sans-serif; font-size:16px; font-weight:800}
.opt.plain small{display:block; font-size:11.5px; color:var(--ink-soft); margin-top:4px; line-height:1.4}

/* ---------- piezas comunes ---------- */
.nota{font-size:12px; color:var(--ink-soft); background:var(--surface);
  border:1px solid var(--line); border-radius:12px; padding:10px 12px;
  backdrop-filter:blur(9px); -webkit-backdrop-filter:blur(9px)}
.block{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:14px; box-shadow:var(--shadow);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px)}
.block > h3{font-size:14.5px; font-weight:800; letter-spacing:-.01em}
.block > .bs{font-size:11.5px; color:var(--ink-soft); margin:3px 0 11px}
.plabel{font-size:10px; font-weight:800; letter-spacing:.13em; text-transform:uppercase;
  color:var(--terracota-ink); display:flex; align-items:center; gap:8px}
.plabel::after{content:""; flex:1; height:1px; background:rgba(255,255,255,.28)}
.list{display:grid; gap:9px}
.card{display:grid; grid-template-columns:86px 1fr; gap:11px; align-items:center; width:100%;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:9px;
  box-shadow:var(--shadow); cursor:pointer; text-align:left; color:var(--ink);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px)}
.card:hover{border-color:var(--accent)}
.card .thumb{width:86px; height:70px; border-radius:10px; object-fit:cover; display:block; background:var(--surface-2)}
.card .art{width:86px; display:grid; place-items:center}
.card.art-s{grid-template-columns:62px 1fr}
.card.art-s .art{width:62px}
.card .n{font-size:15.5px; font-weight:700; line-height:1.18; letter-spacing:-.01em;
  font-family:"Bricolage Grotesque",system-ui,sans-serif}
.card .d{font-size:11.5px; color:var(--ink-soft); margin-top:3px; line-height:1.38;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.card .meta{display:flex; align-items:center; gap:5px; margin-top:6px; flex-wrap:wrap}
.card.gone{opacity:.5} .card.gone .thumb{filter:grayscale(1)}
.mini{display:grid; grid-template-columns:repeat(2,1fr); gap:8px}
.mcard{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:10px;
  box-shadow:var(--shadow); cursor:pointer; text-align:left; color:var(--ink); display:grid; gap:6px;
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px)}
.mcard:hover{border-color:var(--accent)}
.mcard.gone{opacity:.5}
.mcard .mn{font-size:12.5px; font-weight:700; line-height:1.25}
.egrid{display:grid; grid-template-columns:1fr 1fr; gap:9px}
.ecard{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:11px;
  box-shadow:var(--shadow); cursor:pointer; text-align:left; color:var(--ink); display:grid; gap:7px;
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px)}
.ecard:hover{border-color:var(--accent)}
.ecard.gone{opacity:.5}
.ecard .etop{display:flex; align-items:center; gap:8px}
.ecard .en{font-size:14.5px; font-weight:800; line-height:1.1; letter-spacing:-.01em;
  font-family:"Bricolage Grotesque",system-ui,sans-serif}
.ecard .ed{font-size:11px; color:var(--ink-soft); line-height:1.35}

.badge{font-size:9.5px; font-weight:800; letter-spacing:.06em; text-transform:uppercase;
  padding:3px 7px; border-radius:999px; line-height:1.3}
.b-off{background:var(--falta); color:var(--on-accent)}
.b-pocas{background:var(--dorado); color:#FFF8E9}
.b-hoy{background:var(--terracota); color:#FFF8F2}
.b-veg{background:var(--turquesa-soft); color:var(--turquesa-ink)}
.b-vegan{background:var(--turquesa-ink); color:var(--on-accent)}
.b-opt{background:transparent; border:1px solid var(--turquesa-ink); color:var(--turquesa-ink)}
.b-sg{background:transparent; border:1px solid var(--madera-ink); color:var(--madera-ink)}
.b-casa{background:var(--arena-soft); color:var(--madera-ink)}
.b-inc{background:var(--arena-soft); color:var(--madera-ink)}
.b-local{background:transparent; border:1px solid var(--turquesa-ink); color:var(--turquesa-ink)}
.b-hot{background:var(--terracota-soft); color:var(--terracota-ink)}
.b-cold{background:var(--turquesa-soft); color:var(--turquesa-ink)}

.bigbtn{width:100%; border:0; border-radius:13px; padding:15px; font-weight:800; font-size:15.5px;
  background:var(--accent); color:var(--on-accent); cursor:pointer; box-shadow:var(--shadow);
  font-family:"Bricolage Grotesque",system-ui,sans-serif; letter-spacing:-.01em}
.bigbtn:disabled{opacity:.45; cursor:not-allowed}
.ghostbtn{width:100%; border:1.5px solid var(--line); border-radius:13px; padding:13px;
  font-weight:700; font-size:14px; background:var(--surface); color:var(--ink-soft); cursor:pointer}
.ghostbtn:hover{border-color:var(--accent); color:var(--accent)}
.btnrow{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.step{display:flex; align-items:center; gap:2px; background:var(--surface-3);
  border:1.5px solid var(--line); border-radius:999px; padding:3px}
.step button{width:30px; height:30px; border:0; background:transparent; color:var(--ink);
  font-size:18px; font-weight:700; line-height:1; border-radius:50%; cursor:pointer}
.step .cnt{min-width:32px; text-align:center; font-size:16px; font-weight:800;
  font-variant-numeric:tabular-nums; font-family:"Bricolage Grotesque",system-ui,sans-serif}
.facts{display:grid}
.fact{display:grid; grid-template-columns:96px 1fr; gap:10px; padding:9px 0; border-bottom:1px solid var(--line)}
.fact:last-child{border-bottom:0}
.fact .k{font-size:10px; font-weight:800; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-soft); padding-top:2px}
.fact .v{font-size:13px; line-height:1.4}
footer{font-size:11px; color:var(--ink); opacity:.65; text-align:center; line-height:1.6;
  padding-top:10px; border-top:1px solid rgba(255,255,255,.22)}

/* ---------- entrada escalonada de las tarjetas ---------- */
.layer.push .list > *, .layer.push .mini > *, .layer.push .egrid > *,
.layer.push .opts > *, .layer.push .pills > *{animation:entraFicha .34s cubic-bezier(.2,.75,.3,1) both}
.layer.push .list > :nth-child(1),.layer.push .mini > :nth-child(1),.layer.push .egrid > :nth-child(1),.layer.push .opts > :nth-child(1){animation-delay:.03s}
.layer.push .list > :nth-child(2),.layer.push .mini > :nth-child(2),.layer.push .egrid > :nth-child(2),.layer.push .opts > :nth-child(2){animation-delay:.07s}
.layer.push .list > :nth-child(3),.layer.push .mini > :nth-child(3),.layer.push .egrid > :nth-child(3),.layer.push .opts > :nth-child(3){animation-delay:.11s}
.layer.push .list > :nth-child(4),.layer.push .mini > :nth-child(4),.layer.push .egrid > :nth-child(4),.layer.push .opts > :nth-child(4){animation-delay:.15s}
.layer.push .list > :nth-child(5),.layer.push .mini > :nth-child(5),.layer.push .egrid > :nth-child(5),.layer.push .opts > :nth-child(5){animation-delay:.19s}
.layer.push .list > :nth-child(n+6),.layer.push .mini > :nth-child(n+6),.layer.push .egrid > :nth-child(n+6),.layer.push .opts > :nth-child(n+6){animation-delay:.22s}
@keyframes entraFicha{from{transform:translateY(12px); opacity:0} to{transform:none; opacity:1}}

/* ---------- respuesta al toque ---------- */
.opt,.card,.mcard,.ecard,.bigbtn,.ghostbtn,.step button,.pill{
  transition:transform .12s ease, border-color .18s ease, box-shadow .18s ease}
.opt:active,.card:active,.mcard:active,.ecard:active,.bigbtn:active,.ghostbtn:active,.pill:active{transform:scale(.975)}
.step button:active{transform:scale(.88)}
.opt .tile img{transition:transform .5s cubic-bezier(.2,.75,.3,1)}
.opt:active .tile img{transform:scale(1.06)}

/* ---------- aviso flotante ---------- */
.toast{position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px));
  transform:translate(-50%,16px); z-index:80; max-width:min(92vw,420px);
  background:var(--ink); color:var(--surface); border-radius:13px; padding:11px 15px;
  font-size:12.5px; font-weight:700; line-height:1.4; text-align:center;
  box-shadow:0 14px 34px -14px rgba(0,0,0,.6); opacity:0; pointer-events:none;
  transition:opacity .2s ease, transform .24s cubic-bezier(.2,.75,.3,1)}
.toast.ver{opacity:1; transform:translate(-50%,0)}
.toast.campana{background:var(--accent); color:var(--on-accent)}


/* ---------- guía de formas de empanada ---------- */
.guia{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:14px; box-shadow:var(--shadow); display:grid; gap:10px}
.guia .gt{font-family:"Bricolage Grotesque",system-ui,sans-serif; font-size:14.5px; font-weight:800; letter-spacing:-.01em}
.guia .gs{font-size:11.5px; color:var(--ink-soft); line-height:1.45; margin-top:-6px}
.gformas{display:grid; grid-template-columns:repeat(3,1fr); gap:9px}
.gf{display:grid; justify-items:center; gap:4px; padding:9px 4px; border-radius:11px;
  background:var(--surface-3); border:1px solid var(--line); color:var(--terracota-ink)}
.gf span{font-size:10.5px; font-weight:700; color:var(--ink); text-align:center; line-height:1.2}

/* ---------- familias de la barra ---------- */
.familia{font-family:"Bricolage Grotesque",system-ui,sans-serif; font-size:19px; font-weight:800;
  letter-spacing:-.02em; color:var(--ink); margin-top:6px; padding-bottom:7px;
  border-bottom:2.5px solid var(--accent); display:flex; align-items:baseline; gap:8px}

/* ---------- horario de servicio ---------- */

/* ---------- bienvenida ----------
   Nada se cruza: primero está el logo sobre fondo liso, después el logo se va,
   recién entonces desaparece el velo y entra la pantalla de idioma. Una cosa
   termina antes de que empiece la siguiente. */
#splash{position:fixed; inset:0; z-index:90; display:grid; place-items:center;
  background:var(--bg)}
#splash.off{display:none}
.sp{display:grid; justify-items:center; padding:24px}
.halo{position:relative; display:grid; place-items:center}
/* Las ondas: tres anillos que salen del logo y se abren, como una carga.
   Escala y opacidad solamente, para que el teléfono no repinte nada. */
.halo i{position:absolute; width:150px; height:150px; border-radius:50%;
  border:2px solid var(--turquesa); opacity:0; pointer-events:none;
  animation:onda 2.1s cubic-bezier(.22,.7,.3,1) infinite}
.halo i:nth-child(2){border-color:var(--terracota); animation-delay:.7s}
.halo i:nth-child(3){border-color:var(--dorado); animation-delay:1.4s}
@keyframes onda{
  0%{transform:scale(.92); opacity:0}
  18%{opacity:.7}
  100%{transform:scale(2.05); opacity:0}}
.sp img.mark{width:150px; height:150px; border-radius:50%; display:block; position:relative;
  box-shadow:0 12px 34px -14px rgba(0,0,0,.55);
  animation:entraMarca .95s cubic-bezier(.2,1.25,.32,1) both}
@keyframes entraMarca{
  0%{transform:scale(.68); opacity:0}
  60%{opacity:1}
  100%{transform:none; opacity:1}}
/* Al salir se van juntos: primero dejan de nacer ondas nuevas */
#splash.saliendo img.mark{animation:saleMarca .3s ease-in forwards}
#splash.saliendo .halo i{animation:none; opacity:0}
@keyframes saleMarca{to{transform:scale(.92); opacity:0}}

/* La página espera detrás, invisible, hasta que el velo se haya ido */
.wrap.oculta{opacity:0}
.wrap.entra{animation:entraApp .36s cubic-bezier(.2,.8,.3,1) both}
@keyframes entraApp{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none}}
@media (prefers-reduced-motion:reduce){

  .wrap.oculta{opacity:1}
}

/* ---------- la cuenta: el cierre del video, vuelto pantalla viva ----------

#cuenta{position:fixed; inset:0; z-index:97; overflow:hidden; color:#fff;

  align-items:center; justify-content:center; text-align:center; padding:60px 22px 8px}
.ctlogo{position:relative; width:min(46vw,190px); aspect-ratio:1; display:grid; place-items:center;
  margin-bottom:28px}
.ctmark{position:relative; z-index:2; width:100%; height:100%; border-radius:50%; object-fit:cover;
  display:block; border:5px solid #F3E9D8; box-shadow:0 18px 44px -16px rgba(0,0,0,.75); opacity:0}
#cuenta.on .ctmark{animation:ctEntra .62s cubic-bezier(.2,.9,.3,1) both}
@keyframes ctEntra{0%{opacity:0; transform:scale(1.4); filter:blur(16px)}
  70%{opacity:1; filter:blur(0)} 100%{opacity:1; transform:none; filter:none}}

@keyframes ctGira{to{transform:rotate(360deg)}}

.ctflash{position:absolute; inset:0; z-index:1; border-radius:50%; border:2px solid rgba(255,255,255,.9); opacity:0}

@keyframes ctFlash{0%{opacity:.9; transform:scale(1)} 100%{opacity:0; transform:scale(1.65)}}
/* Desde que termina la entrada, tres ondas salen del logo sin parar: es lo
   que se ve de reojo desde el otro lado del salón. */

.ctondas i:nth-child(2){border-color:#3ABCFC}

#cuenta.on .ctondas i{animation:ctOnda 2.4s cubic-bezier(.22,.7,.3,1) 2.4s infinite}

@keyframes ctOnda{0%{transform:scale(1); opacity:0} 15%{opacity:.85} 100%{transform:scale(2.35); opacity:0}}
.ctvapor{position:absolute; left:50%; bottom:100%; width:62px; height:56px; margin-bottom:2px;

.hjl{display:grid; grid-template-columns:52px 1fr auto; gap:10px; align-items:center;
  background:var(--surface); border:1px solid var(--line); border-radius:13px; padding:9px 10px}
.hjl img,.hjl .art{width:52px; height:44px; border-radius:9px; object-fit:cover; display:grid;
  place-items:center; background:var(--surface-2)}
.hjli .n{font-size:14px; font-weight:700; line-height:1.2}
.hjli .o{font-size:11px; color:var(--ink-soft); margin-top:2px; line-height:1.35}
.hjsug{margin-top:16px; border-top:1px dashed var(--line); padding-top:12px}
.hjsugt{font-size:10px; font-weight:800; letter-spacing:.13em; text-transform:uppercase;
  color:var(--ink-soft); margin-bottom:8px}
.hjsugl{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px}
.hjsugl button{flex:none; width:96px; border:1px solid var(--line); background:var(--surface-3);
  border-radius:12px; padding:8px; cursor:pointer; color:var(--ink); display:grid; gap:5px; justify-items:center}
.hjsugl img,.hjsugl .art{width:72px; height:46px; border-radius:8px; object-fit:cover;
  display:grid; place-items:center}
.hjsugl span{font-size:11px; font-weight:700; line-height:1.2; text-align:center}
body.conhoja{overflow:hidden}

/* ---------- Control de Salón, dentro de la misma carta ---------- */
#salon{position:fixed; inset:0; z-index:95; background:var(--bg)}
#salon[hidden]{display:none}
.salonbody{position:relative; width:100%; height:100%}
#salonFrame{display:block; width:100%; height:100%; border:0; background:var(--bg)}
.salonfall{position:absolute; inset:0; display:grid; align-content:center; gap:10px;
  padding:28px 22px; text-align:center; background:var(--bg)}
.salonfall[hidden]{display:none}
.salonfall b{font-family:"Bricolage Grotesque",system-ui,sans-serif; font-size:19px; font-weight:800}
.salonfall p{font-size:13.5px; color:var(--ink-soft); line-height:1.5; margin:0}
.salonfall .bigbtn{text-decoration:none; display:block; text-align:center}

/* ---------- idioma ---------- */
.langgrid{display:grid; grid-template-columns:1fr 1fr; gap:9px}
.langgrid button{border:1.5px solid var(--line); background:var(--surface); color:var(--ink);
  border-radius:14px; padding:16px 10px; cursor:pointer; box-shadow:var(--shadow);
  font-family:"Bricolage Grotesque",system-ui,sans-serif; font-weight:800; font-size:18px; line-height:1.15}
.langgrid button:hover{border-color:var(--accent)}
.langgrid button small{display:block; font-family:"Karla",sans-serif; font-weight:500;
  font-size:11px; color:var(--ink-soft); margin-top:3px}
.langgrid button.wide{grid-column:1/-1}
.marca{display:flex; align-items:center; justify-content:center; gap:11px; padding-bottom:2px}
.marca img.mark{width:44px; height:44px; border-radius:50%; flex:none}
.marca img.word{height:40px; width:auto}

/* ---------- detalle ---------- */
.bigphoto{width:100%; aspect-ratio:4/3; object-fit:cover; border-radius:16px; display:block;
  border:1px solid var(--line); box-shadow:var(--shadow); background:var(--surface-2)}
.bigart{background:var(--surface); border:1px solid var(--line); border-radius:16px;
  box-shadow:var(--shadow); padding:18px; display:grid; place-items:center}
.bigart > *{max-width:150px}
.dhead h2{font-size:26px; font-weight:800; letter-spacing:-.025em; line-height:1.12}
.dhead .sec{font-size:10px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:var(--terracota-ink)}
.dhead .row{display:flex; align-items:center; gap:7px; margin-top:8px; flex-wrap:wrap}
.dtext{font-size:15px; line-height:1.55}
.optbox{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:14px; box-shadow:var(--shadow)}
.optbox .oqs{font-size:12px; color:var(--ink-soft); margin-top:4px; line-height:1.4}
.optlist.cafeinc{grid-template-columns:1fr 1fr}
.optbox .oq,.dondebox .oq{font-family:"Bricolage Grotesque",system-ui,sans-serif; font-size:16px; font-weight:800;
  line-height:1.25; letter-spacing:-.01em}
.optlist{display:grid; gap:7px; margin-top:11px}
.optlist button{border:1.5px solid var(--line); background:var(--surface-3); color:var(--ink);
  border-radius:11px; padding:12px; font-weight:700; font-size:14px; cursor:pointer; text-align:left}
.optlist button[aria-pressed="true"]{background:var(--terracota-soft); border-color:var(--terracota); color:var(--terracota-ink)}
.qtyrow{display:flex; align-items:center; gap:11px; background:var(--surface);
  border:1px solid var(--line); border-radius:var(--r); padding:11px 13px; box-shadow:var(--shadow)}
.qtyrow .lb{flex:1; font-size:13px; font-weight:700}

/* ---------- sugerencias ---------- */
.sg{background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:17px 15px;
  box-shadow:var(--shadow); position:relative; overflow:hidden}
.sg::before{content:""; position:absolute; inset:0 0 auto 0; height:4px;
  background:linear-gradient(90deg,var(--terracota),var(--turquesa))}
.sg .done{display:flex; align-items:center; gap:9px; font-size:12.5px; font-weight:700; color:var(--turquesa-ink)}
.sg .done svg{width:18px; height:18px; flex:none}
.sg h2{font-size:22px; font-weight:800; letter-spacing:-.02em; line-height:1.15; margin-top:9px}
.sg p{font-size:12.5px; color:var(--ink-soft); margin:6px 0 0}
/* La sugerencia es una propuesta, no la protagonista: pesa menos que el
   resumen de lo que el cliente ya eligió. */
.sghero{width:100%; text-align:left; color:var(--ink); cursor:pointer; display:grid; gap:0;
  background:var(--surface-3); border:1px solid var(--line); border-radius:15px; overflow:hidden;
  box-shadow:none; padding:0; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px)}
.sghero:hover{border-color:var(--terracota)}
.sghero .hh{background:transparent; color:var(--ink-soft); padding:8px 13px 0; font-size:9.5px;
  font-weight:800; letter-spacing:.14em; text-transform:uppercase}
.sghero .hb{display:grid; grid-template-columns:96px 1fr; gap:13px; align-items:center; padding:13px}
.sghero .art{width:96px; display:grid; place-items:center}
.sghero img{width:96px; height:78px; border-radius:11px; object-fit:cover; display:block}
.sghero .hn{font-family:"Bricolage Grotesque",system-ui,sans-serif; font-size:16px; font-weight:800;
  line-height:1.15; letter-spacing:-.015em}
.sghero .hy{font-size:12px; color:var(--ink-soft); margin-top:4px; line-height:1.4}
.sghero .hf{display:flex; align-items:center; gap:7px; margin-top:8px; flex-wrap:wrap}
.sghero .hadd{margin-left:auto; background:transparent; color:var(--terracota-ink);
  border:1.5px solid var(--terracota); border-radius:999px;
  width:28px; height:28px; display:grid; place-items:center; font-size:16px; font-weight:800}
.sgcard{display:grid; grid-template-columns:64px 1fr auto; gap:11px; align-items:center; width:100%;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:10px;
  box-shadow:var(--shadow); cursor:pointer; text-align:left; color:var(--ink)}
.sgcard:hover{border-color:var(--accent)}
.sgcard .art{width:64px; display:grid; place-items:center}
.sgcard img{width:64px; height:54px; border-radius:9px; object-fit:cover; display:block}
.sgcard .why{font-size:9.5px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--terracota-ink)}
.sgcard .n{font-size:14.5px; font-weight:700; line-height:1.2; margin-top:2px}
.sgcard .plus{width:32px; height:32px; border-radius:50%; background:var(--terracota-soft);
  color:var(--terracota-ink); display:grid; place-items:center; font-size:20px; font-weight:700; flex:none}

/* ---------- ticket ---------- */
.ticket{background:var(--surface); border:1px solid var(--line); border-radius:18px;
  box-shadow:var(--shadow); overflow:hidden}
.tkhead{background:var(--accent); color:var(--on-accent); padding:14px 15px}
.tkhead .tk1{font-family:"Bricolage Grotesque",system-ui,sans-serif; font-size:19px; font-weight:800; letter-spacing:-.01em}
.tkhead .tk2{font-size:11.5px; opacity:.9; margin-top:3px}
.tkmeta{display:flex; align-items:center; gap:10px; margin-top:11px; padding-top:10px;
  border-top:1px solid rgba(255,248,242,.3)}
.tkmeta .modo{font-family:"Bricolage Grotesque",system-ui,sans-serif; font-size:15px; font-weight:800;
  letter-spacing:.08em; text-transform:uppercase}
.tkmeta .sello{margin-left:auto; width:30px; height:30px; border-radius:50%;
  background:rgba(255,248,242,.22); display:grid; place-items:center}
.tkmeta .sello svg{width:16px; height:16px}
.ticket.cerrado{border-color:var(--turquesa-ink); border-width:2px}
.ticket.cerrado .tkhead{background:var(--turquesa-ink)}
.ticket.cerrado .tknote{color:var(--turquesa-ink); font-weight:700}
.perf{height:14px; background:radial-gradient(circle at 7px 7px, var(--bg) 6px, transparent 6.5px) repeat-x;
  background-size:14px 14px}
.modosel{display:grid; grid-template-columns:1fr 1fr; gap:7px; padding:13px 15px 0}
.modosel button{border:1.5px solid var(--line); background:var(--surface-3); color:var(--ink-soft);
  border-radius:11px; padding:10px 6px; font-size:13px; font-weight:700; cursor:pointer}
.modosel button[aria-pressed="true"]{background:var(--terracota-soft); border-color:var(--terracota); color:var(--terracota-ink)}
.modosel button:disabled{opacity:.4; cursor:not-allowed}
.modonota{font-size:11.5px; color:var(--turquesa-ink); padding:9px 15px 0; line-height:1.4}
.tkbody{padding:6px 15px 15px}
.tkline{display:grid; grid-template-columns:60px 1fr auto; gap:11px; align-items:center;
  padding:12px 0; border-bottom:1px solid var(--line)}
.tkline:last-child{border-bottom:0}
.tkline img{width:60px; height:50px; border-radius:9px; object-fit:cover; display:block; background:var(--surface-2)}
.tkline .art{width:60px; display:grid; place-items:center}
.tkline .n{font-size:14.5px; font-weight:700; line-height:1.2}
.tkline .o{font-size:11.5px; color:var(--ink-soft); margin-top:2px; line-height:1.35}
.tkline .qn{font-family:"Bricolage Grotesque",system-ui,sans-serif; font-size:19px; font-weight:800;
  font-variant-numeric:tabular-nums; text-align:right; min-width:34px; color:var(--madera-ink)}
.tkqty{display:flex; align-items:center; gap:2px; margin-top:6px}
.tkqty button{width:24px; height:24px; border:1.5px solid var(--line); background:var(--surface-3);
  color:var(--ink); border-radius:50%; font-size:14px; font-weight:700; line-height:1; cursor:pointer}
.tkqty span{min-width:26px; text-align:center; font-size:13px; font-weight:800; font-variant-numeric:tabular-nums}
.tknote{font-size:11.5px; color:var(--ink-soft); padding:11px 15px; background:var(--surface-3);
  border-top:1px solid var(--line); line-height:1.45}
.showbar{border:2px solid var(--accent); border-radius:16px; background:var(--terracota-soft);
  padding:14px; text-align:center; font-family:"Bricolage Grotesque",system-ui,sans-serif;
  font-size:16px; font-weight:800; color:var(--terracota-ink); line-height:1.25}
.empty{text-align:center; color:var(--ink-soft); font-size:14px; padding:26px 12px}
/* Botón para avisar que ya se quiere pagar: dorado, distinto del resto,
   para que se distinga a simple vista del botón principal de pedido. */
.pagarbtn{background:var(--dorado); color:#3A2A06}
.pagarbar{display:flex; align-items:center; gap:11px; border:2px solid var(--dorado);
  border-radius:16px; background:var(--dorado-soft); padding:13px 14px}
.pagarbar svg{width:26px; height:26px; flex:none; color:var(--dorado)}
.pagarbar b{display:block; font-family:"Bricolage Grotesque",system-ui,sans-serif;
  font-size:15px; font-weight:800; color:var(--ink); letter-spacing:-.01em}
.pagarbar span{display:block; font-size:12px; color:var(--ink-soft); margin-top:2px; line-height:1.4}

/* ---------- mientras esperas ---------- */
.espera{background:var(--surface); border:1px solid var(--line); border-radius:18px;
  box-shadow:var(--shadow); overflow:hidden}
.espera .eh{background:var(--turquesa-ink); color:var(--on-accent); padding:13px 15px;
  display:flex; align-items:center; gap:10px}
.espera .eh svg{width:19px; height:19px; flex:none}
.espera .eh b{font-family:"Bricolage Grotesque",system-ui,sans-serif; font-size:15px; font-weight:800; letter-spacing:-.01em}
.espera .principal{padding:14px 15px; border-bottom:1px solid var(--line);
  font-family:"Bricolage Grotesque",system-ui,sans-serif; font-size:17px; font-weight:800;
  line-height:1.25; letter-spacing:-.01em}
.espera ul{list-style:none; margin:0; padding:4px 15px 14px; display:grid; gap:0}
.espera li{display:grid; grid-template-columns:26px 1fr; gap:10px; align-items:start;
  padding:11px 0; border-bottom:1px solid var(--line); font-size:13px; line-height:1.45}
.espera li:last-child{border-bottom:0}
.espera li svg{width:19px; height:19px; margin-top:1px; color:var(--terracota-ink)}

.bottom{position:fixed; left:0; right:0; bottom:0; z-index:40; background:var(--surface);
  border-top:1px solid var(--line); padding:11px 16px calc(11px + env(safe-area-inset-bottom,0px));
  box-shadow:0 -6px 24px -14px rgba(45,43,39,.4)}
.bottom .inner{max-width:480px; margin:0 auto; display:flex; align-items:center; gap:11px}
.bottom .cnt2{font-family:"Bricolage Grotesque",system-ui,sans-serif; font-size:14px; font-weight:800; flex:1}
.bottom .cnt2 em{display:block; font-style:normal; font-weight:500; font-size:11px; color:var(--ink-soft)}
.bottom button{border:0; border-radius:11px; padding:12px 18px; font-weight:800; font-size:14px;
  background:var(--accent); color:var(--on-accent); cursor:pointer;
  font-family:"Bricolage Grotesque",system-ui,sans-serif}
.bottom .cnt2 em{white-space:normal}
.bottom .cnt2.corto{font-size:13.5px; line-height:1.25}
.bottom button.tacho{background:transparent; color:var(--ink-soft); border:1.5px solid var(--line);
  width:40px; height:40px; padding:0; display:grid; place-items:center; flex:none}
.bottom button.tacho svg{width:18px; height:18px}
.bottom button.tacho:hover{border-color:var(--falta); color:var(--falta)}
.bottom button.rojo{background:var(--falta)}
.bottom button.tenue{background:transparent; color:var(--ink-soft); border:1.5px solid var(--line); padding:12px 14px}

/* El bloque de Instagram vive ahora en la hoja común */
.corner.icono{padding:0; width:34px; height:34px; display:grid; place-items:center}
.corner.icono svg{width:17px; height:17px}
.opt.plain.urge{border-color:var(--coral); border-width:2px; background:var(--falta-soft)}
.opt.plain.urge b{color:var(--falta)}
.sello-eq{position:relative; border:0; background:transparent; color:var(--ink);
  opacity:.28; padding:6px; cursor:pointer; display:grid; place-items:center;
  -webkit-tap-highlight-color:transparent; transition:opacity .2s, color .2s}
.sello-eq svg{width:26px; height:26px; display:block}
.sello-eq i{position:absolute; left:50%; bottom:2px; width:0; height:2px; border-radius:2px;
  background:var(--accent); transform:translateX(-50%); transition:width .7s linear}
.sello-eq.cargando{opacity:1; color:var(--accent)}
.sello-eq.cargando i{width:26px}
.yatienes{background:var(--surface); border:2px solid var(--terracota); border-radius:16px;
  padding:13px 14px; box-shadow:0 14px 30px -16px rgba(0,0,0,.6);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px)}
.yatienes .yt{font-family:"Bricolage Grotesque",system-ui,sans-serif;
  font-size:14px; font-weight:800; letter-spacing:-.01em; text-transform:none;
  color:var(--ink); margin-bottom:10px}
.yatienes .ytl{display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; padding-bottom:2px}
.yatienes .ytl::-webkit-scrollbar{display:none}
.ytc{flex:none; width:80px; display:grid; gap:5px; justify-items:center; text-align:center; position:relative}
.ytc img{width:66px; height:53px; border-radius:10px; object-fit:cover; display:block}
.ytc .art{width:52px; display:grid; place-items:center}
.ytn{font-size:10.5px; font-weight:700; line-height:1.25; color:var(--ink);
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.ytq{position:absolute; top:-4px; right:4px; background:var(--accent); color:var(--on-accent);
  border-radius:999px; font-size:10px; font-weight:800; padding:2px 6px; line-height:1.3}
.buscabtn{opacity:.86; display:flex; align-items:center; justify-content:center; gap:9px; width:100%;
  border:1.5px solid var(--line); background:var(--surface); color:var(--ink); border-radius:13px;
  padding:13px; font-weight:700; font-size:14px; cursor:pointer}
.buscabtn:hover{border-color:var(--accent); color:var(--accent)}
.buscabtn svg{width:18px; height:18px; color:var(--terracota-ink)}
.buscador{display:grid; grid-template-columns:22px 1fr; gap:10px; align-items:center;
  background:var(--surface); border:2px solid var(--accent); border-radius:14px; padding:12px 14px;
  box-shadow:var(--shadow)}
.buscador svg{width:20px; height:20px; color:var(--terracota-ink)}
.buscador input{border:0; background:transparent; font:inherit; font-size:16px; color:var(--ink);
  width:100%; outline:none; padding:2px 0}
.buscador input::placeholder{color:var(--ink-soft)}
.brandslot{height:30px; width:auto; flex:none; display:block}
.brandslot.redonda{height:32px; width:32px; border-radius:50%}
.confirmar{background:var(--surface); border:2px solid var(--coral); border-radius:16px;
  padding:14px; box-shadow:var(--shadow)}
.confirmar .cq{font-family:"Bricolage Grotesque",system-ui,sans-serif; font-size:15px;
  font-weight:800; line-height:1.3; letter-spacing:-.01em; margin-bottom:12px}
.peligro{border:0; border-radius:13px; padding:13px; font-weight:800; font-size:14px;
  background:var(--falta); color:var(--on-accent); cursor:pointer;
  font-family:"Bricolage Grotesque",system-ui,sans-serif}
.tkmarca{display:grid; place-items:center; padding:16px 0 4px}
.tkmarca img{width:74px; height:74px; border-radius:50%; display:block;
  box-shadow:0 8px 22px -10px rgba(34,48,46,.5)}
.persgrid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px}
.persbtn{border:1.5px solid var(--line); background:var(--surface); color:var(--ink); border-radius:13px;
  padding:16px 4px; cursor:pointer; box-shadow:var(--shadow);
  font-family:"Bricolage Grotesque",system-ui,sans-serif; font-size:19px; font-weight:800}
.persbtn.wide{grid-column:1/-1; font-size:15px; padding:13px}
.persbtn[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}

.espera.aviso .eh{background:var(--dorado); color:#2A1F03}
.espera.aviso li svg{color:var(--madera-ink)}

.enlaces{background:var(--surface); border:1px solid var(--line); border-radius:16px;
  padding:6px 14px 12px; box-shadow:var(--shadow)}
.enlaces .et{font-size:10px; font-weight:800; letter-spacing:.13em; text-transform:uppercase;
  color:var(--terracota-ink); padding:12px 0 4px}
.enl{display:grid; grid-template-columns:24px 1fr auto; gap:11px; align-items:center;
  padding:12px 0; border-top:1px solid var(--line); color:var(--ink); text-decoration:none;
  font-size:14px; font-weight:700}
.enl svg{width:21px; height:21px; color:var(--terracota-ink)}
.enl .fl{width:16px; height:16px; color:var(--ink-soft)}
.enl:hover{color:var(--accent)}

.dondebox{background:var(--surface-3); border:1px solid var(--line); border-radius:14px;
  padding:11px 12px; margin:12px 0}
.dondebox .oq{font-size:14px}
.dondebox .optlist{grid-template-columns:1fr 1fr; margin-top:9px}
.ytsy{font-style:normal; font-size:9.5px; font-weight:800; letter-spacing:.06em; text-transform:uppercase;
  color:var(--dorado); white-space:nowrap}
.b-sy{background:var(--dorado-soft); color:var(--dorado)}
.ytll{font-style:normal; font-size:9.5px; font-weight:800; letter-spacing:.06em; text-transform:uppercase;
  color:var(--accent); white-space:nowrap}
.tkgrupo{font-size:10px; font-weight:800; letter-spacing:.14em; text-transform:uppercase;
  color:var(--accent); border-bottom:1px dashed var(--line); padding:10px 0 5px; margin:4px 0 2px}
.porque{display:grid; grid-template-columns:22px 1fr; gap:11px; align-items:start;
  background:var(--surface-3); border:1px solid var(--line); border-radius:15px;
  padding:13px 14px; margin-bottom:14px}
.porque svg{width:22px; height:22px; color:var(--accent); margin-top:1px}
.porque b{display:block; font-family:"Bricolage Grotesque",system-ui,sans-serif;
  font-size:14.5px; font-weight:800; letter-spacing:-.01em; margin-bottom:3px}
.porque span{font-size:12.5px; color:var(--ink-soft); line-height:1.45}
.sugiere{margin-top:15px; border-top:1px dashed var(--line); padding-top:13px; display:grid; gap:9px}
.sgt{font-size:10px; font-weight:800; letter-spacing:.13em; text-transform:uppercase;
  color:var(--ink-soft)}
.sgf{display:grid; grid-template-columns:20px 1fr; gap:10px; align-items:start;

 it:{"lang":"Scegli la tua lingua","kicker":"Emporio Andino · San Pedro de Atacama","heroT":"Scegli mentre aspetti","heroS":"Componi qui la tua ordinazione e mostrala al cameriere quando arrivi al bancone.","heroSLocal":"Componi qui la tua ordinazione e mostrala al cameriere quando viene al tavolo.","queQuieres":"Cosa ti va?","elige":"Scegli un'opzione","agregar":"Aggiungi all'ordine","sugerHero":"Il nostro consiglio","verPedido":"Vedi il mio ordine","pedido":"Il tuo ordine","agregado":"Aggiunto al tuo ordine","nota":"Il tuo ordine è scritto in spagnolo perché il personale lo legga subito. Le foto sono le stesse che usa il cameriere.","vacio":"Non hai ancora scelto nulla.","agregarMas":"Aggiungi altro","volver":"Indietro","agotado":"Oggi non disponibile","pocas":"Ne restano poche","incluye":"Succo e caffè inclusi","items":"prodotti","item":"prodotto","soloLocal":"Solo al locale","modoLocal":"Qui al locale","modoLlevar":"Da asporto","dondeQ":"Dove lo consumi?","dondeMesa":"Al tavolo","dondeLlevar":"Da asporto","modoNota":"Il tuo ordine contiene piatti che serviamo solo al locale.","ticketCTA":"Mostralo al cameriere al tavolo","hora":"Ora","ticketCTALl":"Mostralo al bancone","rBeb":"Per accompagnare","rEmp":"Dal forno","hCasa":"Ricetta della casa","hVegan":"Vegano, come la tua scelta","hHoy":"Il consiglio di oggi","paso":"Passo","pasoDe":"di","fueraHora":"Chiedi al bancone se fai ancora in tempo","avisoNav":"Benvenuto","avisoT":"Benvenuto! Con calma","aviso1":"Questo menù serve a guardare con calma mentre la fila avanza. Quello che scegli non va ancora in cucina.","aviso2":"Quando il cameriere ti serve, mostragli lo schermo: è lui a comporre l'ordine con te e a confermarlo.","avisoOk":"Perfetto, andiamo","bebT":"Cosa vuoi bere?","bebS":"Due strade: il banco del caffè, passo dopo passo, oppure le bevande fredde alla frutta.","bebCafe":"Caffetteria","bebCafeS":"Caffè, tè e cioccolata. Tre domande e ci sei.","bebJugo":"Succhi e tè freddo","bebJugoS":"Succhi freschi, smoo /* campana de mostrador sintetizada: sin archivo de audio, suena sin conexión */
var AC=null;
function campana(veces){
  try{
    var Ctx=window.AudioContext||window.webkitAudioContext; if(!Ctx) return;
    AC=AC||new Ctx();
    if(AC.state==="suspended") AC.resume();
    var t0=AC.currentTime+0.02;
    for(var r=0;r<(veces||1);r++){
      var t=t0+r*0.40;
      [[2093,0.24],[3136,0.12],[4186,0.05]].forEach(function(par){
        var o=AC.createOscillator(), g=AC.createGain();
        o.type="sine"; o.frequency.setValueAtTime(par[0],t);
        g.gain.setValueAtTime(0.0001,t);
        g.gain.exponentialRampToValueAtTime(par[1],t+0.006);
        g.gain.exponentialRampToValueAtTime(0.0001,t+1.45);
        o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+1.5);
      });
    }
  }catch(e){}
}

/* ---------- recomendación de vitrina ----------
   Puntúa lo que de verdad queda en la vitrina según afinidad con lo elegido.
   Cada gancho sale de un dato real de la casa: receta propia, apto vegano o sin
   gluten, o poco stock marcado por el equipo. No se inventan afirmaciones. */
var AFIN={negro:["cremoso","choco","nuez"], leche:["fruta","choco","simple"],
  dulce:["fruta","simple","nuez"], especia:["especia","nuez","simple"],
  fresco:["simple","fruta","cremoso"], salado:["choco","cremoso","nuez"],
  frutal:["choco","nuez","simple"]};
function familiaDe(k,id){
  if(k==="beb"){
    var d=find(BEB,id);
    if(d.g==="choc") return "dulce";
    if(d.id==="chai"||d.id==="golden"||d.id==="f-chai") return "especia";
    if(d.g==="jugo"||d.g==="te") return "fresco";
    return d.m ? "leche" : "negro";
  }
  if(k==="com"){
    var c=find(COMIDA,id);
    if(c.id.indexOf("bowl-")===0) return "frutal";
    if(c.s==="desayunos"||c.s==="brunch") return "leche";
    return "salado";
  }
  if(k==="emp") return "salado";
  return "leche";
}
function esVegana(k,id){
  if(k==="com") return find(COMIDA,id).tag==="vegan";
  if(k==="emp") return find(EMP,id).tag==="vegan";
  return false;
}
function porQue(dp){
  var u=T();
  return {cremoso:u.wCremoso, choco:u.wChoco, nuez:u.wNuez, fruta:u.wFruta,
          especia:u.wEspecia, simple:u.wSimple}[dp] || u.wSimple;
}
function pastRecomendada(k,id,n){
  var u=T(), orden=AFIN[familiaDe(k,id)]||AFIN.leche, veg=esVegana(k,id);
  var puntuadas=PAST.filter(function(p){ return !gone("past",p.id); }).map(function(p){
    var i=orden.indexOf(p.dp), s = i===0?6 : i===1?4 : i===2?3 : 1, gancho=null;
    /* Conviene ofrecer lo que la casa marcó para mover y lo que tiene stock
       holgado. Lo que está por acabarse baja: ofrecerlo deja al cliente sin él. */
    if(prio("past",p.id)){ s+=8; gancho=u.hHoy; }
    else if(pocas("past",p.id)) s-=5;
    else s+=1.5;
    if(veg && p.v){ s+=2.5; if(!gancho) gancho=u.hVegan; }
    if(p.h){ s+=1.5; if(!gancho) gancho=u.hCasa; }
    if(p.g && !gancho) gancho=u.hSg;
    if(!gancho) gancho=u.hMarida;
    return {p:p, s:s, gancho:gancho, why:porQue(p.dp)};
  }).sort(function(a,b){ return b.s-a.s; });
  var out=[], cats={};
  for(var j=0;j<puntuadas.length && out.length<n;j++){
    var c=puntuadas[j].p.cat;
    if((cats[c]||0)>=1) continue;
    cats[c]=1; out.push(puntuadas[j]);
  }
  return out;
}
function libres(k, arr, n, excl){
  var vivos=arr.filter(function(x){ return !gone(k,x.id) && !(excl && x.id===excl); });
  var orden=vivos.map(function(x,i){ return {x:x, w:pesoStock(k,x.id), i:i}; })
    .sort(function(a,b){ return a.w-b.w || a.i-b.i; });
  return orden.slice(0,n).map(function(o){ return o.x; });
}
function bebSugeridas(n){
  var out=[];
  /* lo que el equipo marcó para ofrecer primero manda sobre el top de la casa */
  BEB.forEach(function(d){ if(out.length<n && prio("beb",d.id) && !gone("beb",d.id)) out.push(d); });
  var ids=TOPFRIO.concat(TOPCAL);
  ids.forEach(function(id){
    if(out.length>=n) return;
    var d=find(BEB,id);
    if(d && !gone("beb",id) && !pocas("beb",id) && out.indexOf(d)<0) out.push(d);
  });
  if(out.length<n) out=out.concat(libres("beb", BEB.filter(function(d){ return out.indexOf(d)<0; }), n-out.length));
  return out.slice(0,n);
}
function sugerencias(k,id){
  var u=T(), out=[], rec=pastRecomendada(k,id,2);
  var hero = rec.length ? {id:rec[0].p.id, gancho:rec[0].gancho, why:rec[0].why} : null;
  function push(kk,arr,why){ arr.forEach(function(x){ out.push({k:kk,id:x.id,why:why}); }); }
  if(k==="com"){
    var d=find(COMIDA,id);
    if(d.s==="desayunos"||d.s==="brunch"){
      if(rec[1]) out.push({k:"past", id:rec[1].p.id, why:rec[1].gancho});
      push("emp", libres("emp",EMP,1), u.rEmp);
    } else push("beb", bebSugeridas(2), u.rBeb);
  } else if(k==="emp") push("beb", bebSugeridas(2), u.rBeb);
  else if(k==="beb"){
    if(rec[1]) out.push({k:"past", id:rec[1].p.id, why:rec[1].gancho});
    push("emp", libres("emp",EMP,1), u.rEmp);
  }
  else push("beb", bebSugeridas(2), u.rBeb);
  return {hero:hero, resto:out.slice(0,2)};
}

/* =================== carrito, tarjetas y hoja =====================
   Todo se elige en la misma pantalla. Las tarjetas traen su contador; lo que
   necesita decisiones (sirope, leche, café incluido) abre una hoja que sube
   desde abajo, sin cambiar de capa y sin perder el lugar de la lista. */

function claveLinea(x){
  return x.k+":"+x.id+"|"+(x.opt||"")+"|"+(x.sy||"")+"|"+(x.cf||"")+"|"+(x.ll?1:0);
}
/* Cuántas unidades de este producto hay en el pedido, sumando variantes */
function enCarro(k,id){
  var n=0;
  pedido.forEach(function(x){ if(x.k===k && x.id===id) n+=x.q; });
  return n;
}
/* La última línea de ese producto: es la que mueven los botones de la tarjeta */
function ultimaLinea(k,id){
  for(var i=pedido.length-1;i>=0;i--) if(pedido[i].k===k && pedido[i].id===id) return i;
  return -1;
}
function sumarLinea(i,delta){
  if(i<0 || !pedido[i]) return;
  pedido[i].q += delta;
  if(pedido[i].q<=0) pedido.splice(i,1);
  savePed();
}
/* Qué hay que preguntar antes de agregar */
function pideDecision(k,id){
  if(k==="beb"){
    var d=find(BEB,id);
    if(!d) return false;
    if(admiteSirope(d)) return true;
    if(d.m && lechesHay().length) return true;
    return false;
  }
  if(k==="com"){
    var c=find(COMIDA,id);
    if(!c) return false;
    if(c.opt) return true;
    if(conCafe(id)) return true;
  }
  return false;
}
function stepperHTML(k,id){
  var n=enCarro(k,id);
  if(!n) return '<button class="mas" type="button" data-mas="'+k+':'+id+'" aria-label="+">+</button>';
  return '<div class="step chico"><button type="button" data-menos="'+k+':'+id+'" aria-label="-">&minus;</button>'+
    '<span class="cnt">'+n+'</span>'+
    '<button type="button" data-mas="'+k+':'+id+'" aria-label="+">+</button></div>';
}
/* Tarjeta única para toda la carta: cuerpo que abre el detalle y contador */
function tarjeta(k,id,arte,titulo,desc,meta,clase){
  var go=gone(k,id), n=enCarro(k,id);
  /* La tarjeta entera abre el detalle; el contador va encima y se atiende
     primero, así un toque en + no abre la hoja. */
  return '<div class="card '+(clase||"")+(go?" gone":"")+(n?" elegida":"")+'"'+
    (go?'':' data-pick="'+k+':'+id+'" role="button" tabindex="0"')+'>'+
      arte+'<div><div class="n">'+titulo+'</div>'+
      (desc?'<div class="d">'+desc+'</div>':'')+
      (meta?'<div class="meta">'+meta+'</div>':'')+'</div>'+
    (go?'':'<div class="cpaso">'+stepperHTML(k,id)+'</div>')+
    '</div>';
}

/* Qué va como extra en el café incluido: el sirope y la leche vegetal.
   La carta no muestra precios; solo avisa que se cobra aparte. */
function extrasDe(x){
  var out=[];
  if(!x) return out;
  if(x.cf && SIROPE_FIJO[x.cf]) out.push("sirope");
  if(x.opt && VEGETALES[x.opt]) out.push("vegetal");

}

function agregarDesdeHoja(){

  var nueva={k:k, id:id, opt:curOpt||null, sy:curSirope||null, cf:curCafe||null, q:curQty, ll:llev?1:0};
  var ex=null;
  for(var i=0;i<pedido.length;i++){

  if(ex) ex.q+=curQty; else pedido.push(nueva);

var splash=document.getElementById("splash"), splashHTML=splash.innerHTML;
var envoltorio=document.querySelector(".wrap"), splashT=null, splashT2=null;
var ESPERA=2000, SALIDA=300;   /* logo en pantalla · salida del logo */

function cerrarSplash(){
  if(!splash || splash.classList.contains("off") || splash.classList.contains("saliendo")) return;
  if(splashT){ clearTimeout(splashT); splashT=null; }
  splash.classList.add("saliendo");          /* 1. se va el logo, el velo sigue */
  splashT2=setTimeout(function(){
    splash.classList.add("off");             /* 2. el velo desaparece de golpe */
    envoltorio.classList.remove("oculta");
    envoltorio.classList.remove("entra");
    void envoltorio.offsetWidth;             /* reinicia la animación */
    envoltorio.classList.add("entra");       /* 3. recién ahora entra el idioma */
    window.scrollTo({top:0});
  }, SALIDA);
}
function abrirSplash(){
  if(!splash) return;
  if(splashT){ clearTimeout(splashT); splashT=null; }
  if(splashT2){ clearTimeout(splashT2); splashT2=null; }
  splash.innerHTML=splashHTML;               /* recrea los nodos para repetir la animación */
  splash.classList.remove("off","saliendo");
  envoltorio.classList.remove("entra");
  envoltorio.classList.add("oculta");
  splashT=setTimeout(cerrarSplash, ESPERA);
}
splashT=setTimeout(cerrarSplash, ESPERA);
splash.addEventListener("click", cerrarSplash);
/* Si algo falla y el velo se queda pegado, la carta aparece igual */
setTimeout(function(){
  if(envoltorio.classList.contains("oculta")){
    splash.classList.add("off");
    envoltorio.classList.remove("oculta");
  }
}, 4000);

/* ---------- la cuenta ----------
   Pantalla completa para pedir la cuenta. Reproduce en vivo la animación de
   cierre de Emporio Andino y se queda llamando la atención —ondas, luz que
   respira, campana cada 30 segundos— hasta que el garzón mantiene presionado
   el botón de abajo. El texto grande va en español porque lo lee el garzón;
   el agradecimiento va en el idioma del cliente. */
var particulas=(function(){
  var cv=null, cx=null, W=0, H=0, flot=[], chispas=[], raf=0, quieto=false;
  var C={cafe:"#6B3F22", cafe2:"#A7693C", masa:"#E8B04B", masa2:"#C98A2E", taza:"#F3E9D8",
    rosa:"#FF87BB", azul:"#3ABCFC", verde:"#62B44F", oro:"#FFC94D"};
  /* Lo que hay en la carta: granos de café, empanadas, tazas, hojas, y los
     destellos dorados del video. */
  var TIPOS=["grano","empanada","taza","hoja","chispa","grano","empanada","chispa","grano","hoja"];
  function azar(a,b){ return a+Math.random()*(b-a); }
  function medir(){
    if(!cv) return;
    var r=cv.getBoundingClientRect(), dpr=Math.min(2, window.devicePixelRatio||1);
    W=r.width; H=r.height;
    cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
    cx.setTransform(dpr,0,0,dpr,0,0);
  }
  function nuevo(y){
    return {t:TIPOS[Math.floor(Math.random()*TIPOS.length)], x:azar(0,W), y:(y==null?azar(0,H):y),
      s:azar(10,20), r:azar(0,6.28), vr:azar(-.012,.012), vy:azar(-.45,-.14), f:azar(0,6.28), a:azar(.2,.48)};
  }
  function forma(p, al){
    var s=p.s, k, an;
    cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r); cx.globalAlpha=al;
    if(p.t==="grano"){
      cx.fillStyle=C.cafe; cx.beginPath(); cx.ellipse(0,0,s*.42,s*.62,0,0,6.283); cx.fill();
      cx.strokeStyle=C.cafe2; cx.lineWidth=Math.max(1,s*.09); cx.beginPath();
      cx.moveTo(0,-s*.5); cx.bezierCurveTo(s*.2,-s*.15,-s*.2,s*.15,0,s*.5); cx.stroke();
    } else if(p.t==="empanada"){
      cx.fillStyle=C.masa; cx.beginPath(); cx.moveTo(-s*.7,s*.2); cx.arc(0,s*.2,s*.7,Math.PI,0); cx.closePath(); cx.fill();
      cx.fillStyle=C.masa2;
      for(k=0;k<7;k++){ an=Math.PI+k*Math.PI/6; cx.beginPath(); cx.arc(Math.cos(an)*s*.7, s*.2+Math.sin(an)*s*.7, s*.1, 0, 6.283); cx.fill(); }
    } else if(p.t==="taza"){
      cx.fillStyle=C.taza; cx.beginPath();
      cx.moveTo(-s*.45,-s*.3); cx.lineTo(s*.45,-s*.3); cx.lineTo(s*.34,s*.34); cx.lineTo(-s*.34,s*.34); cx.closePath(); cx.fill();
      cx.strokeStyle=C.taza; cx.lineWidth=Math.max(1.2,s*.1); cx.beginPath(); cx.arc(s*.5,0,s*.17,-1.4,1.4); cx.stroke();
      cx.fillStyle=C.rosa; cx.fillRect(-s*.41,-s*.12,s*.82,s*.12);
      cx.fillStyle=C.taza; cx.fillRect(-s*.6,s*.38,s*1.2,s*.08);
    } else if(p.t==="hoja"){
      cx.fillStyle=C.verde; cx.beginPath(); cx.moveTo(0,-s*.6);
      cx.quadraticCurveTo(s*.5,0,0,s*.6); cx.quadraticCurveTo(-s*.5,0,0,-s*.6); cx.fill();
    } else if(p.t==="chispa"){
      cx.fillStyle=C.oro; cx.beginPath();
      for(k=0;k<8;k++){ var rr=(k%2?s*.13:s*.55); an=k*Math.PI/4; cx.lineTo(Math.cos(an)*rr, Math.sin(an)*rr); }
      cx.closePath(); cx.fill();
    } else {
      cx.fillStyle=p.c||C.rosa; cx.beginPath(); cx.arc(0,0,s*.22,0,6.283); cx.fill();
    }
    cx.restore();
  }
  function paso(){
    if(!cv) return;
    cx.clearRect(0,0,W,H);
    for(var i=0;i<flot.length;i++){
      var p=flot[i];
      p.y+=p.vy; p.f+=.012; p.x+=Math.sin(p.f)*.25; p.r+=p.vr;
      if(p.y<-30){ flot[i]=nuevo(H+20); continue; }
      forma(p,p.a);
    }
    for(var k=chispas.length-1;k>=0;k--){
      var c=chispas[k];
      c.vx*=.955; c.vy=c.vy*.955+.05; c.x+=c.vx; c.y+=c.vy; c.r+=c.vr; c.vida--;
      if(c.vida<=0){ chispas.splice(k,1); continue; }
      forma(c, Math.min(1,c.vida/40));
    }
    raf=requestAnimationFrame(paso);
  }
  function parar(){
    if(raf) cancelAnimationFrame(raf);
    raf=0; chispas=[]; cv=null;
    window.removeEventListener("resize", medir);
  }
  function iniciar(canvas){
    parar();
    cv=canvas; if(!cv) return;
    cx=cv.getContext("2d"); medir();
    quieto=!!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
    flot=[];
    var n=Math.round(Math.max(18, Math.min(46, W*H/8500)));
    for(var i=0;i<n;i++) flot.push(nuevo());
    window.addEventListener("resize", medir);
    if(quieto){ flot.forEach(function(p){ forma(p,p.a); }); return; }
    raf=requestAnimationFrame(paso);
  }
  /* El estallido del video: sale del borde del logo en los colores de marca */
  function estallido(){
    if(!cv || quieto) return;
    var o=document.getElementById("ctLogo"); if(!o) return;
    var r=o.getBoundingClientRect(), cr=cv.getBoundingClientRect();
    var x=r.left+r.width/2-cr.left, y=r.top+r.height/2-cr.top, rad=r.width/2;
    var tipos=["grano","punto","punto","chispa","punto","grano","hoja","punto","empanada"];
    var cols=[C.rosa,C.azul,C.verde,C.oro,"#FFFFFF"];
    for(var i=0;i<76;i++){
      var an=Math.random()*6.283, v=azar(3.5,9.5);
      chispas.push({t:tipos[i%tipos.length], x:x+Math.cos(an)*rad*.9, y:y+Math.sin(an)*rad*.9,
        vx:Math.cos(an)*v, vy:Math.sin(an)*v, s:azar(9,16), r:azar(0,6.28), vr:azar(-.2,.2),
        vida:Math.round(azar(55,95)), c:cols[i%cols.length]});
    }
  }
  return {iniciar:iniciar, estallido:estallido, parar:parar};
})();

function pedirVela(){
  try{ if(navigator.wakeLock) navigator.wakeLock.request("screen").then(function(v){ ctVela=v; }).catch(function(){}); }catch(e){}
}
function soltarVela(){ try{ if(ctVela) ctVela.release(); }catch(e){} ctVela=null; }
function engancharHold(){
  var b=document.getElementById("ctOk"); if(!b) return;
  function inicio(ev){
    if(ev) ev.preventDefault();
    if(ctHoldT || b.classList.contains("hecho")) return;
    b.classList.add("apretando");
    try{ if(navigator.vibrate) navigator.vibrate(15); }catch(e){}
    ctHoldT=setTimeout(function(){ ctHoldT=null; b.classList.add("hecho"); confirmarCuenta(); }, 1200);
  }
  function fin(){
    if(!ctHoldT) return;
    clearTimeout(ctHoldT); ctHoldT=null; b.classList.remove("apretando");
  }
  b.addEventListener("pointerdown", inicio);
  ["pointerup","pointerleave","pointercancel"].forEach(function(t){ b.addEventListener(t, fin); });
  b.addEventListener("keydown", function(e){ if((e.key==="Enter"||e.key===" ") && !e.repeat) inicio(e); });
  b.addEventListener("keyup", function(e){ if(e.key==="Enter"||e.key===" ") fin(); });
  b.addEventListener("contextmenu", function(e){ e.preventDefault(); });
}
function limpiarTiemposCuenta(){
  [ctCampanaT].forEach(function(t){ if(t) clearInterval(t); });
  [ctHoldT, ctCierreT, ctEstallidoT].forEach(function(t){ if(t) clearTimeout(t); });
  ctCampanaT=ctHoldT=ctCierreT=ctEstallidoT=null;
}
function abrirCuenta(){
  if(!cuenta) return;
  limpiarTiemposCuenta();
  cuenta.innerHTML=htmlCuenta();
  cuenta.classList.remove("on");
  cuenta.hidden=false;
  document.body.classList.add("conhoja");
  void cuenta.offsetWidth;
  cuenta.classList.add("on");
  particulas.iniciar(document.getElementById("ctFondo"));
  ctEstallidoT=setTimeout(function(){ if(cuentaAbierta()) particulas.estallido(); }, 700);
  campana(1);
  ctCampanaT=setInterval(function(){ if(cuentaAbierta()) campana(1); }, 30000);
  pedirVela(); armarTrampa(); engancharHold();
  document.getElementById("ctCerrar").onclick=cancelarCuenta;
}
function cerrarCuenta(){
  if(!cuenta) return;
  limpiarTiemposCuenta(); particulas.parar(); soltarVela();
  cuenta.classList.remove("on"); cuenta.hidden=true; cuenta.innerHTML="";
  if(!hojaAbierta()) document.body.classList.remove("conhoja");
}
function cancelarCuenta(){ cfg.pagar=0; saveCfg(); cerrarCuenta(); dir=""; pintar(); }
function confirmarCuenta(){
  cfg.pagar=2; saveCfg();
  if(ctCampanaT){ clearInterval(ctCampanaT); ctCampanaT=null; }
  var L=document.getElementById("ctListo"); if(L) L.hidden=false;
  campana(2); particulas.estallido();
  ctCierreT=setTimeout(function(){ cerrarCuenta(); dir=""; pintar(); }, 2800);
}

/* ---------- Control de Salón ----------
   Va dentro de esta misma carta, en su propio marco: así el equipo no cambia de
   aplicación y lo que marca allá lo lee la carta al instante (mismo origen).
   Si el marco no carga, se ofrece abrirlo en una pestaña aparte. */
var salon=document.getElementById("salon"), salonFrame=document.getElementById("salonFrame");
var salonCargado=false, salonReloj=null, scrollGuardado=0;
function abrirSalon(){
  scrollGuardado = window.scrollY || 0;
  salon.hidden=false;
  document.body.style.overflow="hidden";
  if(!salonCargado){
    salonCargado=true;
    document.getElementById("salonNueva").href=CONTROL_URL;
    salonFrame.addEventListener("load", function(){
      if(salonFrame.src.indexOf("salon.html")<0) return;   /* ignora el about:blank inicial */
      if(salonReloj){ clearTimeout(salonReloj); salonReloj=null; }
      try{
        /* un marco vacío también dispara load: se comprueba que haya página */
        var d=salonFrame.contentDocument;
        if(d && d.body && d.body.childElementCount===0) mostrarRespaldo();
      }catch(e){}
    });
    salonFrame.addEventListener("error", mostrarRespaldo);
    salonReloj=setTimeout(mostrarRespaldo, 4000);
    salonFrame.src="salon.html";
  }
}
function mostrarRespaldo(){
  if(salonReloj){ clearTimeout(salonReloj); salonReloj=null; }
  document.getElementById("salonFall").hidden=false;
}
function cerrarSalon(){
  salon.hidden=true;
  document.body.style.overflow="";
  window.scrollTo({top:scrollGuardado});
  dir=""; pintar();   /* refresca la carta con lo que el equipo acaba de marcar */
  window.scrollTo({top:scrollGuardado});
}
document.getElementById("salonCerrar").addEventListener("click", cerrarSalon);
/* El botón "Volver a la carta" vive dentro del Control y avisa por mensaje.
   Solo se atiende si el mensaje viene de nuestro propio marco. */
window.addEventListener("message", function(ev){
  if(!ev || !ev.data || ev.data.ea!=="cerrar-salon") return;
  var mio=false;
  try{ mio = (ev.source === salonFrame.contentWindow); }catch(e){}
  if(mio) cerrarSalon();
});

/* El control de stock no se anuncia: se abre manteniendo pulsada la empanada
   del pie durante siete décimas de segundo. Un toque suelto no hace nada. */
(function(){
  var sello=document.getElementById("staffBtn"), reloj=null;
  function arranca(ev){
    if(ev.type==="pointerdown" && ev.button) return;
    sello.classList.add("cargando");
    reloj=setTimeout(function(){
      sello.classList.remove("cargando"); reloj=null;
      abrirSalon();
    }, 700);
  }
  function corta(){
    sello.classList.remove("cargando");
    if(reloj){ clearTimeout(reloj); reloj=null; }
  }
  sello.addEventListener("pointerdown", arranca);
  ["pointerup","pointerleave","pointercancel"].forEach(function(e){ sello.addEventListener(e, corta); });
  sello.addEventListener("contextmenu", function(e){ e.preventDefault(); });
})();

/* ---------- eventos ---------- */
document.addEventListener("keydown", function(ev){
  if(ev.key!=="Enter" && ev.key!==" ") return;
  var tj=ev.target.closest && ev.target.closest("[data-pick][role='button']");
  if(!tj) return;
  ev.preventDefault();
  var pt=tj.dataset.pick.split(":");
  abrirHoja(pt[0], pt.slice(1).join(":"));
});
document.addEventListener("click", function(ev){
  var nivel=ev.target.closest("[data-nivel]");
  if(nivel && !ev.target.closest("button")){ volverA(+nivel.dataset.nivel); return; }
  var b=ev.target.closest("button");
  if(!b){
    /* La tarjeta completa abre el detalle cuando no se tocó ningún botón */
    var tj=ev.target.closest("[data-pick]");
    if(tj){ var pt=tj.dataset.pick.split(":"); abrirHoja(pt[0], pt.slice(1).join(":")); }
    return;
  }
  var u=T();

  if(b.dataset.lang){
    lang=b.dataset.lang; try{localStorage.setItem("ea_viva_lang",lang);}catch(e){}
    aplicarDireccion();
    pila=[{v:"aviso",p:null,t:T().avisoNav}]; dir="push"; pintar(); window.scrollTo({top:0}); return;
  }
  if(b.id==="avisoOk"){ reemplazar("modo", null, T().modoNav); return; }
  if(b.id==="lngBtn"){ pila=[{v:"idioma",p:null,t:"Emporio Andino"}]; dir="pop"; pintar(); window.scrollTo({top:0}); return; }
  if(b.id==="back"){ salir(); return; }

  if(b.dataset.setmodo){
    var nuevo=b.dataset.setmodo;
    /* De mesa a llevar: lo que solo se sirve en el local sale del pedido, y
       cualquier línea marcada "en la mesa" pasa a bolsa. Se avisa antes. */
    if(nuevo==="llevar" && cfg.modo!=="llevar" && pedido.length && !avisoModo){
      avisoModo=true; dir=""; pintar(); return;
    }
    /* De llevar a mesa: el pedido se arma distinto, así que se parte de cero.
       Solo se pregunta si de verdad hay algo que perder. */
    if(nuevo==="local" && cfg.modo==="llevar" && pedido.length && !avisoModo){
      avisoModo=true; dir=""; pintar(); return;
    }
    if(nuevo==="llevar"){
      pedido=pedido.filter(function(x){ return !soloLocal(x.k,x.id); });
      pedido.forEach(function(x){ x.ll=0; });   /* ya no hay mesa que distinguir */
      savePed();
    }
    if(nuevo==="local" && cfg.modo==="llevar"){ pedido=[]; savePed(); }
    avisoModo=false;
    cfg.modo=nuevo; cfg.hecho=0; cfg.pagar=0; saveCfg();
    if(actual().v!=="modo") volverA(0);
    if(nuevo==="local"){ entrar("personas", null, u.persT); }
    else { cfg.personas=0; saveCfg(); entrar("secciones", null, T().cartaNav); }
    return;
  }
  if(b.id==="cambiarModo"){ avisoModo=false; volverA(0); return; }
  if(b.dataset.pers){ cfg.personas=+b.dataset.pers; saveCfg(); dir=""; pintar(); return; }
  if(b.id==="persOk"){ if(!cfg.personas) cfg.personas=2; saveCfg(); entrar("secciones", null, T().cartaNav); return; }
  if(b.dataset.sec){
    if(b.dataset.sec==="empanadas"){ entrar("empanadas", null, L(secDe("empanadas").n)); return; }
    if(b.dataset.sec==="bebidas"){ barra={t:null, beb:null, sy:null, leche:null};
      entrar("bebidas", null, L(secDe("bebidas").n)); return; }
    entrar("lista", b.dataset.sec, L(secDe(b.dataset.sec).n)); return;
  }
  if(b.id==="irCafeteria"){ barra={t:null, beb:null, sy:null, leche:null};
    entrar("cafeteria", 1, T().bebCafe); return; }
  if(b.id==="irJugos"){ entrar("jugos", null, T().bebJugo); return; }
  if(b.id==="verTodasBeb"){ entrar("lista", "bebidas", L(secDe("bebidas").n)); return; }
  if(b.dataset.bart){ barra.t=b.dataset.bart; barra.beb=null; barra.sy=null; barra.leche=null;
    entrar("cafeteria", 2, T().qCafe); return; }
  /* Elegido el café, se pregunta solo lo que falte: primero el sirope, después
     la leche. Si la bebida no admite una cosa, ese paso no aparece. */
  if(b.dataset.cafe){
    barra.beb=b.dataset.cafe;
    barra.sy=SIROPE_FIJO[barra.beb]||null;
    barra.leche=null;
    seguirCafeteria();
    return;
  }
  if(b.dataset.sirope!==undefined && actual().v==="cafeteria"){
    barra.sy = b.dataset.sirope || null;
    seguirCafeteria(true);
    return;
  }
  if(b.dataset.leche && !b.dataset.pick){
    barra.leche=b.dataset.leche;
    if(actual().v==="cafeteria") abrirCafeElegido();
    return;
  }
  /* Todo se elige en una hoja sobre la misma pantalla: ya no hay capa de ficha */
  if(b.dataset.pick){
    var prr=b.dataset.pick.split(":");
    abrirHoja(prr[0], prr.slice(1).join(":")); return;
  }
  if(b.dataset.mas){
    var pm=b.dataset.mas.split(":"), km=pm[0], im=pm.slice(1).join(":");
    var ya=ultimaLinea(km,im);
    if(ya>=0){ sumarLinea(ya,1); dir=""; pintar(); if(hojaAbierta()) pintarHoja(); return; }
    if(pideDecision(km,im)){ abrirHoja(km,im); return; }
    agregarDirecto(km,im); dir=""; pintar(); if(hojaAbierta()) pintarHoja(); return;
  }
  if(b.dataset.menos){
    var pn=b.dataset.menos.split(":");
    sumarLinea(ultimaLinea(pn[0], pn.slice(1).join(":")), -1);
    dir=""; pintar(); if(hojaAbierta()) pintarHoja(); return;
  }
  /* ---- dentro de la hoja ---- */
  if(b.id==="hojaCerrar" || b.id==="hojaFondo"){ cerrarHoja(); return; }
  if(b.dataset.hcafe){
    curCafe=b.dataset.hcafe;
    var ci2=find(BEB,curCafe);
    if(!ci2 || !ci2.m) curOpt=null;
    pintarHoja(); return;
  }
  if(b.dataset.hopt){ curOpt=b.dataset.hopt; pintarHoja(); return; }
  if(b.dataset.hsy!==undefined){ curSirope=b.dataset.hsy||null; pintarHoja(); return; }
  if(b.dataset.hleche){ curOpt=b.dataset.hleche; pintarHoja(); return; }
  if(b.dataset.hdonde){ curLlevar=(b.dataset.hdonde==="1"); pintarHoja(); return; }
  if(b.dataset.hq){ curQty=Math.max(1,Math.min(20,curQty+(+b.dataset.hq))); pintarHoja(); return; }
  if(b.id==="hjAdd"){ agregarDesdeHoja(); dir=""; return; }
  if(b.id==="hjSeguir"){ cerrarHoja(); return; }
  if(b.id==="hjQuedarse"){ cerrarHoja(); return; }
  if(b.id==="hjSalir"){
    hoja.abierta=false;
    document.getElementById("hoja").hidden=true;
    document.body.classList.remove("conhoja");
    try{ history.back(); }catch(e){}
    return;
  }
  if(b.id==="hjPedir"){ cerrarHoja(); entrar("ticket", null, T().pedido); return; }
  if(b.dataset.cq!==undefined){
    sumarLinea(+b.dataset.cq, +b.dataset.d);
    if(!pedido.length){ cerrarHoja(); return; }
    pintarHoja(); return;
  }
  if(b.dataset.opt){ curOpt=b.dataset.opt; dir=""; pintar(); return; }
  if(b.dataset.cafeinc){
    curCafe=b.dataset.cafeinc;
    var ci=find(BEB,curCafe);
    if(!ci || !ci.m) curOpt=null;      /* si no lleva leche, se olvida la elegida */
    dir=""; pintar(); return;
  }
  if(b.dataset.lecheinc){ curOpt=b.dataset.lecheinc; dir=""; pintar(); return; }
  if(b.dataset.donde){ curLlevar=(b.dataset.donde==="1"); dir=""; pintar(); return; }
  if(b.dataset.q){ curQty=Math.max(1,Math.min(20,curQty+(+b.dataset.q))); dir=""; pintar(); return; }

  if(b.id==="goTicket"){ abrirCarro(); return; }
  if(b.id==="abrirBuscar"||b.id==="buscarBtn"){ consulta=""; entrar("buscar", null, u.buscarT); return; }
  if(b.id==="realizar"){ cfg.hecho=1; saveCfg(); dir="push"; pintar(); window.scrollTo({top:0}); return; }
  if(b.id==="modificar"){ cfg.hecho=0; cfg.pagar=0; saveCfg(); dir="pop"; pintar(); return; }
  if(b.id==="pagarBtn"){ cfg.pagar=1; saveCfg(); dir=""; pintar(); abrirCuenta(); return; }
  if(b.id==="pagarMostrar"){ abrirCuenta(); return; }
  if(b.id==="pagarCancelar"){ cfg.pagar=0; saveCfg(); dir=""; pintar(); return; }
  if(b.id==="limpiar"){
    if(!pedido.length){ limpiarTodo(); return; }
    pidiendoBorrar=true; dir=""; pintar(); return;
  }
  if(b.id==="barraBorrar"){ pidiendoBorrar=true; dir=""; pintar(); return; }
  if(b.id==="borrarSi"){ pidiendoBorrar=false; limpiarTodo(); return; }
  if(b.id==="borrarNo"){ pidiendoBorrar=false; dir=""; pintar(); return; }
  if(b.id==="volver2"){
    /* "Agregar más" vuelve a la carta, no a elegir de nuevo aquí o llevar */
    var iSec=-1;
    for(var q=0;q<pila.length;q++) if(pila[q].v==="secciones"){ iSec=q; break; }
    if(iSec>=0) volverA(iSec);
    else { pila=[{v:"secciones",p:null,t:T().cartaNav}]; dir="pop"; pintar(); window.scrollTo({top:0}); }
    return;
  }
  if(b.dataset.pq!==undefined){
    var idx=+b.dataset.pq;
    pedido[idx].q+=(+b.dataset.d);
    if(pedido[idx].q<=0) pedido.splice(idx,1);
    savePed(); dir=""; pintar(); return;
  }
});

pintar();

   media pantalla en blanco y el diálogo se cortaba por abajo. Estas
   reglas no cambian nada del diseño vertical; solo reparten el ancho
   cuando existe, y aprietan el alto cuando falta.
   ================================================================= */
@media (min-width:720px){
  .wrap{max-width:720px}
  .list{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; align-items:start}
  .mini{grid-template-columns:repeat(3,minmax(0,1fr))}
  .egrid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .langgrid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .gformas{grid-template-columns:repeat(6,minmax(0,1fr))}
  .bottom .inner{max-width:720px}
}
@media (orientation:landscape) and (min-width:1024px){
  .wrap{max-width:1020px}
  .list{grid-template-columns:repeat(3,minmax(0,1fr))}
  .mini{grid-template-columns:repeat(4,minmax(0,1fr))}
  .egrid{grid-template-columns:repeat(4,minmax(0,1fr))}
  .opts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bottom .inner{max-width:1020px}
}
/* En horizontal el diálogo deja de ser una hoja que sube desde el borde
   y pasa a ser una ventana centrada: en 390 px de alto, una hoja al 88%
   no alcanza a mostrar el botón de confirmar. */
@media (orientation:landscape) and (min-width:820px){
  #hoja{place-items:center; padding:20px}
  .hjpanel{max-width:620px; width:100%; margin:0 auto; border-radius:18px; max-height:86vh}
}
/* Teléfono acostado: sobra ancho y falta alto. */
@media (orientation:landscape) and (max-height:540px){
  .sp img.mark{width:96px; height:96px}
  .halo i{width:96px; height:96px}
  .gate{gap:9px; padding-top:2px}
  .gate h2{font-size:21px}
  .gate p{font-size:12px}
  .opt .tile{height:56px}
  .opt.wide .tile{min-height:56px}
  .familia{font-size:16px; margin-top:2px}
  .bigphoto{aspect-ratio:16/9}
  .hjpanel{max-height:94vh}
  .hjbody{padding:11px 13px}
  .wrap{padding-bottom:84px}
  .top{padding-block:7px}
}
@media (orientation:landscape) and (max-height:540px) and (min-width:720px){
  .opts{grid-template-columns:repeat(4,minmax(0,1fr))}
  .langgrid{grid-template-columns:repeat(5,minmax(0,1fr))}
}
</style>

<style>
/* En una pantalla ancha, un párrafo que cruza los 1020 px se lee mal: los
   bloques de texto y los de una sola columna se quedan en medida de lectura
   y centrados; las rejillas sí aprovechan todo el ancho. */
@media (min-width:720px){
  .aviso-legal,.espera,.ticket,.sg,.showbar,.horario,.maslang,.pasosnota,.optbox,.dondebox,.guia{
    max-width:660px; margin-left:auto; margin-right:auto; width:100%}
  .gate p{max-width:52ch}
  .dhead,.dtext{max-width:70ch}
}
</style>
