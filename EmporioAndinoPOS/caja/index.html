function hojaCuenta(v){
  abrirHoja("Cuenta para la mesa", function(b){
    var caja=el("div"); caja.innerHTML=valeHTML(v,"cuenta"); b.appendChild(caja);
    var p=el("p","mini noimp","La ley pide que la propina se sugiera en la cuenta —no en la boleta— y que el cliente pueda rechazarla. Si la rechaza, se cobra solo el consumo.");
    b.appendChild(p);
    var b1=el("button","btn lleno noimp"); b1.type="button";
    b1.innerHTML=ico("i-descarga")+"Descargar cuenta en PDF";
    b1.onclick=function(){ bajar("cuenta-"+v.id+".pdf", valePDF(v,"cuenta")); };
    var b2=el("button","btn suave lleno noimp"); b2.type="button";
    b2.innerHTML=ico("i-imprime")+"Imprimir";
    b2.onclick=imprimirVale;
    b.appendChild(b1); b.appendChild(b2);
  });
}
function cuentaPrevia(){
  if(!carro.length) return;
  var t=totalCarro();
  hojaCuenta({id:"PRE-"+hora(Date.now()).replace(":",""), ts:new Date().toISOString(),
    resp:POS.cfg.respActivo||"(sin asignar)", modo:modoActivo,
    lineas:carro.map(function(l){ return {id:l.id,n:l.n,q:l.q,p:l.p,mod:l.mod.slice()}; }),
    total:t, neto:neto(t), iva:ivaDe(t), propina:propinaSug(), pago:"", efectivo:null, doc:null, anulada:null});
}
/* ---------- CSV ---------- */
function csv(filas){
  return filas.map(function(f){ return f.map(function(c){
    var s=String(c==null?"":c);
    return /[;"\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  }).join(";"); }).join("\r\n");
}
function exportarVentas(desde,hasta){
  var f=[["ID","Fecha","Hora","Responsable","Destino","Medio de pago","Producto","Cantidad","Precio unitario","Total línea","Neto venta","IVA venta","Total venta","Propina","Documento","Folio","Anulada","Motivo anulación"]];
  ventasEntre(desde,hasta).forEach(function(v){
    v.lineas.forEach(function(l){
      f.push([v.id, diaDe(v.ts), hora(v.ts), v.resp, MODOS[v.modo]||v.modo,
        (PAGOS.filter(function(p){return p.id===v.pago;})[0]||{}).n||v.pago,
        l.n+(l.mod&&l.mod.length?" ("+l.mod.map(function(m){return m.n;}).join(", ")+")":""),
        l.q, l.p, l.p*l.q, v.neto, v.iva, v.total, v.propina,
        v.doc?("DTE "+v.doc.tipo):"", v.doc?v.doc.folio:"",
        v.anulada?"SÍ":"", v.anulada?v.anulada.motivo:""]);
    });
  });
  var texto=csv(f);
  bajar("ventas-"+desde+"-a-"+hasta+".csv", texto, texto);
}
</script>

<script>
/* ==================== PANEL Y HISTORIAL ==================== */
function ventasEntre(desde,hasta){
  return POS.ventas.filter(function(v){ var d=diaDe(v.ts); return d>=desde && d<=hasta; });
}
function vivas(vs){ return vs.filter(function(v){ return !v.anulada; }); }
function hace(dias){ var d=new Date(); d.setDate(d.getDate()-dias); return hoyISO(d); }

/* Barras verticales dibujadas a la escala: una sola serie (plata vendida),
   con el eje en cero, la línea del máximo rotulada y el valor en el aire
   solo donde hay algo que leer. */
function graficoHoras(datos){
  var W=320, H=132, T=12, B=26, L=46, R=4;   /* L deja un canal para las cifras del eje */
  var max=Math.max.apply(null,datos.map(function(d){ return d.v; }).concat([1]));
  var paso=(W-L-R)/datos.length, ancho=Math.max(6,paso-4);
  var esc=function(v){ return (H-T-B)*(v/max); };
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Ventas por hora del día">';
  [1,.5].forEach(function(f){
    var y=(H-B)-esc(max*f);
    s+='<line x1="'+L+'" y1="'+y.toFixed(1)+'" x2="'+(W-R)+'" y2="'+y.toFixed(1)+'" stroke="var(--linea)" stroke-width="1" stroke-dasharray="3 3"/>';
    s+='<text x="'+(L-6)+'" y="'+(y+3).toFixed(1)+'" font-size="8" text-anchor="end" fill="var(--tinta3)" font-family="var(--mono)">'+plata(Math.round(max*f))+"</text>";
  });
  s+='<line x1="'+L+'" y1="'+(H-B)+'" x2="'+(W-R)+'" y2="'+(H-B)+'" stroke="var(--linea-f)" stroke-width="1"/>';
  datos.forEach(function(d,i){
    var h=d.v>0? Math.max(2,esc(d.v)) : 0, x=L+i*paso+(paso-ancho)/2, y=(H-B)-h;
    if(h>0) s+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+ancho.toFixed(1)+'" height="'+h.toFixed(1)+
      '" rx="3" fill="var(--dato)"><title>'+d.h+":00 · "+plata(d.v)+"</title></rect>";
    if(i%2===0) s+='<text x="'+(x+ancho/2).toFixed(1)+'" y="'+(H-B+12)+'" font-size="8.5" text-anchor="middle" fill="var(--tinta3)" font-family="var(--mono)">'+d.h+"</text>";
  });
  s+='<text x="'+((L+W-R)/2)+'" y="'+(H-3)+'" font-size="8.5" text-anchor="middle" fill="var(--tinta3)">hora del día · 07:00 a 23:00</text>';
  return s+"</svg>";
}
function barrasHTML(items, fmt){
  var max=Math.max.apply(null,items.map(function(i){ return i.v; }).concat([1]));
  return '<div class="barras">'+items.map(function(i){
    return '<div class="br"><span class="bn">'+esc(i.n)+'</span>'+
      '<span class="bt"><i style="width:'+Math.max(2,Math.round(i.v/max*100))+'%"></i></span>'+
      '<span class="bv">'+(fmt?fmt(i):plata(i.v))+"</span></div>";
  }).join("")+"</div>";
}
function tarjetaGraf(tit, extra, cuerpo){
  return '<div class="graf"><div class="gt"><b>'+esc(tit)+"</b>"+(extra?"<em>"+esc(extra)+"</em>":"")+"</div>"+cuerpo+"</div>";
}

function pintarPanel(){
  var c=$("#vPanel"); if(!c) return;
  var hoy=hoyISO(), vs=vivas(ventasEntre(hoy,hoy));
  var totalHoy=sumaBy(vs,function(v){ return v.total; });
  var propHoy=sumaBy(vs,function(v){ return v.propina; });
  var prom=vs.length? Math.round(totalHoy/vs.length):0;
  var cr=criticos(), off=cr.filter(function(x){ return x.e==="off"; });
  var pend=pendientesFolio(), falt=sinPrecio();

  var h='<div class="seccion"><h2 class="vt">Cómo va el día</h2>'+
    '<p class="vs">'+fechaLarga(hoy)+" · horario continuo de 07:00 a 23:00. Todo lo que ves aquí sale de las ventas registradas en este equipo.</p></div>";

  h+='<div class="seccion"><div class="kpis">'+
    '<div class="kpi principal"><span class="k">Vendido hoy</span><span class="v num">'+plata(totalHoy)+'</span><span class="p">'+vs.length+(vs.length===1?" venta":" ventas")+" · ticket promedio "+plata(prom)+"</span></div>"+
    '<div class="kpi"><span class="k">Neto</span><span class="v num">'+plata(neto(totalHoy))+'</span><span class="p">base imponible del día</span></div>'+
    '<div class="kpi"><span class="k">IVA débito</span><span class="v num">'+plata(ivaDe(totalHoy))+'</span><span class="p">19% ya incluido en los precios</span></div>'+
    '<div class="kpi"><span class="k">Propinas</span><span class="v num">'+plata(propHoy)+'</span><span class="p">no forman parte de la base del IVA</span></div>'+
    '<div class="kpi'+(off.length?" mal":(cr.length?" ojo":""))+'"><span class="k">Stock crítico</span><span class="v num">'+cr.length+'</span><span class="p">'+off.length+" en cero · "+(cr.length-off.length)+" por reponer</span></div>"+
    '<div class="kpi'+(pend.length?" ojo":"")+'"><span class="k">Sin folio</span><span class="v num">'+pend.length+'</span><span class="p">ventas sin boleta anotada</span></div>'+
    kpisGestion(hoy,hoy)+
    "</div></div>"+bloqueMeta(totalHoy);

  if(off.length){
    h+='<div class="seccion"><div class="aviso alerta">'+ico("i-alerta",2)+
      "<div><b>"+off.length+(off.length===1?" producto en cero":" productos en cero")+"</b><span>"+
      off.slice(0,4).map(function(x){ return esc(x.p.n); }).join(" · ")+(off.length>4?" y "+(off.length-4)+" más":"")+
      '</span></div><button class="btn chico suave" type="button" data-ir="stock">Ver stock</button></div></div>';
  }
  if(pend.length){
    h+='<div class="seccion"><div class="aviso ojo">'+ico("i-folio",1.9)+
      "<div><b>"+pend.length+(pend.length===1?" venta sin folio de boleta":" ventas sin folio de boleta")+
      "</b><span>Anota el folio del documento emitido en el sistema SII para cerrar el día cuadrado.</span></div>"+
      '<button class="btn chico suave" type="button" data-ir="inf:hist">Ver historial</button></div></div>';
  }
  if(falt.length){
    h+='<div class="seccion"><div class="aviso ojo">'+ico("i-alerta",1.9)+
      "<div><b>"+falt.length+" productos sin precio</b><span>Hasta que tengan precio no se pueden cobrar. Los precios se definen en la Prueba y se aplican al sistema general.</span></div>"+
      '<button class="btn chico suave" type="button" data-prueba="1">Definir en Prueba</button></div></div>';
  }

  var horas=[]; for(var i=7;i<=23;i++) horas.push({h:String(i).padStart(2,"0"), v:0});
  vs.forEach(function(v){ var hh=new Date(v.ts).getHours(); var f=horas.filter(function(x){ return +x.h===hh; })[0]; if(f) f.v+=v.total; });
  var top={}; vs.forEach(function(v){ v.lineas.forEach(function(l){ top[l.n]=(top[l.n]||0)+l.q; }); });
  var topArr=Object.keys(top).map(function(k){ return {n:k, v:top[k]}; }).sort(function(a,b){ return b.v-a.v; }).slice(0,7);
  var pag={}; vs.forEach(function(v){ pag[v.pago]=(pag[v.pago]||0)+v.total; });
  var pagArr=PAGOS.filter(function(p){ return pag[p.id]; }).map(function(p){ return {n:p.n, v:pag[p.id]}; }).sort(function(a,b){ return b.v-a.v; });

  h+='<div class="seccion dos">';
  h+=tarjetaGraf("Ventas por hora", plata(totalHoy)+" en el día", vs.length? graficoHoras(horas) : '<div class="vacio">Todavía no hay ventas registradas hoy.</div>');
  h+=tarjetaGraf("Más vendidos hoy","unidades", topArr.length? barrasHTML(topArr,function(i){ return i.v+" u."; }) : '<div class="vacio">Sin ventas aún.</div>');
  h+="</div>";
  h+='<div class="seccion dos">';
  h+=tarjetaGraf("Por medio de pago","del día", pagArr.length? barrasHTML(pagArr) : '<div class="vacio">Sin ventas aún.</div>');
  h+=tarjetaGraf("Últimos 7 días","cierre por día", (function(){
    var dd=[]; for(var k=6;k>=0;k--){ var f=hace(k); dd.push({n:f.slice(8)+"/"+f.slice(5,7), v:sumaBy(vivas(ventasEntre(f,f)),function(v){ return v.total; })}); }
    return sumaBy(dd,function(x){ return x.v; })? barrasHTML(dd) : '<div class="vacio">Aún no hay una semana de historia.</div>';
  })());
  h+="</div>";
  c.innerHTML=h;
  c.querySelectorAll("[data-ir]").forEach(function(b){ b.onclick=function(){ irA(b.dataset.ir); }; });
  c.querySelectorAll("[data-prueba]").forEach(function(b){ b.onclick=abrirPrueba; });
  var n=pend.length+off.length;
  $("#puntoAlerta").hidden = !n; $("#puntoAlerta").textContent=n;
  document.querySelectorAll("[data-sello]").forEach(function(s){ s.textContent=n; s.hidden=!n; });
}

/* ---------- historial ---------- */
var filtro={desde:"", hasta:"", prod:"", resp:"", pago:"", folio:""};
function pintarHist(){
  var c=$("#infCuerpo"); if(!c) return;
  if(!filtro.desde){ filtro.desde=hace(7); filtro.hasta=hoyISO(); }
  var lista=ventasEntre(filtro.desde, filtro.hasta).slice().reverse();
  if(filtro.prod) lista=lista.filter(function(v){ return v.lineas.some(function(l){ return l.n.toLowerCase().indexOf(filtro.prod.toLowerCase())>=0; }); });
  if(filtro.resp) lista=lista.filter(function(v){ return v.resp===filtro.resp; });
  if(filtro.pago) lista=lista.filter(function(v){ return v.pago===filtro.pago; });
  if(filtro.folio==="sin") lista=lista.filter(function(v){ return !v.anulada && (!v.doc||!v.doc.folio); });
  if(filtro.folio==="con") lista=lista.filter(function(v){ return v.doc&&v.doc.folio; });
  var viv=vivas(lista);

  var h='<div class="seccion"><h2 class="vt">Historial de ventas</h2>'+
    '<p class="vs">Cada venta queda con su hora, su responsable y su folio. Lo que se exporta desde aquí es lo que se le entrega al contador.</p></div>';
  h+='<div class="seccion"><div class="filtros">'+
    '<span class="campo"><label for="fDesde">Desde</label><input id="fDesde" type="date" value="'+filtro.desde+'"></span>'+
    '<span class="campo"><label for="fHasta">Hasta</label><input id="fHasta" type="date" value="'+filtro.hasta+'"></span>'+
    '<span class="campo"><label for="fProd">Producto</label><input id="fProd" type="search" placeholder="Café, empanada…" value="'+esc(filtro.prod)+'"></span>'+
    '<span class="campo"><label for="fResp">Responsable</label><select id="fResp"><option value="">Todos</option>'+
      POS.cfg.resp.map(function(r){ return '<option'+(filtro.resp===r?" selected":"")+">"+esc(r)+"</option>"; }).join("")+"</select></span>"+
    '<span class="campo"><label for="fPago">Medio de pago</label><select id="fPago"><option value="">Todos</option>'+
      PAGOS.map(function(p){ return '<option value="'+p.id+'"'+(filtro.pago===p.id?" selected":"")+">"+esc(p.n)+"</option>"; }).join("")+"</select></span>"+
    '<span class="campo"><label for="fFolio">Boleta</label><select id="fFolio"><option value="">Todas</option>'+
      '<option value="sin"'+(filtro.folio==="sin"?" selected":"")+">Sin folio anotado</option>"+
      '<option value="con"'+(filtro.folio==="con"?" selected":"")+">Con folio</option></select></span>"+
    "</div></div>";
  h+='<div class="seccion"><div class="kpis">'+
    '<div class="kpi"><span class="k">Ventas en el filtro</span><span class="v num">'+viv.length+'</span><span class="p">'+(lista.length-viv.length)+" anuladas</span></div>"+
    '<div class="kpi"><span class="k">Consumo</span><span class="v num">'+plata(sumaBy(viv,function(v){return v.total;}))+'</span><span class="p">IVA incluido</span></div>'+
    '<div class="kpi"><span class="k">Propinas</span><span class="v num">'+plata(sumaBy(viv,function(v){return v.propina;}))+'</span><span class="p">van al equipo</span></div>'+
    "</div></div>";
  h+='<div class="seccion"><button class="btn suave chico" id="btnCSV" type="button">'+ico("i-descarga")+"Exportar el filtro a CSV</button></div>";
  h+='<div class="seccion" id="listaVentas"></div>';
  c.innerHTML=h;

  var L=$("#listaVentas");
  if(!lista.length) L.appendChild(el("div","vacio","No hay ventas con estos filtros."));
  lista.forEach(function(v){
    var d=el("details","venta"+(v.anulada?" anulada":""));
    var pago=(PAGOS.filter(function(p){return p.id===v.pago;})[0]||{}).n||v.pago;
    var est = v.anulada ? '<span class="estado off">Anulada</span>'
      : (v.doc&&v.doc.folio ? '<span class="estado ok">DTE '+esc(v.doc.tipo)+" · "+esc(v.doc.folio)+"</span>"
      : '<span class="estado bajo">Sin folio</span>');
    var s=el("summary");
    s.innerHTML='<span class="hora num">'+hora(v.ts)+"</span><span><span class=\"qn\">"+
      v.lineas.length+(v.lineas.length===1?" ítem":" ítems")+" · "+esc(pago)+
      '</span><span class="qs">'+esc(MODOS[v.modo]||v.modo)+" · "+esc(v.resp)+" · "+est+
      '</span></span><span class="imp num">'+plata(v.total+v.propina)+"</span>";
    d.appendChild(s);
    var cu=el("div","cuerpo");
    var dl=el("dl","dl");
    dl.innerHTML="<dt>Venta</dt><dd>"+esc(v.id)+"</dd>"+
      "<dt>Detalle</dt><dd>"+v.lineas.map(function(l){ return l.q+" × "+esc(l.n); }).join("<br>")+"</dd>"+
      "<dt>Neto</dt><dd>"+plata(v.neto)+"</dd><dt>IVA</dt><dd>"+plata(v.iva)+"</dd>"+
      "<dt>Consumo</dt><dd>"+plata(v.total)+"</dd>"+
      (v.propina?"<dt>Propina</dt><dd>"+plata(v.propina)+"</dd>":"")+
      (v.efectivo?"<dt>Efectivo</dt><dd>recibido "+plata(v.efectivo.rec)+" · vuelto "+plata(v.efectivo.vuelto)+"</dd>":"")+
      (v.anulada?"<dt>Anulación</dt><dd>"+esc(v.anulada.motivo)+" · "+hora(v.anulada.ts)+"</dd>":"");
    cu.appendChild(dl);
    var bb=el("button","btn suave chico","Abrir ficha, folio y vale"); bb.type="button";
    bb.onclick=function(){ hojaVenta(v); };
    cu.appendChild(bb);
    d.appendChild(cu);
    L.appendChild(d);
  });
  function cambia(id,campo,fn){ var e=$("#"+id); if(e) e.onchange=function(){ filtro[campo]= fn?fn(e.value):e.value; pintarHist(); }; }
  cambia("fDesde","desde"); cambia("fHasta","hasta"); cambia("fResp","resp");
  cambia("fPago","pago"); cambia("fFolio","folio");
  var fp=$("#fProd"); if(fp) fp.oninput=function(){ filtro.prod=fp.value; clearTimeout(fp._t); fp._t=setTimeout(pintarHist,320); };
  $("#btnCSV").onclick=function(){ exportarVentas(filtro.desde, filtro.hasta); };
}
</script>

<script>
/* ==================== REPORTES ==================== */
var rep={modo:"dia", desde:hoyISO(), hasta:hoyISO()};
function rangoRep(){
  if(rep.modo==="dia") return [hoyISO(), hoyISO()];
  if(rep.modo==="semana") return [hace(6), hoyISO()];
  if(rep.modo==="mes"){ var d=new Date(); return [hoyISO(new Date(d.getFullYear(),d.getMonth(),1)), hoyISO()]; }
  return [rep.desde, rep.hasta];
}
function pintarRep(){
  var c=$("#infCuerpo"); if(!c) return;
  var r=rangoRep(), vs=vivas(ventasEntre(r[0],r[1])), anul=ventasEntre(r[0],r[1]).length-vs.length;
  var total=sumaBy(vs,function(v){ return v.total; });
  var prop=sumaBy(vs,function(v){ return v.propina; });
  var porPago={}, porGrupo={}, porProd={}, porDia={}, unidades=0;
  vs.forEach(function(v){
    porPago[v.pago]=(porPago[v.pago]||0)+v.total;
    porDia[diaDe(v.ts)]=(porDia[diaDe(v.ts)]||0)+v.total;
    v.lineas.forEach(function(l){
      var it=itemCat(l.id), g=it?it.g:"otro";
      porGrupo[g]=(porGrupo[g]||0)+l.p*l.q;
      porProd[l.n]=porProd[l.n]||{q:0,m:0}; porProd[l.n].q+=l.q; porProd[l.n].m+=l.p*l.q;
      unidades+=l.q;
    });
  });
  var h='<div class="seccion"><h2 class="vt">Reportes</h2>'+
    '<p class="vs">El mismo corte que se le pide a la caja: cuánto entró, cuánto de eso es IVA y en qué se vendió. El neto y el IVA salen del total porque los precios de la carta ya lo incluyen.</p></div>';
  h+='<div class="seccion"><div class="pilas" id="repModos">'+
    [["dia","Hoy"],["semana","Últimos 7 días"],["mes","Mes en curso"],["rango","Rango a elegir"]].map(function(m){
      return '<button class="pila" type="button" data-m="'+m[0]+'" aria-pressed="'+(rep.modo===m[0])+'">'+m[1]+"</button>";
    }).join("")+"</div>";
  if(rep.modo==="rango"){
    h+='<div class="filtros" style="margin-top:8px">'+
      '<span class="campo"><label for="rD">Desde</label><input id="rD" type="date" value="'+rep.desde+'"></span>'+
      '<span class="campo"><label for="rH">Hasta</label><input id="rH" type="date" value="'+rep.hasta+'"></span></div>';
  }
  h+='<p class="mini" style="margin-top:8px">Período: '+fechaLarga(r[0])+" al "+fechaLarga(r[1])+"</p></div>";

  h+='<div class="seccion"><div class="kpis">'+
    '<div class="kpi principal"><span class="k">Total del período</span><span class="v num">'+plata(total)+'</span><span class="p">'+vs.length+" ventas · "+unidades+" unidades"+(anul?" · "+anul+" anuladas":"")+"</span></div>"+
    '<div class="kpi"><span class="k">Neto</span><span class="v num">'+plata(neto(total))+'</span><span class="p">para el F29, línea de ventas afectas</span></div>'+
    '<div class="kpi"><span class="k">IVA débito</span><span class="v num">'+plata(ivaDe(total))+'</span><span class="p">19% sobre el neto</span></div>'+
    '<div class="kpi"><span class="k">Propinas</span><span class="v num">'+plata(prop)+'</span><span class="p">fuera de la base imponible</span></div>'+
    "</div></div>";

  function tabla(tit, filas, pie){
    var t='<div class="seccion"><div class="rotulo"><b>'+esc(tit)+'</b></div><div class="tabox"><table><thead><tr>'+
      filas[0].map(function(x,i){ return '<th'+(i?' class="n"':"")+">"+esc(x)+"</th>"; }).join("")+"</tr></thead><tbody>";
    filas.slice(1).forEach(function(f){
      t+="<tr>"+f.map(function(x,i){ return "<td"+(i?' class="n"':"")+">"+esc(x)+"</td>"; }).join("")+"</tr>";
    });
    t+="</tbody>"+(pie?"<tfoot><tr>"+pie.map(function(x,i){ return "<td"+(i?' class="n"':"")+">"+esc(x)+"</td>"; }).join("")+"</tr></tfoot>":"")+"</table></div></div>";
    return t;
  }
  var fp=[["Medio de pago","Monto","Participación"]];
  PAGOS.forEach(function(p){ if(porPago[p.id]) fp.push([p.n, plata(porPago[p.id]), Math.round(porPago[p.id]/(total||1)*100)+"%"]); });
  h+=tabla("Ingresos por medio de pago", fp, ["Total", plata(total), "100%"]);

  var fg=[["Área de la carta","Monto","Participación"]];
  GRUPOS.forEach(function(g){ if(porGrupo[g.id]) fg.push([g.n, plata(porGrupo[g.id]), Math.round(porGrupo[g.id]/(total||1)*100)+"%"]); });
  h+=tabla("Ventas por área", fg);

  var pr=Object.keys(porProd).map(function(k){ return [k, porProd[k].q, porProd[k].m]; })
    .sort(function(a,b){ return b[2]-a[2]; }).slice(0,15);
  var ft=[["Producto","Unidades","Monto"]];
  pr.forEach(function(p){ ft.push([p[0], p[1], plata(p[2])]); });
  h+=tabla("Los 15 que más dejaron", ft);

  var fd=[["Día","Ventas","Monto","Neto","IVA"]];
  Object.keys(porDia).sort().forEach(function(d){
    var n=vs.filter(function(v){ return diaDe(v.ts)===d; }).length;
    fd.push([d, n, plata(porDia[d]), plata(neto(porDia[d])), plata(ivaDe(porDia[d]))]);
  });
  if(fd.length>1) h+=tabla("Día por día", fd, ["Total","", plata(total), plata(neto(total)), plata(ivaDe(total))]);

  /* cierre de caja */
  var efe=sumaBy(vs.filter(function(v){ return v.pago==="efectivo"; }),function(v){ return v.total+v.propina; });
  h+='<div class="seccion"><div class="rotulo"><b>Cierre de caja</b></div>'+
    '<div class="filtros">'+
    '<span class="campo"><label>Efectivo esperado</label><input value="'+plata(efe)+'" readonly class="num"></span>'+
    '<span class="campo"><label for="inContado">Efectivo contado</label><input id="inContado" type="number" inputmode="numeric" placeholder="0"></span>'+
    '<span class="campo"><label>Diferencia</label><input id="inDif" value="—" readonly class="num"></span>'+
    "</div>"+
    '<button class="btn suave chico" id="btnArqueo" type="button" style="margin-top:9px">Guardar arqueo del período</button>'+
    (POS.arqueos.length? '<p class="mini" style="margin-top:8px">Último arqueo: '+esc(POS.arqueos[POS.arqueos.length-1].ts.slice(0,10))+" · diferencia "+plata(POS.arqueos[POS.arqueos.length-1].dif)+"</p>":"")+
    "</div>";
  h+='<div class="seccion"><button class="btn lleno" id="btnRepCSV" type="button">'+ico("i-descarga")+"Exportar el período a CSV</button>"+
    '<p class="mini" style="margin-top:8px">La ley pide conservar los documentos tributarios electrónicos por seis años. Los XML de las boletas los guarda el sistema emisor; este archivo es el respaldo operativo de la caja.</p></div>';
  c.innerHTML=h;

  c.querySelectorAll("#repModos [data-m]").forEach(function(b){ b.onclick=function(){ rep.modo=b.dataset.m; pintarRep(); }; });
  if($("#rD")) $("#rD").onchange=function(){ rep.desde=$("#rD").value; pintarRep(); };
  if($("#rH")) $("#rH").onchange=function(){ rep.hasta=$("#rH").value; pintarRep(); };
  var ic=$("#inContado");
  if(ic) ic.oninput=function(){ var d=Number(ic.value||0)-efe; $("#inDif").value=(ic.value===""?"—":(d>0?"+":"")+plata(d)); };
  $("#btnArqueo").onclick=function(){
    var v=Number(($("#inContado")||{}).value||0);
    if(!v){ avisar("Anota primero el efectivo contado.","mal"); return; }
    POS.arqueos.push({ts:new Date().toISOString(), desde:r[0], hasta:r[1], esperado:efe, contado:v, dif:v-efe, por:POS.cfg.respActivo||"(sin asignar)"});
    guardarPOS(); pintarRep(); avisar("Arqueo guardado. Diferencia "+plata(v-efe)+".", (v-efe)===0?"bien":"alerta");
  };
  $("#btnRepCSV").onclick=function(){ exportarVentas(r[0], r[1]); };
}

/* ==================== STOCK ==================== */
var stockGrupo="emp";
function pintarStock(){
  var c=$("#vStock"); if(!c) return;
  var falt=sinPrecio(), cr=criticos();
  var h='<div class="seccion"><h2 class="vt">Stock</h2>'+
    '<p class="vs">Lo que se cambia acá lo ven al instante la carta del cliente, el Control de Salón y las Comandas en este mismo equipo. Las empanadas se cuentan por lata de '+LATA+" unidades.</p></div>";
  if(cr.length){
    h+='<div class="seccion"><div class="aviso '+(cr.some(function(x){return x.e==="off";})?"alerta":"ojo")+'">'+ico("i-alerta",2)+
      "<div><b>"+cr.length+" para mirar</b><span>"+cr.slice(0,6).map(function(x){ return esc(x.p.n)+(x.u!=null?" ("+x.u+")":""); }).join(" · ")+"</span></div><span></span></div></div>";
  }
  if(falt.length){
    h+='<div class="seccion"><div class="aviso ojo">'+ico("i-alerta",1.9)+
      "<div><b>"+falt.length+" productos sin precio</b><span>Los precios se definen en la Prueba, se simulan y se aplican al sistema general. Desde ahí llegan a esta caja y a la carta.</span></div>"+
      '<button class="btn chico suave" type="button" id="btnIrPrueba">Abrir Prueba</button></div></div>';
  }
  h+='<div class="seccion"><div class="pilas" id="stGrupos">'+GRUPOS.map(function(g){
      return '<button class="pila" type="button" data-g="'+g.id+'" aria-pressed="'+(stockGrupo===g.id)+'">'+esc(g.n)+"</button>";
    }).join("")+"</div></div>";
  var lista=CAT.filter(function(p){ return p.g===stockGrupo; });
  h+='<div class="seccion"><div class="tabox"><table><thead><tr><th>Producto</th><th class="n">Unidades</th><th class="n">Estado</th><th class="n">Ajustar</th></tr></thead><tbody>';
  lista.forEach(function(p){
    var u=unidades(p.id), e=estadoDe(p.id);
    var etq = e==="off"?'<span class="estado off">Agotado</span>' : e==="bajo"?'<span class="estado bajo">Quedan pocas</span>' : '<span class="estado ok">Disponible</span>';
    h+="<tr><td>"+esc(p.n)+'</td><td class="n"><input data-u="'+p.id+'" type="number" inputmode="numeric" min="0" value="'+(u==null?"":u)+
      '" placeholder="—" style="width:76px;border:1.5px solid var(--linea);border-radius:8px;padding:5px 7px;font-family:var(--mono)"></td>'+
      '<td class="n">'+etq+'</td><td class="n"><span class="pilas" style="justify-content:flex-end">'+
      (p.g==="emp"?'<button class="pila" type="button" data-lata="'+p.id+'">+ lata</button>':"")+
      '<button class="pila" type="button" data-mas="'+p.id+'">+1</button>'+
      '<button class="pila" type="button" data-off="'+p.id+'">'+(e==="off"?"Reponer":"Agotado")+"</button></span></td></tr>";
  });
  h+="</tbody></table></div>"+
    '<p class="mini" style="margin-top:8px">Un producto sin número queda con el estado que le puso el Control de Salón (disponible, quedan pocas o agotado). Con número, la caja lo descuenta sola en cada venta y avisa bajo '+POS.cfg.umbral+" unidades.</p></div>";
  c.innerHTML=h;

  c.querySelectorAll("#stGrupos [data-g]").forEach(function(b){ b.onclick=function(){ stockGrupo=b.dataset.g; pintarStock(); }; });
  if($("#btnIrPrueba")) $("#btnIrPrueba").onclick=abrirPrueba;
  c.querySelectorAll("[data-u]").forEach(function(i){ i.onchange=function(){
    var id=i.dataset.u;
    if(i.value===""){ delete CTRL.uni[id]; } else { CTRL.uni[id]=Math.max(0,Math.round(Number(i.value))); fijarEstadoDesdeUnidades(id); }
    guardarCtrl(); pintarStock(); pintarRejilla(); pintarPanel();
  }; });
  c.querySelectorAll("[data-lata]").forEach(function(b){ b.onclick=function(){
    var id=b.dataset.lata; CTRL.uni[id]=(unidades(id)||0)+LATA; fijarEstadoDesdeUnidades(id);
    guardarCtrl(); pintarStock(); pintarRejilla(); pintarPanel(); avisar("Lata de "+LATA+" agregada.","bien");
  }; });
  c.querySelectorAll("[data-mas]").forEach(function(b){ b.onclick=function(){
    var id=b.dataset.mas; CTRL.uni[id]=(unidades(id)||0)+1; fijarEstadoDesdeUnidades(id);
    guardarCtrl(); pintarStock(); pintarRejilla(); pintarPanel();
  }; });
  c.querySelectorAll("[data-off]").forEach(function(b){ b.onclick=function(){
    var id=b.dataset.off;
    if(estadoDe(id)==="off"){ if(unidades(id)!=null) CTRL.uni[id]=LATA; CTRL.st[id]="ok"; }
    else { if(unidades(id)!=null) CTRL.uni[id]=0; CTRL.st[id]="off"; }
    guardarCtrl(); pintarStock(); pintarRejilla(); pintarPanel();
  }; });
}
</script>

<script>
/* ==================== ADMINISTRACIÓN GASTRONÓMICA ====================
   La caja registra lo que entra. Esta parte registra lo que cuesta.
   Sin las dos mitades, el total del día no dice si el día fue bueno.

   Vocabulario, para que signifique lo mismo en toda la herramienta:
   COSTO      lo que cuesta producir una unidad, sin IVA.
   FOOD COST  ese costo dividido por la venta neta del producto, en %.
              Se calcula sobre el NETO, no sobre el precio de carta: el
              IVA no es ingreso del local, se le entrega al fisco.
   MARGEN     venta neta menos costo. Es lo que queda para pagar todo
              lo demás: arriendo, sueldos, luz, agua, el propio sueldo.
   MERMA      lo que se produjo o se compró y no se vendió.
   ==================================================================== */

var CATCOMPRA=[
  {id:"insumo-coc", n:"Insumos de cocina"},
  {id:"insumo-bar", n:"Insumos de barra"},
  {id:"cafe",       n:"Café en grano"},
  {id:"pasteleria", n:"Pastelería"},
  {id:"envases",    n:"Envases y desechables"},
  {id:"aseo",       n:"Aseo e higiene"},
  {id:"servicios",  n:"Servicios básicos"},
  {id:"arriendo",   n:"Arriendo"},
  {id:"sueldos",    n:"Sueldos y honorarios"},
  {id:"mantencion", n:"Mantención y equipos"},
  {id:"otros",      n:"Otros"}
];
var MOTIVOS=[
  {id:"vencido",   n:"Se venció"},
  {id:"quemado",   n:"Se quemó o se pasó"},
  {id:"caida",     n:"Se cayó o se rompió"},
  {id:"error",     n:"Error de preparación"},
  {id:"devuelto",  n:"Devuelto por el cliente"},
  {id:"cortesia",  n:"Cortesía de la casa"},
  {id:"degusta",   n:"Degustación o prueba"},
  {id:"personal",  n:"Consumo del personal"}
];
var UNID=[{id:"g",n:"g"},{id:"kg",n:"kg"},{id:"ml",n:"ml"},{id:"l",n:"L"},{id:"u",n:"unidad"}];

/* ---------- costos ---------- */
function costoDe(id){ var c=POS.costos[id]; return (typeof c==="number" && c>=0) ? c : null; }
function netoDe(p){ var pr=precioDe(p); return pr==null? null : neto(pr); }
function foodCost(p){ var c=costoDe(p.id), n=netoDe(p); if(c==null||!n) return null; return c/n*100; }
function margenU(p){ var c=costoDe(p.id), n=netoDe(p); if(c==null||n==null) return null; return n-c; }
function metaFC(){ return Number(POS.cfg.metas.food)||32; }
function semFC(fc){ return fc==null ? "neutro" : fc<=metaFC() ? "ok" : (fc<=metaFC()+8 ? "bajo" : "off"); }
function textoFC(fc){ return fc==null ? "sin costo" : fc.toFixed(1)+"%"; }
function sinCosto(){ return CAT.filter(function(p){ return precioDe(p)!=null && costoDe(p.id)==null; }); }

/* Ficha de costo (escandallo). Cada ingrediente con su cantidad y su
   precio por unidad de compra. El factor de merma cubre lo que se pierde
   al limpiar, pelar o porcionar; el rendimiento reparte el total entre
   las porciones que salen de una preparación. */
function fichaDe(id){
  var f=POS.fichas[id];
  if(!f||typeof f!=="object") f={ing:[], merma:0, rinde:1};
  if(!Array.isArray(f.ing)) f.ing=[];
  if(!(Number(f.rinde)>0)) f.rinde=1;
  if(!(Number(f.merma)>=0)) f.merma=0;
  return f;
}
function costoFicha(f){
  var base=sumaBy(f.ing,function(i){ return (Number(i.c)||0)*(Number(i.cu)||0); });
  return Math.round(base*(1+(Number(f.merma)||0)/100)/(Number(f.rinde)||1));
}

/* ---------- compras y gastos ---------- */
function comprasEntre(d,h){ return POS.compras.filter(function(c){ return c.dia>=d && c.dia<=h; }); }
function nombreCat(id){ for(var i=0;i<CATCOMPRA.length;i++) if(CATCOMPRA[i].id===id) return CATCOMPRA[i].n; return id; }
function esMercaderia(id){ return ["insumo-coc","insumo-bar","cafe","pasteleria","envases"].indexOf(id)>=0; }

/* ---------- mermas ---------- */
function mermasEntre(d,h){ return POS.mermas.filter(function(m){ return m.dia>=d && m.dia<=h; }); }
function valorMerma(m){ var c=costoDe(m.id); return c!=null ? c*m.q : 0; }
function nombreMotivo(id){ for(var i=0;i<MOTIVOS.length;i++) if(MOTIVOS[i].id===id) return MOTIVOS[i].n; return id; }

/* ---------- registro ---------- */
function anotarCompra(o){
  o.id="C"+Date.now().toString(36).toUpperCase();
  o.ts=new Date().toISOString();
  POS.compras.push(o); guardarPOS();
  avisar("Compra anotada: "+plata(o.monto)+" en "+nombreCat(o.cat)+".","bien");
}
function anotarMerma(o){
  o.id="M"+Date.now().toString(36).toUpperCase();
  o.ts=new Date().toISOString();
  POS.mermas.push(o);
  descontar(o.id2, o.q);
  guardarPOS(); guardarCtrl();
  var v=valorMerma({id:o.id2,q:o.q});
  avisar("Merma anotada: "+o.q+" de "+o.n+(v?" ("+plata(v)+")":"")+".","alerta");
}

/* ==================== VISTAS DE GESTIÓN ==================== */
var SUBGEST=[
  {id:"costos",  n:"Costos"},
  {id:"compras", n:"Compras"},
  {id:"mermas",  n:"Mermas"},
  {id:"metas",   n:"Metas"}
];
var subGest="costos";
function barraSub(lista, activo, alElegir){
  var h='<div class="subtabs" role="tablist">';
  lista.forEach(function(s){
    h+='<button class="pila" type="button" role="tab" data-sub="'+s.id+'" aria-pressed="'+(s.id===activo?"true":"false")+'">'+esc(s.n)+"</button>";
  });
  return h+"</div>";
}
function colgarSub(cont, alElegir){
  cont.querySelectorAll("[data-sub]").forEach(function(b){ b.onclick=function(){ alElegir(b.dataset.sub); }; });
}
function pintarGest(){
  var t=$("#gestTabs"); if(!t) return;
  t.innerHTML=barraSub(SUBGEST, subGest);
  colgarSub(t, function(id){ subGest=id; pintarGest(); });
  if(subGest==="costos") pintarCostos();
  if(subGest==="compras") pintarCompras();
  if(subGest==="mermas") pintarMermas();
  if(subGest==="metas") pintarMetas();
}

/* ---------- costos ---------- */
var grupoCosto="emp", ordenCosto="grupo";
function pintarCostos(){
  var c=$("#gestCuerpo"); if(!c) return;
  var r=[hace(29), hoyISO()], m=metricas(r[0],r[1]);
  var falta=sinCosto(), falta2=sinPrecio();

  var h='<div class="seccion"><h2 class="vt">Cuánto cuesta lo que vendes</h2>'+
    '<p class="vs">El food cost se calcula sobre la venta neta, sin el IVA: ese 19% no es tuyo, se le entrega al fisco. '+
    'Un café de máquina sano anda entre 15% y 25%; un plato de cocina, entre 28% y 35%. Tu meta actual es '+metaFC()+'%.</p></div>';

  h+='<div class="seccion"><div class="kpis">'+
    '<div class="kpi principal"><span class="k">Food cost real · 30 días</span><span class="v num">'+
      (m.fcReal==null?"—":m.fcReal.toFixed(1)+"%")+'</span><span class="p">'+
      (m.fcReal==null? "faltan costos para calcularlo" : "meta "+metaFC()+"% · "+(m.fcReal<=metaFC()?"dentro":"sobre la meta"))+"</span></div>"+
    '<div class="kpi"><span class="k">Margen bruto · 30 días</span><span class="v num">'+plata(m.margen)+'</span><span class="p">venta neta menos costo de lo vendido</span></div>'+
    '<div class="kpi'+(falta.length?" ojo":"")+'"><span class="k">Sin costo</span><span class="v num">'+falta.length+'</span><span class="p">productos con precio pero sin costo</span></div>'+
    '<div class="kpi'+(falta2.length?" ojo":"")+'"><span class="k">Sin precio</span><span class="v num">'+falta2.length+'</span><span class="p">no se pueden cobrar todavía</span></div>'+
    "</div></div>";

  if(falta.length){
    h+='<div class="seccion"><div class="aviso ojo">'+ico("i-alerta",1.9)+
      "<div><b>"+falta.length+" productos sin costo</b><span>Mientras falten, el food cost del local es una estimación incompleta. "+
      "Empieza por los que más vendes: "+esc(falta.slice(0,3).map(function(p){ return p.n; }).join(" · "))+"</span></div></div></div>";
  }

  h+='<div class="seccion"><div class="pilas" id="cGrupos">'+GRUPOS.map(function(g){
    return '<button class="pila" type="button" data-cg="'+g.id+'" aria-pressed="'+(g.id===grupoCosto?"true":"false")+'">'+esc(g.n)+"</button>";
  }).join("")+'<button class="pila" type="button" data-cg="peores" aria-pressed="'+(grupoCosto==="peores"?"true":"false")+'">Peor margen</button></div></div>';

  var lista;
  if(grupoCosto==="peores"){
    lista=CAT.filter(function(p){ return foodCost(p)!=null; }).sort(function(a,b){ return foodCost(b)-foodCost(a); }).slice(0,25);
  } else {
    lista=CAT.filter(function(p){ return p.g===grupoCosto; });
  }

  h+='<div class="seccion"><div class="tabox"><table class="tbl"><thead><tr>'+
    "<th>Producto</th><th>Precio</th><th>Neto</th><th>Costo</th><th>Margen</th><th>Food cost</th><th></th>"+
    "</tr></thead><tbody>";
  if(!lista.length) h+='<tr><td colspan="7"><div class="vacio">No hay productos en este grupo.</div></td></tr>';
  lista.forEach(function(p){
    var pr=precioDe(p), n=netoDe(p), co=costoDe(p.id), mg=margenU(p), fc=foodCost(p);
    h+="<tr><td><b>"+esc(p.n)+"</b><span class='mini'>"+esc(SUBN[p.sub]||p.sub)+"</span></td>"+
      '<td class="num">'+(pr==null?"—":plata(pr))+"</td>"+
      '<td class="num">'+(n==null?"—":plata(n))+"</td>"+
      '<td><input class="mininum" data-costo="'+p.id+'" type="number" inputmode="numeric" min="0" step="10" value="'+(co==null?"":co)+'" placeholder="—" aria-label="Costo de '+esc(p.n)+'"></td>'+
      '<td class="num">'+(mg==null?"—":plata(mg))+"</td>"+
      '<td><span class="estado '+semFC(fc)+'">'+textoFC(fc)+"</span></td>"+
      '<td><button class="btn chico suave" type="button" data-ficha="'+p.id+'">Ficha</button></td></tr>';
  });
  h+="</tbody></table></div></div>";

  h+='<div class="seccion"><div class="fila"><button class="btn suave chico" id="btnCostoCSV" type="button">'+ico("i-descarga")+"Exportar costos y márgenes</button>"+
     '<button class="btn suave chico" id="btnCostoPegar" type="button">Pegar costos desde una planilla</button></div></div>';

  c.innerHTML=h;
  c.querySelectorAll("[data-cg]").forEach(function(b){ b.onclick=function(){ grupoCosto=b.dataset.cg; pintarCostos(); }; });
  c.querySelectorAll("[data-costo]").forEach(function(i){
    i.onchange=function(){
      var v=i.value===""? null : Math.max(0, Math.round(Number(i.value)||0));
      if(v==null) delete POS.costos[i.dataset.costo]; else POS.costos[i.dataset.costo]=v;
      guardarPOS(); pintarCostos();
    };
  });
  c.querySelectorAll("[data-ficha]").forEach(function(b){ b.onclick=function(){ hojaFicha(itemCat(b.dataset.ficha)); }; });
  $("#btnCostoCSV").onclick=function(){ exportarCostos(); };
  $("#btnCostoPegar").onclick=hojaPegarCostos;
}

/* Ficha técnica completa: el costo (ingredientes, merma y rendimiento) y,
   desde la versión 2.0, la estandarización operativa que antes vivía en el
   escandallo de Emporio System: vajilla, utensilios, paso a paso, puntos
   críticos y guía visual. Una sola ficha por producto. */
var CAMPOS_FICHA=[
  ["vaj","Vajilla y montaje"],["ute","Utensilios clave"],["prep","1 · Preparación"],
  ["coc","2 · Cocción (temperaturas y tiempos)"],["mont","3 · Emplatado y montaje"],
  ["crit","Puntos críticos (uno por línea)"],["vis","Guía visual de emplatado"]];
function fichaMarkdown(p,f){
  var total=costoFicha(f), pr=precioDe(p), n=pr==null?null:neto(pr), P=function(t){ return "[COMPLETAR "+t+"]"; };
  var L=["# Ficha técnica: "+p.n, "", "**Rendimiento:** "+f.rinde+(+f.rinde===1?" porción":" porciones")+" · **Merma:** "+f.merma+"%", "",
    "## Escandallo", "", "| Ingrediente | Cantidad | Costo por unidad | Costo |", "| :--- | ---: | ---: | ---: |"];
  f.ing.forEach(function(i){ L.push("| "+(i.n||P(""))+" | "+(i.c||P("CANTIDAD"))+" "+(i.u||"")+" | "+(i.cu?plata(i.cu):P("PRECIO"))+" | "+plata((+i.c||0)*(+i.cu||0))+" |"); });
  L.push("", "- **Costo por porción:** "+plata(total));
  if(n) L.push("- **Precio en carta:** "+plata(pr)+" (neto "+plata(n)+") · **food cost:** "+(total?(total/n*100).toFixed(1)+"%":P("COSTOS")));
  L.push("", "## Estandarización operativa", "");
  CAMPOS_FICHA.forEach(function(c){
    var v=(f[c[0]]||"").trim();
    if(c[0]==="crit"){ L.push("**"+c[1].replace(" (uno por línea)","")+":**"); (v?v.split("\n"):[P("PUNTOS CRÍTICOS")]).forEach(function(x){ if(x.trim()) L.push("- "+x.trim()); }); }
    else L.push("**"+c[1]+":** "+(v||P("")));
  });
  return L.join("\n");
}
function hojaFicha(p){
  if(!p) return;
  abrirHoja("Ficha técnica · "+p.n, function(b){
    var f=fichaDe(p.id);
    b.appendChild(el("p","vs","Anota los ingredientes con la cantidad que lleva una porción y lo que cuesta esa unidad al comprarla. "+
      "El factor de merma cubre lo que se pierde al limpiar o porcionar. El rendimiento reparte el total entre las porciones que salen de una sola preparación."));
    var cont=el("div","fichaing"); b.appendChild(cont);
    var pie=el("div","seccion"); b.appendChild(pie);
    var op=el("div","seccion");
    op.innerHTML='<div class="rotulo"><b>Estandarización operativa</b></div>'+CAMPOS_FICHA.map(function(c){
      return '<span class="campo"><label for="fo-'+c[0]+'">'+esc(c[1])+'</label><textarea id="fo-'+c[0]+'" data-fo="'+c[0]+'" rows="'+(c[0]==="crit"||c[0]==="prep"?3:2)+'">'+esc(f[c[0]]||"")+'</textarea></span>';
    }).join("");
    b.appendChild(op);
    op.querySelectorAll("[data-fo]").forEach(function(t){ t.oninput=function(){ f[t.dataset.fo]=t.value; }; });
    var acc=el("div","seccion"); b.appendChild(acc);

    function pintar(){
      cont.innerHTML="";
      f.ing.forEach(function(ing,idx){
        var fila=el("div","ingfila");
        fila.innerHTML='<input data-i="n" type="text" value="'+esc(ing.n||"")+'" placeholder="Ingrediente" aria-label="Ingrediente">'+
          '<input data-i="c" type="number" inputmode="decimal" step="any" min="0" value="'+(ing.c==null?"":ing.c)+'" placeholder="Cant." aria-label="Cantidad">'+
          '<select data-i="u" aria-label="Unidad">'+UNID.map(function(u){ return '<option value="'+u.id+'"'+(ing.u===u.id?" selected":"")+">"+u.n+"</option>"; }).join("")+"</select>"+
          '<input data-i="cu" type="number" inputmode="decimal" step="any" min="0" value="'+(ing.cu==null?"":ing.cu)+'" placeholder="$ por unidad" aria-label="Costo por unidad">'+
          '<button class="icobtn chico" type="button" data-quita="'+idx+'" aria-label="Quitar">×</button>';
        fila.querySelectorAll("[data-i]").forEach(function(inp){
          inp.onchange=function(){
            var k=inp.dataset.i;
            ing[k] = (k==="n"||k==="u") ? inp.value : Number(inp.value)||0;

      catch(e){ mostrarTexto(t); }

/* ---------- compras y gastos ---------- */
var rangoComp={modo:"mes", desde:hoyISO(), hasta:hoyISO()};
function rangoDe(r){
  if(r.modo==="dia") return [hoyISO(), hoyISO()];
  if(r.modo==="semana") return [hace(6), hoyISO()];
  if(r.modo==="mes"){ var d=new Date(); return [hoyISO(new Date(d.getFullYear(),d.getMonth(),1)), hoyISO()]; }
  return [r.desde, r.hasta];
}
function barraRango(r, pre){
  var M=[{id:"dia",n:"Hoy"},{id:"semana",n:"7 días"},{id:"mes",n:"Este mes"},{id:"rango",n:"Elegir fechas"}];
  var h='<div class="pilas">'+M.map(function(m){
    return '<button class="pila" type="button" data-rg="'+m.id+'" aria-pressed="'+(r.modo===m.id?"true":"false")+'">'+m.n+"</button>";
  }).join("")+"</div>";
  if(r.modo==="rango"){
    h+='<div class="filtros"><span class="campo"><label for="'+pre+'D">Desde</label><input id="'+pre+'D" type="date" value="'+r.desde+'"></span>'+
       '<span class="campo"><label for="'+pre+'H">Hasta</label><input id="'+pre+'H" type="date" value="'+r.hasta+'"></span></div>';
  }
  return h;
}
function colgarRango(c, r, pre, repintar){
  c.querySelectorAll("[data-rg]").forEach(function(b){ b.onclick=function(){ r.modo=b.dataset.rg; repintar(); }; });
  if(r.modo==="rango"){
    var d=$("#"+pre+"D"), h=$("#"+pre+"H");
    if(d) d.onchange=function(){ r.desde=d.value; repintar(); };
    if(h) h.onchange=function(){ r.hasta=h.value; repintar(); };
  }
}

/* ==================== MEDICIÓN ====================
   Un solo lugar que calcula. Todo lo que se muestra en el panel, en las
   estadísticas y en el informe sale de esta función, para que tres
   pantallas no puedan contradecirse entre ellas.
   ================================================================== */
function metricas(desde,hasta){
  var todas=ventasEntre(desde,hasta), vs=vivas(todas);
  var m={
    desde:desde, hasta:hasta,
    nVentas:vs.length, anuladas:todas.length-vs.length,
    total:0, neto:0, iva:0, propina:0, unidades:0,
    porHora:{}, porDia:{}, porGrupo:{}, porProd:{}, porPago:{}, porModo:{}, porResp:{}, porSemana:{},
    costoVendido:0, conCosto:0, sinCosto:0
  };
  vs.forEach(function(v){
    m.total+=v.total; m.neto+=v.neto; m.iva+=v.iva; m.propina+=v.propina;
    var hh=String(new Date(v.ts).getHours()).padStart(2,"0");
    m.porHora[hh]=(m.porHora[hh]||0)+v.total;
    m.porDia[diaDe(v.ts)]=(m.porDia[diaDe(v.ts)]||0)+v.total;
    m.porSemana[new Date(v.ts).getDay()]=(m.porSemana[new Date(v.ts).getDay()]||0)+v.total;
    m.porPago[v.pago]=(m.porPago[v.pago]||0)+v.total;
    m.porModo[v.modo]=(m.porModo[v.modo]||0)+v.total;
    m.porResp[v.resp]=m.porResp[v.resp]||{v:0,n:0}; m.porResp[v.resp].v+=v.total; m.porResp[v.resp].n++;
    v.lineas.forEach(function(l){
      var it=itemCat(l.id), g=it?it.g:"otro", co=costoDe(l.id);
      m.unidades+=l.q;
      m.porGrupo[g]=(m.porGrupo[g]||0)+l.p*l.q;
      var P=m.porProd[l.id]=m.porProd[l.id]||{id:l.id, n:l.n, q:0, m:0, costo:0, conCosto:co!=null};
      P.q+=l.q; P.m+=l.p*l.q;
      if(co!=null){ P.costo+=co*l.q; m.costoVendido+=co*l.q; m.conCosto+=neto(l.p*l.q); }
      else m.sinCosto+=neto(l.p*l.q);
    });
  });
  m.ticket = m.nVentas ? Math.round(m.total/m.nVentas) : 0;
  m.unidadesPorVenta = m.nVentas ? (m.unidades/m.nVentas) : 0;
  /* El food cost real solo puede calcularse sobre lo que sí tiene costo.
     Mezclarlo con lo que no lo tiene daría un número bonito y falso. */
  m.fcReal = m.conCosto ? (m.costoVendido/m.conCosto*100) : null;
  m.cobertura = (m.conCosto+m.sinCosto) ? m.conCosto/(m.conCosto+m.sinCosto)*100 : 0;
  m.margen = Math.round(m.conCosto - m.costoVendido);
  var cs=comprasEntre(desde,hasta);
  m.compras=sumaBy(cs,function(x){ return x.monto; });
  m.comprasMerc=sumaBy(cs.filter(function(x){ return esMercaderia(x.cat); }),function(x){ return x.monto; });
  m.porCatCompra={}; cs.forEach(function(x){ m.porCatCompra[x.cat]=(m.porCatCompra[x.cat]||0)+x.monto; });
  var ms=mermasEntre(desde,hasta);
  m.mermaValor=sumaBy(ms,function(x){ return valorMerma({id:x.id2,q:x.q}); });
  m.mermaUnid=sumaBy(ms,function(x){ return x.q; });
  m.mermaPct = m.neto ? m.mermaValor/m.neto*100 : null;
  /* Resultado de caja: lo que entró sin IVA menos todo lo que se anotó
     que salió. No es la utilidad contable: solo ve lo que registraste. */
  m.resultado = Math.round(m.neto - m.compras);
  m.dias = Object.keys(m.porDia).length;
  var hs=Object.keys(m.porHora).sort(function(a,b){ return m.porHora[b]-m.porHora[a]; });
  m.horaPunta = hs.length? hs[0] : null;
  return m;
}
function periodoAnterior(desde,hasta){
  var d1=new Date(desde+"T12:00:00"), d2=new Date(hasta+"T12:00:00");
  var largo=Math.round((d2-d1)/86400000)+1;
  var f2=new Date(d1); f2.setDate(f2.getDate()-1);
  var f1=new Date(f2); f1.setDate(f1.getDate()-(largo-1));
  return [hoyISO(f1), hoyISO(f2)];
}
function delta(a,b){ if(!b) return null; return (a-b)/b*100; }
function flecha(d, alReves){
  if(d==null) return '<span class="dlt neutro">sin base</span>';
  var bien = alReves ? d<=0 : d>=0;
  return '<span class="dlt '+(bien?"sube":"baja")+'">'+(d>=0?"▲":"▼")+" "+Math.abs(d).toFixed(1)+"%</span>";
}

/* ---------- ingeniería de menú ----------
   Clasifica cada producto por dos ejes: cuánto se vende comparado con el
   promedio, y cuánto margen deja comparado con el promedio. La regla del
   70% viene de Kasavana y Smith (1982) y sigue siendo el estándar.
   ESTRELLA  se vende y deja: cuídala, no la cambies.
   CABALLO   se vende y deja poco: sube el precio de a poco o baja el costo.
   ENIGMA    deja pero no se vende: muéstralo mejor, ofrécelo primero.
   PERRO     ni se vende ni deja: sácalo de la carta.                  */
function ingenieriaMenu(m){
  var items=Object.keys(m.porProd).map(function(k){ return m.porProd[k]; })
    .filter(function(p){ return p.conCosto && p.q>0; });
  if(items.length<4) return null;
  var totQ=sumaBy(items,function(p){ return p.q; });
  var totMargen=sumaBy(items,function(p){ return neto(p.m)-p.costo; });
  var margenProm=totMargen/totQ;
  var umbralQ=(totQ/items.length)*0.7;
  items.forEach(function(p){
    p.margenU=(neto(p.m)-p.costo)/p.q;
    p.pop = p.q>=umbralQ;
    p.rico = p.margenU>=margenProm;
    p.clase = p.pop ? (p.rico?"estrella":"caballo") : (p.rico?"enigma":"perro");
  });
  return {items:items.sort(function(a,b){ return b.q-a.q; }), margenProm:margenProm, umbralQ:umbralQ};
}
var CLASES={
  estrella:{n:"Estrellas", d:"Se venden y dejan margen. No les muevas nada: son la razón por la que el mes cierra."},
  caballo: {n:"Caballos de batalla", d:"Se venden mucho y dejan poco. Sube el precio de a poco, o baja el costo sin tocar la porción."},
  enigma:  {n:"Enigmas", d:"Dejan margen pero casi nadie los pide. Ponlos adelante en la carta y que el equipo los ofrezca primero."},
  perro:   {n:"Perros", d:"Ni se venden ni dejan. Ocupan espacio en la carta y en la cámara: sácalos o reinvéntalos."}
};

function hojaInforme(d,h){
  abrirHoja("Informe del período", function(b){
    b.innerHTML=informeHTML(d,h);

    btn.style.marginTop="14px"; btn.onclick=function(){ window.print(); };
    b.appendChild(btn);
  });
}
function hojaResumen(d,h){
  abrirHoja("Resumen para mandar", function(b){
    b.appendChild(el("p","vs","Cópialo y pégalo donde lo necesites. Cabe en un mensaje."));
    var t=el("textarea"); t.value=resumenTexto(d,h); t.rows=18;
    t.style.width="100%"; t.style.fontFamily="var(--mono)"; t.style.fontSize="12px";
    t.style.border="1.5px solid var(--linea)"; t.style.borderRadius="10px"; t.style.padding="10px";
    b.appendChild(t);
    var btn=el("button","btn lleno","Copiar"); btn.type="button"; btn.style.marginTop="10px";
    btn.onclick=function(){
      t.select();
      try{ if(navigator.clipboard) navigator.clipboard.writeText(t.value); else document.execCommand("copy"); avisar("Resumen copiado.","bien"); }
      catch(e){ avisar("Copia manualmente: el texto ya está seleccionado.","alerta"); }
    };
    b.appendChild(btn);
  });
}
function exportarResumen(d,h){
  var f=[["Fecha","Ventas","Total","Neto","IVA","Propinas","Unidades","Ticket promedio","Gastos","Merma"]];
  var dias=[], x=new Date(d+"T12:00:00"), fin=new Date(h+"T12:00:00");
  while(x<=fin){ dias.push(hoyISO(x)); x.setDate(x.getDate()+1); }
  dias.forEach(function(dd){
    var m=metricas(dd,dd);
    if(!m.nVentas && !m.compras && !m.mermaValor) return;
    f.push([dd, m.nVentas, m.total, m.neto, m.iva, m.propina, m.unidades, m.ticket, m.compras, m.mermaValor]);
  });
  var t=csv(f); bajar("resumen-"+d+"-a-"+h+".csv", t, t);
}
function exportarProductos(d,h){
  var m=metricas(d,h);
  var f=[["Producto","Grupo","Unidades","Venta bruta","Venta neta","Costo","Margen","Food cost %","Clase"]];
  var ing=ingenieriaMenu(m), clases={};
  if(ing) ing.items.forEach(function(p){ clases[p.id]=CLASES[p.clase].n; });
  Object.keys(m.porProd).map(function(k){ return m.porProd[k]; })
    .sort(function(a,b){ return b.m-a.m; }).forEach(function(p){
      var it=itemCat(p.id), nv=neto(p.m);
      f.push([p.n, it? ((GRUPOS.filter(function(g){return g.id===it.g;})[0]||{}).n||it.g) : "",
        p.q, p.m, nv, p.conCosto?p.costo:"", p.conCosto?(nv-p.costo):"",
        p.conCosto&&nv? (p.costo/nv*100).toFixed(1):"", clases[p.id]||""]);
    });
  var t=csv(f); bajar("productos-"+d+"-a-"+h+".csv", t, t);
}
function respaldar(){
  var datos={marca:"emporio-andino", version:2, fecha:new Date().toISOString(), pos:POS, control:CTRL};
  var t=JSON.stringify(datos);
  bajar("respaldo-caja-"+hoyISO()+".json", t, t);
}
function hojaRestaurar(){
  abrirHoja("Restaurar desde un respaldo", function(b){
    var av=el("div","aviso alerta");
    av.innerHTML=ico("i-alerta",2)+"<div><b>Esto reemplaza todo lo que hay en este equipo</b>"+
      "<span>Las ventas, compras, mermas, costos y ajustes actuales se pierden. Baja un respaldo antes, si acaso.</span></div>";
    b.appendChild(av);
    b.appendChild(el("p","vs","Pega el contenido del archivo de respaldo."));
    var t=el("textarea"); t.rows=8; t.style.width="100%"; t.style.fontFamily="var(--mono)"; t.style.fontSize="11px";
    t.style.border="1.5px solid var(--linea)"; t.style.borderRadius="10px"; t.style.padding="10px";
    b.appendChild(t);
    var btn=el("button","btn grave lleno","Restaurar"); btn.type="button"; btn.style.marginTop="10px";
    btn.onclick=function(){
      var o;
      try{ o=JSON.parse(t.value); }catch(e){ avisar("Ese texto no es un respaldo válido.","mal"); return; }
      if(!o||o.marca!=="emporio-andino"||!o.pos){ avisar("Ese respaldo no es de esta caja.","mal"); return; }
      POS=o.pos; if(o.control) CTRL=o.control;
      guardarPOS(); guardarCtrl(); cerrarHoja(); pintarTodo();
      avisar("Respaldo restaurado.","bien");
    };
    b.appendChild(btn);
  });
}

function bloqueMeta(totalHoy){
  var meta=Number(POS.cfg.metas.dia)||0;
  if(!meta) return '<div class="seccion"><div class="aviso">'+ico("i-panel",1.9)+
    "<div><b>Todavía no hay una meta de venta</b><span>Con una meta diaria, el panel muestra cuánto falta y a qué hora se suele alcanzar.</span></div>"+
    '<button class="btn chico suave" type="button" data-prueba="1">Poner una meta</button></div></div>';
  var pct=Math.min(100, totalHoy/meta*100), falta=Math.max(0, meta-totalHoy);
  return '<div class="seccion"><div class="metabar'+(pct>=100?" hecha":"")+'">'+
    '<div class="mt"><b>'+(pct>=100? "Meta del día cumplida" : "Meta del día")+"</b><span>"+plata(totalHoy)+" de "+plata(meta)+
    (falta? " · faltan "+plata(falta) : " · "+plata(totalHoy-meta)+" sobre la meta")+"</span></div>"+
    '<div class="mb"><i style="width:'+pct.toFixed(1)+'%"></i></div></div></div>';
}

if(SESION){
  if(POS.cfg.resp.indexOf(SESION.n)<0) POS.cfg.resp.unshift(SESION.n);
  POS.cfg.respActivo=SESION.n;
  if(EAPOS.ROLES[SESION.r] && EAPOS.ROLES[SESION.r].caja==="cobro"){
    SECC=SECC.filter(function(x){ return x.id==="caja"||x.id==="stock"; });
    var _ba=$("#btnAjustes"); if(_ba) _ba.hidden=true;
  }
}

/* ==================== ARRANQUE ==================== */
$("#barFecha").textContent = fechaLarga(hoyISO())+" · Caracoles 151";
$("#buscaProd").oninput=function(){ pintarRejilla(); };
$("#selResp").onchange=function(){ POS.cfg.respActivo=$("#selResp").value; guardarPOS(); };
$("#btnSon").onclick=function(){
  POS.cfg.son = POS.cfg.son?0:1; guardarPOS();
  $("#btnSon").setAttribute("aria-pressed", POS.cfg.son?"true":"false");
  avisar(POS.cfg.son? "Avisos con sonido activados." : "Avisos en silencio: quedan solo en pantalla.");
};
$("#btnSon").setAttribute("aria-pressed", POS.cfg.son?"true":"false");
$("#btnAjustes").onclick=function(){ irA("ajustes"); };
$("#modoVenta").querySelectorAll("[data-modo]").forEach(function(b){
  b.onclick=function(){
    modoActivo=b.dataset.modo;
    $("#modoVenta").querySelectorAll("[data-modo]").forEach(function(x){ x.setAttribute("aria-pressed", x===b?"true":"false"); });
    if(modoActivo!=="local") conPropina=false; else conPropina=true;
    var fuera=carro.filter(function(l){ var it=itemCat(l.id); return it&&it.loc&&modoActivo!=="local"; });
    if(fuera.length){
      carro=carro.filter(function(l){ return fuera.indexOf(l)<0; });
      avisar(fuera.length+(fuera.length===1?" ítem se sirve":" ítems se sirven")+" solo en el local: salieron de la cuenta.","alerta");
    }
    pintarCuenta(); pintarRejilla();
  };
});
$("#swPropina").onclick=function(){ conPropina=!conPropina; pintarCuenta(); };
$("#inEfectivo").oninput=calcVuelto;
$("#btnRegistrar").onclick=registrar;
$("#btnVaciar").onclick=function(){ carro=[]; pintarCuenta(); pintarRejilla(); };
$("#btnCuentaMesa").onclick=cuentaPrevia;
$("#hojaX").onclick=cerrarHoja;
$("#hojaVelo").onclick=cerrarHoja;
document.addEventListener("keydown", function(e){ if(e.key==="Escape" && !$("#hoja").hidden) cerrarHoja(); });

function arrancar(estado){
  if(estado && estado.carro){ carro=estado.carro; modoActivo=estado.modo||"local"; grupoActivo=estado.grupo||"emp"; }
  pintarTodo();
  if(pendientesFolio().length) setTimeout(function(){ avisar(pendientesFolio().length+" ventas quedaron sin folio de boleta.","alerta"); }, 900);
}
try{
  if(window.claude && claude.hot && claude.hot.snapshot) claude.hot.snapshot(function(){ return {carro:carro, modo:modoActivo, grupo:grupoActivo}; });
  if(window.claude && claude.hot && claude.hot.ready) claude.hot.ready(arrancar); else arrancar(window.claude&&claude.hot?claude.hot.data:null);
}catch(e){ arrancar(null); }
</script>
