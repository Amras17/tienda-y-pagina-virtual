<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><script>/* EmporioAndinoPOS: deja que el lanzador escuche errores desde el inicio */try{if(parent!==window&&parent.__eaGancho)parent.__eaGancho(window)}catch(e){}</script></head><body>
<title>Caja · EmporioAndinoPOS</title>
<meta name="description" content="Punto de venta y administración gastronómica de Emporio Andino: cobro, stock, costos, compras, mermas, estadísticas e informes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap">
<link rel="stylesheet" href="../nucleo/emporio.css">
<style>
/* ===== Caja Emporio Andino ==========================================
   Herramienta interna de caja. La carta del cliente vive en la noche del
   desierto (turquesa profundo); la caja es el otro lado del mesón: madera,
   arena y crema, con cactus y dorado para los estados. Misma marca, otro
   registro, porque quien la usa trabaja ocho horas frente a ella.
   Paleta de marca: marrón #8B5A2B · arena #D9CBA3 · madera clara #C19A6B
   cactus #6BBF59 · dorado envejecido #B8860B · tinta #2B2420
   Los tres estados de stock se verificaron para visión con deficiencia de
   color (ΔE deutan 8.3) y siempre llevan texto, nunca solo color.
   ================================================================== */
:root{
  /* Tokens de la Caja con los valores de Emporio System 1.1 (nucleo/emporio.css):
     noche volcánica, vidrio y acento turquesa. Look único y oscuro. */
  color-scheme:dark;
  --crema:#0A1012; --papel:rgba(24,36,40,.56); --papel2:rgba(255,255,255,.045); --papel3:rgba(255,255,255,.085);
  --linea:rgba(255,255,255,.10); --linea-f:rgba(255,255,255,.18);
  --tinta:#F2F7F6; --tinta2:#C9D6D4; --tinta3:#98ABA8;
  --marron:#40E0D0; --marron2:#40E0D0; --madera:rgba(64,224,208,.55); --arena:#D9A93A;
  --bien:#3DDC84; --bien-f:rgba(61,220,132,.13);
  --avisa:#FFB547; --avisa-f:rgba(255,181,71,.14);
  --grave:#FF6161; --grave-f:rgba(255,97,97,.13);
  --dato:#1AA89B; --dato-f:rgba(64,224,208,.12); --oro:#D9A93A;
  --sobre-accion:#04211E;
  --sombra:inset 0 1px 0 rgba(255,255,255,.085), 0 12px 32px rgba(0,0,0,.32);
  --sombra-alta:inset 0 1px 0 rgba(255,255,255,.085), 0 18px 44px rgba(0,0,0,.45);
  --r:20px; --r-s:14px;
  --sans:"Plus Jakarta Sans",ui-sans-serif,"Segoe UI",system-ui,sans-serif;
  --mono:"Sora",ui-rounded,"Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0; background:var(--crema); color:var(--tinta); font-family:var(--sans);
  font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent}
h1,h2,h3{margin:0; font-weight:600; letter-spacing:-.015em; text-wrap:balance}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--marron2); outline-offset:2px}
.num{font-family:var(--mono); font-variant-numeric:tabular-nums; font-feature-settings:"tnum"}

/* ---------- armazón ----------
   Vertical: barra de pestañas abajo, al alcance del pulgar.
   Horizontal: riel de iconos a la izquierda y la cuenta fija a la derecha,
   que es como se usa una caja apoyada en el mesón. */
.app{display:grid; grid-template-rows:auto 1fr auto; grid-template-columns:minmax(0,1fr);
  height:100%; min-height:0; min-width:0; overflow-x:clip}
.barra{position:sticky; top:env(safe-area-inset-top,0px); z-index:20; min-width:0;
  display:flex; align-items:center; gap:10px; padding:10px 16px;
  background:color-mix(in srgb,var(--crema) 88%,transparent);
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--linea)}
.barra .marca{display:flex; align-items:center; gap:9px; min-width:0}
.barra .sig{width:30px; height:30px; border-radius:8px; flex:none; display:grid; place-items:center;
  background:var(--marron); color:var(--sobre-accion)}
.barra .sig svg{width:18px; height:18px}
.barra .tit{flex:1 1 auto; min-width:0; overflow:hidden}
.barra .tit b{display:block; font-size:14.5px; font-weight:600; letter-spacing:-.01em;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.barra .tit span{display:block; font-size:10.5px; color:var(--tinta2); letter-spacing:.04em}
.barra .der{margin-left:auto; display:flex; align-items:center; gap:7px; flex:none}
.turno{display:flex; align-items:center; gap:6px; border:1px solid var(--linea); min-width:0;
  background:var(--papel); border-radius:999px; padding:5px 6px 5px 10px; max-width:46vw}
.turno label{font-size:9.5px; font-weight:600; letter-spacing:.11em; text-transform:uppercase; color:var(--tinta3)}
.turno select{border:0; background:transparent; font-size:12.5px; font-weight:600; max-width:22ch; min-width:0;
  -webkit-appearance:none; appearance:none; padding:0 2px}
.icobtn{width:34px; height:34px; border-radius:999px; border:1px solid var(--linea);
  background:var(--papel); color:var(--tinta2); display:grid; place-items:center; padding:0; flex:none;
  position:relative}
.icobtn svg{width:17px; height:17px}
.icobtn[aria-pressed="true"]{background:var(--dato-f); border-color:var(--madera); color:var(--marron)}
.icobtn .punto{position:absolute; top:-2px; right:-2px; min-width:16px; height:16px; border-radius:999px;
  background:var(--grave); color:var(--sobre-accion); font-family:var(--mono); font-size:9.5px;
  font-weight:600; display:grid; place-items:center; padding:0 4px; border:2px solid var(--crema)}
.vista{overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch;
  min-height:0; min-width:0; padding:14px 16px 20px}
.vista[hidden]{display:none!important}
.pestanas{position:sticky; bottom:0; z-index:20; min-width:0; display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:2px; background:color-mix(in srgb,var(--crema) 92%,transparent);
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--linea); padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.pestanas button{display:grid; justify-items:center; gap:3px; border:0; background:transparent;
  color:var(--tinta3); padding:6px 2px; border-radius:10px; font-size:10px; font-weight:600;
  letter-spacing:.01em; position:relative}
.pestanas button svg{width:21px; height:21px}
.pestanas button[aria-current="true"]{color:var(--marron); background:var(--dato-f)}
.pestanas .sello{position:absolute; top:2px; right:calc(50% - 20px); min-width:15px; height:15px;
  border-radius:999px; background:var(--grave); color:var(--sobre-accion); font-family:var(--mono);
  font-size:9px; font-weight:600; display:grid; place-items:center; padding:0 3px}
.riel{display:none}

/* ---------- piezas ---------- */
.tarjeta{background:var(--papel); border:1px solid var(--linea); border-radius:var(--r);
  box-shadow:var(--sombra)}
.seccion{display:grid; gap:12px; margin-bottom:18px}
.seccion:last-child{margin-bottom:0}
.rotulo{font-size:10px; font-weight:600; letter-spacing:.14em; text-transform:uppercase;
  color:var(--tinta3); display:flex; align-items:center; gap:9px}
.rotulo::after{content:""; flex:1; height:1px; background:var(--linea)}
.rotulo b{font-weight:600; color:var(--marron)}
h2.vt{font-size:19px; letter-spacing:-.02em}
p.vs{margin:0; font-size:12.5px; color:var(--tinta2); line-height:1.5; max-width:62ch}
.fila{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.crece{flex:1; min-width:0}

.btn{border:0; border-radius:11px; padding:13px 16px; font-size:14.5px; font-weight:600;
  background:var(--marron); color:var(--sobre-accion); box-shadow:var(--sombra);
  letter-spacing:-.01em; display:inline-flex; align-items:center; justify-content:center; gap:8px}
.btn svg{width:17px; height:17px}
.btn:disabled{opacity:.42; box-shadow:none}
.btn.lleno{width:100%}
.btn.suave{background:var(--papel); color:var(--tinta); border:1.5px solid var(--linea); box-shadow:none}
.btn.suave:hover{border-color:var(--madera)}
.btn.grave{background:var(--grave); color:var(--sobre-accion)}
.btn.chico{padding:9px 12px; font-size:13px; border-radius:9px}
.pilas{display:flex; gap:6px; flex-wrap:wrap}
.pila{border:1.5px solid var(--linea); background:var(--papel); color:var(--tinta2);
  border-radius:999px; padding:7px 13px; font-size:12.5px; font-weight:600}
.pila[aria-pressed="true"]{background:var(--dato-f); border-color:var(--marron2); color:var(--marron)}
.campo{display:grid; gap:5px}
.campo label{font-size:10px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--tinta3)}
.campo input,.campo select,.campo textarea{border:1.5px solid var(--linea); background:var(--papel);
  border-radius:10px; padding:10px 12px; font-size:14.5px; width:100%}
.campo input.num,.campo input[type="number"]{font-family:var(--mono)}
.buscador{position:relative; flex:1; min-width:180px}
.buscador input{width:100%; border:1.5px solid var(--linea); background:var(--papel);
  border-radius:11px; padding:11px 12px 11px 38px; font-size:14.5px}
.buscador svg{position:absolute; left:12px; top:50%; transform:translateY(-50%);
  width:17px; height:17px; color:var(--tinta3); pointer-events:none}

.estado{display:inline-flex; align-items:center; gap:5px; border-radius:999px; padding:3px 9px 3px 7px;
  font-size:10.5px; font-weight:600; letter-spacing:.02em; border:1px solid transparent}
.estado svg{width:12px; height:12px; flex:none}
.estado.ok{background:var(--bien-f); color:var(--bien); border-color:var(--bien)}
.estado.bajo{background:var(--avisa-f); color:var(--avisa); border-color:var(--avisa)}
.estado.off{background:var(--grave-f); color:var(--grave); border-color:var(--grave)}
.estado.neutro{background:var(--papel2); color:var(--tinta2); border-color:var(--linea)}

/* ---------- caja: rejilla de productos + cuenta ---------- */
.caja{display:grid; grid-template-columns:minmax(0,1fr); gap:14px; min-height:0; min-width:0}
.caja>.izq,.caja>.der{min-width:0}
.grupos{display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; margin:0 -16px; padding-inline:16px;
  scrollbar-width:none}
.grupos::-webkit-scrollbar{display:none}
.grupos button{flex:none}
.rejilla{display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:8px; min-width:0}
.prod{display:grid; gap:6px; align-content:start; text-align:left; border:1px solid var(--linea);
  background:var(--papel); border-radius:var(--r-s); padding:10px 11px; box-shadow:var(--sombra);
  min-height:82px; transition:transform .12s ease, border-color .15s ease}
.prod:active{transform:scale(.975)}
.prod:hover{border-color:var(--madera)}
.prod .pn{font-size:13.5px; font-weight:600; line-height:1.25; letter-spacing:-.01em}
.prod .pp{font-family:var(--mono); font-size:13px; font-weight:600; color:var(--marron);
  font-variant-numeric:tabular-nums}
.prod .pf{display:flex; align-items:center; gap:5px; margin-top:auto; flex-wrap:wrap}
.prod.sinprecio{border-style:dashed; border-color:var(--avisa)}
.prod.sinprecio .pp{color:var(--avisa)}
.prod.agotado{opacity:.55}
.prod .en{position:absolute}
.vacio{text-align:center; color:var(--tinta2); font-size:13.5px; padding:26px 14px;
  border:1px dashed var(--linea); border-radius:var(--r); background:var(--papel2)}

.cuenta{display:grid; gap:0; align-content:start; min-width:0; background:var(--papel);
  border:1px solid var(--linea); border-radius:var(--r); box-shadow:var(--sombra); overflow:hidden}
.cuenta .ch{display:flex; align-items:center; gap:9px; padding:12px 14px;
  background:var(--papel2); border-bottom:1px solid var(--linea)}
.cuenta .ch svg{width:18px; height:18px; color:var(--marron); flex:none}
.cuenta .ch b{font-size:14px; font-weight:600; letter-spacing:-.01em; flex:1}
.cuenta .ch .n{font-family:var(--mono); font-size:12px; color:var(--tinta2)}
.modo{display:grid; grid-template-columns:repeat(3,1fr); gap:5px; padding:11px 14px 0}
.modo button{border:1.5px solid var(--linea); background:var(--papel); color:var(--tinta2);
  border-radius:9px; padding:8px 4px; font-size:11.5px; font-weight:600}
.modo button[aria-pressed="true"]{background:var(--dato-f); border-color:var(--marron2); color:var(--marron)}
.lineas{display:grid; padding:6px 14px; max-height:38vh; overflow:auto}
.lin{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:4px 10px; padding:10px 0; min-width:0;
  border-bottom:1px solid var(--linea)}
.lin:last-child{border-bottom:0}
.lin .ln{font-size:13.5px; font-weight:600; line-height:1.25}
.lin .lo{font-size:11px; color:var(--tinta2); margin-top:2px; line-height:1.35}
.lin .lt{font-family:var(--mono); font-size:13.5px; font-weight:600; text-align:right;
  font-variant-numeric:tabular-nums; align-self:start}
.paso{display:inline-flex; align-items:center; gap:1px; border:1.5px solid var(--linea);
  background:var(--papel2); border-radius:999px; padding:2px; grid-column:1/-1; justify-self:start}
.paso button{width:27px; height:27px; border:0; background:transparent; border-radius:50%;
  font-size:16px; font-weight:600; line-height:1; color:var(--tinta); padding:0}
.paso .q{min-width:26px; text-align:center; font-family:var(--mono); font-size:13.5px; font-weight:600}
.sumas{display:grid; gap:7px; padding:12px 14px; border-top:1px solid var(--linea);
  background:var(--papel2)}
.sm{display:flex; align-items:baseline; gap:10px; font-size:12.5px; color:var(--tinta2)}
.sm span{flex:1; min-width:0}
.sm b{font-family:var(--mono); font-weight:600; font-variant-numeric:tabular-nums; color:var(--tinta)}
.sm.legal{font-size:11px; color:var(--tinta3)}
.sm.total{font-size:16px; color:var(--tinta); align-items:center; padding-top:8px;
  border-top:1px dashed var(--linea)}
.sm.total b{font-size:21px; letter-spacing:-.02em; color:var(--marron)}
.propina{display:flex; align-items:center; gap:9px; padding:10px 14px; border-top:1px solid var(--linea);
  background:var(--papel); font-size:12px; color:var(--tinta2); line-height:1.4}
.propina .sw{flex:none}
.sw{width:42px; height:24px; border-radius:999px; border:1.5px solid var(--linea);
  background:var(--papel2); position:relative; padding:0; flex:none}
.sw i{position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%;
  background:var(--tinta3); transition:transform .16s ease, background .16s ease}
.sw[aria-pressed="true"]{background:var(--bien-f); border-color:var(--bien)}
.sw[aria-pressed="true"] i{transform:translateX(18px); background:var(--bien)}
.pagos{display:grid; grid-template-columns:repeat(2,1fr); gap:6px; padding:12px 14px 0}
.pagos button{display:flex; align-items:center; gap:7px; border:1.5px solid var(--linea);
  background:var(--papel); color:var(--tinta2); border-radius:10px; padding:10px 11px;
  font-size:12.5px; font-weight:600; text-align:left}
.pagos button svg{width:16px; height:16px; flex:none}
.pagos button[aria-pressed="true"]{background:var(--dato-f); border-color:var(--marron2); color:var(--marron)}
.cierre{display:grid; gap:9px; padding:12px 14px calc(14px + env(safe-area-inset-bottom,0px))}
.efectivo{display:grid; grid-template-columns:1fr 1fr; gap:9px; align-items:end}
.vuelto{background:var(--bien-f); border:1px solid var(--bien); border-radius:10px; padding:9px 11px}
.vuelto .k{font-size:9.5px; font-weight:600; letter-spacing:.11em; text-transform:uppercase; color:var(--bien)}
.vuelto .v{font-family:var(--mono); font-size:19px; font-weight:600; color:var(--bien);
  font-variant-numeric:tabular-nums; line-height:1.2}
</style>

<style>
/* ---------- panel: primero el resumen, después el detalle ---------- */
.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(142px,1fr)); gap:8px; min-width:0}
.kpi{background:var(--papel); border:1px solid var(--linea); border-radius:var(--r);
  padding:12px 13px; display:grid; gap:3px; box-shadow:var(--sombra)}
.kpi .k{font-size:9.5px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--tinta3)}
.kpi .v{font-family:var(--mono); font-size:24px; font-weight:600; letter-spacing:-.02em;
  line-height:1.15; font-variant-numeric:tabular-nums}
.kpi .p{font-size:11px; color:var(--tinta2); line-height:1.35}
.kpi.principal{background:var(--marron); border-color:var(--marron); color:var(--sobre-accion)}
.kpi.principal .k{color:rgba(255,249,239,.72)}
.kpi.principal .v{font-size:30px}
.kpi.principal .p{color:rgba(255,249,239,.82)}
.kpi.ojo{border-left:3px solid var(--avisa)}
.kpi.ojo .v{color:var(--avisa)}
.kpi.mal{border-left:3px solid var(--grave)}
.kpi.mal .v{color:var(--grave)}

.aviso{display:grid; grid-template-columns:auto 1fr auto; gap:11px; align-items:center;
  border:1px solid var(--linea); border-radius:var(--r); padding:12px 13px; background:var(--papel)}
.aviso.alerta{border-color:var(--grave); background:var(--grave-f)}
.aviso.ojo{border-color:var(--avisa); background:var(--avisa-f)}
.aviso > svg{width:20px; height:20px; flex:none}
.aviso.alerta > svg{color:var(--grave)} .aviso.ojo > svg{color:var(--avisa)}
.aviso b{display:block; font-size:13px; font-weight:600}
.aviso span{display:block; font-size:11.5px; color:var(--tinta2); line-height:1.4; margin-top:2px}

/* ---------- gráficos: dibujados a la escala, con eje y etiquetas ---------- */
.graf{background:var(--papel); border:1px solid var(--linea); border-radius:var(--r);
  padding:13px 14px 11px; box-shadow:var(--sombra); display:grid; gap:10px}
.graf .gt{display:flex; align-items:baseline; gap:9px}
.graf .gt b{font-size:13.5px; font-weight:600; letter-spacing:-.01em}
.graf .gt em{font-style:normal; font-size:11px; color:var(--tinta2); margin-left:auto;
  font-family:var(--mono)}
.graf svg{width:100%; height:auto; display:block; overflow:visible}
.barras{display:grid; gap:7px}
.br{display:grid; grid-template-columns:minmax(0,30%) minmax(0,1fr) auto; gap:9px; align-items:center;
  font-size:12.5px}
.br .bn{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--tinta)}
.br .bt{height:11px; background:var(--papel3); border-radius:3px; overflow:hidden; position:relative}
.br .bt i{display:block; height:100%; background:var(--dato); border-radius:0 4px 4px 0; min-width:2px}
.br .bv{font-family:var(--mono); font-size:12px; font-weight:600; color:var(--tinta2);
  font-variant-numeric:tabular-nums; white-space:nowrap}

/* ---------- tablas ---------- */
.tabox{overflow-x:auto; border:1px solid var(--linea); border-radius:var(--r); background:var(--papel);
  box-shadow:var(--sombra)}
table{border-collapse:collapse; width:100%; min-width:min(100%,520px); font-size:13px}
thead th{text-align:left; font-size:9.5px; font-weight:600; letter-spacing:.11em; text-transform:uppercase;
  color:var(--tinta3); padding:10px 12px; border-bottom:1px solid var(--linea);
  background:var(--papel2); white-space:nowrap; position:sticky; top:0}
tbody td{padding:9px 12px; border-bottom:1px solid var(--linea); vertical-align:top}
tbody tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right; font-family:var(--mono); font-variant-numeric:tabular-nums; white-space:nowrap}
tfoot td{padding:10px 12px; font-weight:600; background:var(--papel2); border-top:1px solid var(--linea-f)}
.mini{font-size:11px; color:var(--tinta2); line-height:1.4}

/* ---------- historial ---------- */
.filtros{display:grid; grid-template-columns:repeat(auto-fit,minmax(138px,1fr)); gap:8px;
  background:var(--papel); border:1px solid var(--linea); border-radius:var(--r); padding:12px;
  box-shadow:var(--sombra)}
.venta{border:1px solid var(--linea); border-radius:var(--r); background:var(--papel);
  box-shadow:var(--sombra); overflow:hidden}
.venta + .venta{margin-top:8px}
.venta > summary{display:grid; grid-template-columns:auto 1fr auto; gap:10px; align-items:center;
  padding:11px 13px; cursor:pointer; list-style:none}
.venta > summary::-webkit-details-marker{display:none}
.venta .hora{font-family:var(--mono); font-size:12px; color:var(--tinta2)}
.venta .qn{font-size:13px; font-weight:600; line-height:1.25}
.venta .qs{font-size:11px; color:var(--tinta2); margin-top:2px}
.venta .imp{font-family:var(--mono); font-size:14.5px; font-weight:600; text-align:right}
.venta .cuerpo{padding:0 13px 13px; display:grid; gap:10px; border-top:1px solid var(--linea)}
.venta.anulada{opacity:.68}
.venta.anulada .imp{text-decoration:line-through}
.dl{display:grid; grid-template-columns:auto 1fr; gap:4px 12px; font-size:12px}
.dl dt{color:var(--tinta3); font-size:10px; font-weight:600; letter-spacing:.1em; text-transform:uppercase;
  padding-top:2px}
.dl dd{margin:0; font-family:var(--mono); font-size:12.5px}

/* ---------- hoja modal ---------- */
.hoja{position:fixed; inset:0; z-index:60; display:grid; align-items:end; justify-items:stretch}
.hoja[hidden]{display:none!important}
.hoja .velo{position:absolute; inset:0; border:0; padding:0; background:rgba(43,36,32,.52);
  backdrop-filter:blur(2px)}
.hoja .panel{position:relative; background:var(--crema); border-radius:20px 20px 0 0;
  border-top:1px solid var(--linea); max-height:90%; display:flex; flex-direction:column;
  box-shadow:0 -18px 46px -20px rgba(43,36,32,.55)}
.hoja .ph{display:flex; align-items:center; gap:10px; padding:15px 16px 11px;
  border-bottom:1px solid var(--linea); background:var(--papel2); border-radius:20px 20px 0 0}
.hoja .ph b{flex:1; font-size:16px; font-weight:600; letter-spacing:-.015em}
.hoja .pb{padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px)); overflow:auto; display:grid; gap:13px}
/* La hoja crece con la ficha técnica: sin min-height:0 el cuerpo no se desplaza dentro del panel. */
.hoja .pb{min-height:0}
.campo textarea{font-size:14px; line-height:1.45; resize:vertical}
.hoja .cerrar{width:32px; height:32px; border-radius:50%; border:1px solid var(--linea);
  background:var(--papel); display:grid; place-items:center; padding:0; flex:none}
.hoja .cerrar svg{width:15px; height:15px}
body.conhoja{overflow:hidden}

/* ---------- vale: se ve en pantalla como saldrá impreso ---------- */
.vale{background:#FFFFFF; color:#1C1512; border:1px solid var(--linea); border-radius:8px;
  padding:16px 15px; font-family:var(--mono); font-size:11.5px; line-height:1.55;
  max-width:340px; margin:0 auto; width:100%; box-shadow:var(--sombra)}
.vale h4{margin:0 0 2px; font-family:var(--sans); font-size:14px; font-weight:700; letter-spacing:.02em;
  text-align:center}
.vale .sub{text-align:center; font-size:10px; line-height:1.5}
.vale .sep{border-top:1px dashed #A99A86; margin:9px 0}
.vale .l{display:flex; gap:8px}
.vale .l span{flex:1; min-width:0}
.vale .l b{font-weight:600; white-space:nowrap}
.vale .tot{font-size:14px; font-weight:700}
.vale .nota{font-family:var(--sans); font-size:9.5px; line-height:1.5; text-align:center;
  border:1px solid #1C1512; border-radius:5px; padding:6px 7px; margin-top:9px; font-weight:600}
.vale .pie{text-align:center; font-size:9.5px; margin-top:8px; line-height:1.5}

/* ---------- toast ---------- */
.toast{position:fixed; left:50%; bottom:calc(84px + env(safe-area-inset-bottom,0px)); z-index:70;
  transform:translate(-50%,14px); max-width:min(92vw,420px); opacity:0; pointer-events:none;
  background:var(--tinta); color:var(--crema); border-radius:12px; padding:11px 15px;
  font-size:12.5px; font-weight:600; line-height:1.4; text-align:center;
  box-shadow:0 14px 34px -14px rgba(0,0,0,.5);
  transition:opacity .18s ease, transform .22s cubic-bezier(.2,.75,.3,1)}
.toast.ver{opacity:1; transform:translate(-50%,0)}
.toast.bien{background:var(--bien); color:#FFF}
.toast.mal{background:var(--grave); color:#FFF}

/* ---------- marco legal ---------- */
.normativa{background:var(--papel); border:1px solid var(--linea); border-left:3px solid var(--oro);
  border-radius:var(--r); padding:13px 14px; display:grid; gap:8px}
.normativa b{font-size:13px; font-weight:600}
.normativa ul{margin:0; padding-left:18px; display:grid; gap:6px; font-size:12px; color:var(--tinta2);
  line-height:1.5}
.normativa code{font-family:var(--mono); font-size:11.5px; background:var(--papel2); padding:1px 5px;
  border-radius:4px; color:var(--marron)}

/* ---------- horizontal: riel a la izquierda, cuenta fija a la derecha ---------- */
@media (min-width:760px){
  .rejilla{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
  .kpis{grid-template-columns:repeat(auto-fit,minmax(168px,1fr))}
}
@media (orientation:landscape) and (min-width:820px){
  .app{grid-template-rows:auto 1fr; grid-template-columns:78px minmax(0,1fr); height:100%}
  .barra{grid-column:1/-1}
  .pestanas{display:none}
  .riel{display:grid; align-content:start; gap:4px; padding:12px 8px; border-right:1px solid var(--linea);
    background:color-mix(in srgb,var(--papel2) 70%,transparent); overflow:auto}
  .riel button{display:grid; justify-items:center; gap:4px; border:0; background:transparent;
    color:var(--tinta3); padding:9px 2px; border-radius:11px; font-size:9.5px; font-weight:600;
    position:relative; letter-spacing:.02em}
  .riel button svg{width:22px; height:22px}
  .riel button[aria-current="true"]{color:var(--marron); background:var(--dato-f)}
  .riel .sello{position:absolute; top:4px; right:8px; min-width:15px; height:15px; border-radius:999px;
    background:var(--grave); color:var(--sobre-accion); font-family:var(--mono); font-size:9px;
    font-weight:600; display:grid; place-items:center; padding:0 3px}
  .vista{padding:16px 20px 22px}
  .caja{grid-template-columns:minmax(0,1fr) minmax(300px,348px); align-items:start; height:100%}
  .caja .izq{display:grid; gap:12px; align-content:start; min-height:0; min-width:0}
  .cuenta{position:sticky; top:0; max-height:calc(100dvh - 118px); overflow:auto}
  .lineas{max-height:none}
  .dos{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:12px; align-items:start}
  .tres{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; align-items:start}
  .hoja{place-items:center}
  .hoja .panel{max-width:560px; width:92%; border-radius:18px; max-height:86%}
  .hoja .ph{border-radius:18px 18px 0 0}
  .toast{bottom:24px}
}
@media (orientation:landscape) and (min-width:1180px){
  .caja{grid-template-columns:minmax(0,1fr) minmax(330px,382px)}
  .rejilla{grid-template-columns:repeat(auto-fill,minmax(172px,1fr))}
  .vista{padding:18px 26px 26px}
  .vista > .ancho{max-width:1320px; margin:0 auto}
}
/* Teléfono acostado: poco alto, así que todo se aprieta y nada se corta. */
@media (orientation:landscape) and (max-height:520px){
  .barra{padding:7px 14px}
  .barra .tit span{display:none}
  .vista{padding:11px 14px 16px}
  .seccion{gap:9px; margin-bottom:13px}
  .prod{min-height:70px; padding:8px 10px}
  .kpi .v{font-size:20px} .kpi.principal .v{font-size:24px}
  .lineas{max-height:30vh}
  .pestanas button{font-size:9px} .pestanas button svg{width:18px; height:18px}
  .cuenta{max-height:calc(100dvh - 92px)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}

/* ---------- impresión: sale solo el vale ---------- */
@media print{
  .barra,.pestanas,.riel,.toast,.hoja .velo,.hoja .ph,.noimp{display:none!important}
  body,.app,.vista{background:#FFF; color:#000; height:auto; overflow:visible; display:block}
  .hoja{position:static; display:block}
  .hoja .panel{box-shadow:none; border:0; max-height:none; background:#FFF}
  .hoja .pb{padding:0; display:block}
  .vale{border:0; box-shadow:none; max-width:72mm; padding:0; font-size:10.5px}

}

<script>
/* ====================================================================
   Caja Emporio Andino · lógica
   --------------------------------------------------------------------
   Qué hace esta herramienta y qué no, para que nadie se confunde:
   REGISTRA la venta (productos, cantidades, precios, medio de pago),
   descuenta stock, guarda el historial y arma los reportes. El vale que
   imprime es un documento INTERNO de control: no es boleta.
   La boleta electrónica (DTE 39 afecta / 41 exenta) la emite el sistema
   autorizado por el SII —el portal gratuito del SII o un proveedor
   autorizado— y su folio se anota aquí para dejar la venta cuadrada.
   Los precios de la carta ya incluyen IVA (Ley 19.496 art. 30), así que
   el neto y el IVA 19% se calculan hacia atrás desde el total.
   ==================================================================== */
/* El catálogo ya no se copia aquí: sale de la carta única (nucleo/datos.js)
   con los precios y la carta vigentes del sistema general. */
var CAT = EAPOS.catalogo(EAPOS.general());

var GRUPOS=[
  {id:"emp", n:"Empanadas", ico:"i-grano"},
  {id:"bar", n:"Barra",     ico:"i-taza"},
  {id:"coc", n:"Cocina",    ico:"i-mesa"},
  {id:"past",n:"Pastelería",ico:"i-ticket"}
];
var SUBN={Empanadas:"Empanadas", desayunos:"Desayunos", brunch:"Brunch", bruschettas:"Bruschettas",
  tostadas:"Tostadas", ensaladas:"Ensaladas", cafe:"Café de máquina", metodo:"Filtrados y tónicas",
  te:"Tés e infusiones", choc:"Chocolates", jugo:"Jugos y refrescos", tarta:"Tartas",
  treslech:"Tres leches", galleton:"Galletones", paquete:"Paquetes", galleta:"Galletas",
  kuchen:"Kuchen", cheese:"Cheesecakes", muffin:"Muffins", milhojas:"Milhojas", torta:"Tortas",
  minitorta:"Mini tortas", panqueque:"Panqueques"};
var PAGOS=[
  {id:"efectivo",   n:"Efectivo",     ico:"i-billete"},
  {id:"debito",     n:"Débito",       ico:"i-tarjeta"},
  {id:"credito",    n:"Crédito",      ico:"i-tarjeta"},
  {id:"transfer",   n:"Transferencia",ico:"i-transfer"},
  {id:"desertgo",   n:"DesertGo",     ico:"i-moto"}
];
var MODOS={local:"Para el local", llevar:"Para llevar", delivery:"DesertGo"};
var EXTRAS=[{id:"sirope", n:"Sirope"},{id:"vegetal", n:"Leche vegetal"}];
var LATA=15;          /* cada lata de empanadas trae 15 unidades */
var IVA_TASA=0.19;    /* DL 825, art. 14 */
var PROPINA_MIN=10;   /* Art. 64 Código del Trabajo (Ley 20.729) */

/* ---------- utilidades ---------- */
function $(s,r){ return (r||document).querySelector(s); }
function el(t,c,x){ var n=document.createElement(t); if(c) n.className=c; if(x!=null) n.textContent=x; return n; }
function ico(id,sw){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+(sw||1.8)+'" stroke-linecap="round" stroke-linejoin="round"><use href="#'+id+'"/></svg>'; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function plata(n){ return "$"+Math.round(n||0).toLocaleString("es-CL"); }
function neto(total){ return Math.round(total/(1+IVA_TASA)); }
function ivaDe(total){ return Math.round(total)-neto(total); }
function hoyISO(d){ d=d||new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function diaDe(ts){ return hoyISO(new Date(ts)); }
function hora(ts){ var d=new Date(ts); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
function fechaLarga(iso){
  var p=iso.split("-"), m=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
  return Number(p[2])+" de "+m[Number(p[1])-1]+" de "+p[0];
}
function sumaBy(a,f){ var t=0; for(var i=0;i<a.length;i++) t+=f(a[i])||0; return t; }

/* ---------- estado guardado ----------
   ea_pos  : ventas, precios que faltaban, ajustes y arqueos. No se borra
             sola: el historial es lo que después se exporta al contador.
   ea_control : el mismo estado de disponibilidad que leen la carta del
             cliente y el Control de Salón. Aquí se le agregan unidades. */
var POS={v:1, ventas:[], precios:{}, arqueos:[], cfg:{}};
try{ var rp=localStorage.getItem("ea_pos"); if(rp){ var op=JSON.parse(rp); if(op&&typeof op==="object") POS=Object.assign(POS,op); } }catch(e){}
POS.cfg=Object.assign({
  propina:PROPINA_MIN, son:1, umbral:6, resp:["Jefe de operación","Encargado de caja","Barista"],
  respActivo:"", emisor:{razon:"", rut:"", giro:"Empanadería y cafetería", dir:"Caracoles 151, San Pedro de Atacama"},
  emisorDTE:"Portal gratuito del SII", extras:{sirope:null, vegetal:null}
}, POS.cfg||{});
if(!Array.isArray(POS.ventas)) POS.ventas=[];
if(!Array.isArray(POS.arqueos)) POS.arqueos=[];
if(!POS.precios||typeof POS.precios!=="object") POS.precios={};
if(!POS.costos||typeof POS.costos!=="object") POS.costos={};
if(!POS.fichas||typeof POS.fichas!=="object") POS.fichas={};
if(!Array.isArray(POS.compras)) POS.compras=[];
if(!Array.isArray(POS.mermas)) POS.mermas=[];
/* Las metas son del sistema general: se cambian en la Prueba y se aplican. */
POS.cfg.metas=EAPOS.general().metas;
if(!Array.isArray(POS.cfg.provee)) POS.cfg.provee=[];

var CTRL={fecha:"", st:{}, uni:{}, milks:{}, decaf:1, tocado:"", son:1};
function leerCtrl(){
  try{ var r=localStorage.getItem("ea_control"); if(r){ var o=JSON.parse(r); if(o&&typeof o==="object") CTRL=Object.assign(CTRL,o); } }catch(e){}
  if(!CTRL.uni||typeof CTRL.uni!=="object") CTRL.uni={};
  if(!CTRL.st||typeof CTRL.st!=="object") CTRL.st={};
}
leerCtrl();

var canal=null;
try{ canal=new BroadcastChannel("emporio-andino"); }catch(e){}
function guardarPOS(){
  try{ localStorage.setItem("ea_pos", JSON.stringify(POS)); }catch(e){ avisar("No se pudo guardar en este equipo. Exporta el día antes de cerrar.","mal"); }
  if(canal) try{ canal.postMessage({t:"pos"}); }catch(e){}
}
function guardarCtrl(){
  CTRL.tocado=new Date().toISOString();
  try{ localStorage.setItem("ea_control", JSON.stringify(CTRL)); }catch(e){}
  if(canal) try{ canal.postMessage({t:"ctrl"}); }catch(e){}
}
/* La caja, la carta y el Control de Salón conversan en vivo dentro del
   mismo equipo: si se vende la última empanada en una pestaña, la otra lo
   sabe al instante. Entre equipos distintos no hay puente: para eso está
   la exportación del día (y, más adelante, un servidor). */
function alCambiarAfuera(){ leerCtrl(); try{ var r=localStorage.getItem("ea_pos"); if(r) POS=Object.assign(POS,JSON.parse(r)); }catch(e){}
  CAT=EAPOS.catalogo(EAPOS.general()); POS.cfg.metas=EAPOS.general().metas; pintarTodo(); }
window.addEventListener("storage", function(ev){ if(ev.key==="ea_control"||ev.key==="ea_pos"||ev.key==="eapos_cfg") alCambiarAfuera(); });
if(canal) canal.onmessage=function(){ alCambiarAfuera(); };

/* ---------- precio y stock ---------- */
function precioDe(p){ return p.p!=null ? p.p : null; }
/* Abre la Prueba: dentro del sistema general lo resuelve la capa superior (que revisa el cargo);
   abierta sola, navega a la página. */
function abrirPrueba(){ EAPOS.irA("prueba"); }
function unidades(id){ var u=CTRL.uni[id]; return typeof u==="number"? u : null; }
function estadoDe(id){
  var u=unidades(id);
  if(u!=null) return u<=0 ? "off" : (u<=POS.cfg.umbral ? "bajo" : "ok");
  return CTRL.st[id]||"ok";
}
function fijarEstadoDesdeUnidades(id){
  var u=unidades(id); if(u==null) return;
  CTRL.st[id] = u<=0 ? "off" : (u<=POS.cfg.umbral ? "bajo" : "ok");
}
function descontar(id,q){
  var u=unidades(id); if(u==null) return;
  CTRL.uni[id]=Math.max(0,u-q); fijarEstadoDesdeUnidades(id);
}
function devolver(id,q){
  var u=unidades(id); if(u==null) return;
  CTRL.uni[id]=u+q; fijarEstadoDesdeUnidades(id);
}
function criticos(){
  var out=[];
  CAT.forEach(function(p){ var e=estadoDe(p.id); if(e==="off"||e==="bajo") out.push({p:p, e:e, u:unidades(p.id)}); });
  return out.sort(function(a,b){ return (a.e==="off"?0:1)-(b.e==="off"?0:1); });
}
function sinPrecio(){ return CAT.filter(function(p){ return precioDe(p)==null; }); }
function pendientesFolio(){ return POS.ventas.filter(function(v){ return !v.anulada && (!v.doc||!v.doc.folio); }); }

/* ---------- avisos: se ven y se oyen ---------- */
var AC=null;
function pito(clase){
  if(!POS.cfg.son) return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==="suspended") AC.resume();
    var notas = clase==="mal" ? [[392,0,.16],[311,.18,.26]] : clase==="alerta" ? [[740,0,.1],[740,.16,.1],[740,.32,.14]] : [[659,0,.1],[880,.11,.18]];
    notas.forEach(function(n){
      var o=AC.createOscillator(), g=AC.createGain(), t=AC.currentTime+n[1];
      o.type="sine"; o.frequency.value=n[0];
      g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.16,t+.02);
      g.gain.exponentialRampToValueAtTime(.0001,t+n[2]);
      o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+n[2]+.04);
    });
  }catch(e){}
}
var tToast=null;
function avisar(txt,clase){
  var t=$("#toast"); t.textContent=txt;
  t.className="toast ver"+(clase?" "+clase:"");
  pito(clase);
  clearTimeout(tToast); tToast=setTimeout(function(){ t.className="toast"+(clase?" "+clase:""); }, 3200);
}
</script>

<script>
/* ==================== CAJA ==================== */
var carro=[];              /* [{id,n,p,q,mod:[]}] */
var grupoActivo="emp";
var modoActivo="local";
var pagoActivo="";
var conPropina=true;

function itemCat(id){ for(var i=0;i<CAT.length;i++) if(CAT[i].id===id) return CAT[i]; return null; }
function totalCarro(){ return sumaBy(carro,function(l){ return l.p*l.q + sumaBy(l.mod,function(m){ return m.p||0; })*l.q; }); }
function propinaSug(){ return conPropina ? Math.round(totalCarro()*POS.cfg.propina/100) : 0; }

function pintarGrupos(){
  var c=$("#grupos"); c.innerHTML="";
  GRUPOS.forEach(function(g){
    var n=CAT.filter(function(p){ return p.g===g.id; }).length;
    var b=el("button","pila"); b.type="button"; b.setAttribute("role","tab");
    b.setAttribute("aria-pressed", g.id===grupoActivo ? "true":"false");
    b.innerHTML=ico(g.ico)+" "+esc(g.n)+' <span class="num" style="opacity:.6">'+n+"</span>";
    b.style.display="inline-flex"; b.style.alignItems="center"; b.style.gap="6px";
    b.querySelector("svg").style.width="15px"; b.querySelector("svg").style.height="15px";
    b.onclick=function(){ grupoActivo=g.id; pintarGrupos(); pintarRejilla(); };
    c.appendChild(b);
  });
}
function pintarRejilla(){
  var q=($("#buscaProd").value||"").trim().toLowerCase();
  var lista=CAT.filter(function(p){
    if(q) return p.n.toLowerCase().indexOf(q)>=0;
    return p.g===grupoActivo;
  });
  var cont=$("#rejilla"); cont.innerHTML="";
  if(!lista.length){ cont.appendChild(el("div","vacio","Sin resultados para «"+q+"».")); return; }
  var sub="";
  lista.forEach(function(p){
    if(!q && p.sub!==sub){
      sub=p.sub;
      var r=el("div","rotulo"); r.style.gridColumn="1/-1";
      r.innerHTML="<b>"+esc(SUBN[sub]||sub)+"</b>";
      cont.appendChild(r);
    }
    var pr=precioDe(p), es=estadoDe(p.id), u=unidades(p.id);
    var b=el("button","prod"+(pr==null?" sinprecio":"")+(es==="off"?" agotado":"")); b.type="button";
    var pie="";
    if(es==="off") pie+='<span class="estado off">'+ico("i-x",2.4)+"Agotado</span>";
    else if(es==="bajo") pie+='<span class="estado bajo">'+ico("i-alerta",2)+(u!=null? "Quedan "+u : "Quedan pocas")+"</span>";
    else if(u!=null) pie+='<span class="estado ok">'+ico("i-check",2.4)+u+" u.</span>";
    if(p.loc) pie+='<span class="estado neutro">Solo local</span>';
    b.innerHTML='<span class="pn">'+esc(p.n)+'</span><span class="pp">'+(pr==null?"Precio por definir":plata(pr))+
      '</span><span class="pf">'+pie+"</span>";
    b.onclick=function(){ agregar(p); };
    cont.appendChild(b);
  });
}
function agregar(p){
  var pr=precioDe(p);
  if(pr==null){ avisar("«"+p.n+"» todavía no tiene precio. Se define en la Prueba y se aplica al sistema general.","mal"); return; }
  if(estadoDe(p.id)==="off"){ avisar("«"+p.n+"» está marcado como agotado. Repón o corrige el stock antes de venderlo.","mal"); return; }
  if(p.loc && modoActivo!=="local"){ avisar("«"+p.n+"» se sirve solo para comer en el local.","mal"); return; }
  var ex=null;
  for(var i=0;i<carro.length;i++) if(carro[i].id===p.id && !carro[i].mod.length) ex=carro[i];
  if(ex) ex.q++; else carro.push({id:p.id, n:p.n, p:pr, q:1, mod:[], leche:!!p.leche});
  pintarCuenta(); pintarRejilla();
}
function pintarCuenta(){
  var L=$("#lineas"); L.innerHTML="";
  var items=sumaBy(carro,function(l){ return l.q; });
  $("#cuentaN").textContent = items===1 ? "1 ítem" : items+" ítems";
  if(!carro.length){
    L.appendChild(el("div","vacio","Toca un producto para empezar la cuenta."));
  } else carro.forEach(function(l,idx){
    var d=el("div","lin");
    var izq=el("div");
    izq.innerHTML='<div class="ln">'+esc(l.n)+"</div>"+
      (l.mod.length?'<div class="lo">'+l.mod.map(function(m){ return esc(m.n)+(m.p?" +"+plata(m.p):""); }).join(" · ")+"</div>":"")+
      (l.leche?'<div class="lo"><button class="pila" type="button" data-ex="'+idx+'" style="padding:3px 9px;font-size:11px">Extras</button></div>':"");
    var der=el("div","lt", plata(l.p*l.q + sumaBy(l.mod,function(m){return m.p||0;})*l.q));
    var paso=el("div","paso");
    paso.innerHTML='<button type="button" data-m="'+idx+'" aria-label="Quitar uno">−</button><span class="q">'+l.q+
      '</span><button type="button" data-p="'+idx+'" aria-label="Agregar uno">+</button>';
    d.appendChild(izq); d.appendChild(der); d.appendChild(paso);
    L.appendChild(d);
  });
  L.querySelectorAll("[data-m]").forEach(function(b){ b.onclick=function(){ var i=+b.dataset.m; carro[i].q--; if(carro[i].q<=0) carro.splice(i,1); pintarCuenta(); }; });
  L.querySelectorAll("[data-p]").forEach(function(b){ b.onclick=function(){ carro[+b.dataset.p].q++; pintarCuenta(); }; });
  L.querySelectorAll("[data-ex]").forEach(function(b){ b.onclick=function(){ hojaExtras(+b.dataset.ex); }; });

  var t=totalCarro(), pr=propinaSug();
  var S=$("#sumas"); S.innerHTML="";
  function sm(k,v,cl){ var d=el("div","sm"+(cl?" "+cl:"")); d.innerHTML="<span>"+k+'</span><b class="num">'+v+"</b>"; S.appendChild(d); }
  sm("Neto", plata(neto(t)), "legal");
  sm("IVA 19%", plata(ivaDe(t)), "legal");
  sm("Consumo (IVA incluido)", plata(t));
  if(pr) sm("Propina sugerida "+POS.cfg.propina+"%", plata(pr));
  sm("Total a pagar", plata(t+pr), "total");
  $("#txtPropina").textContent = conPropina
    ? "Propina sugerida "+POS.cfg.propina+"% · el cliente puede rechazarla (Art. 64 del Código del Trabajo)"
    : "Propina sin sugerir en esta cuenta";
  $("#swPropina").setAttribute("aria-pressed", conPropina?"true":"false");
  $("#cajaPropina").hidden = (modoActivo!=="local");

  var listo = carro.length>0 && pagoActivo;
  $("#btnRegistrar").disabled=!listo;
  $("#btnVaciar").disabled=!carro.length;
  $("#btnCuentaMesa").disabled=!carro.length;
  $("#bloqueEfectivo").hidden = pagoActivo!=="efectivo";
  calcVuelto();
}
function calcVuelto(){
  var t=totalCarro()+propinaSug(), rec=Number($("#inEfectivo").value||0);
  $("#txtVuelto").textContent = plata(Math.max(0,rec-t));
}
function pintarPagos(){
  var c=$("#pagos"); c.innerHTML="";
  PAGOS.forEach(function(p){
    var b=el("button"); b.type="button"; b.setAttribute("aria-pressed", p.id===pagoActivo?"true":"false");
    b.innerHTML=ico(p.ico)+"<span>"+esc(p.n)+"</span>";
    b.onclick=function(){ pagoActivo = (pagoActivo===p.id? "" : p.id); pintarPagos(); pintarCuenta(); };
    c.appendChild(b);
  });
}
function hojaExtras(i){
  var l=carro[i];
  abrirHoja("Extras de "+l.n, function(b){
    var p=el("p","vs","En desayunos y brunch el café va incluido, pero el sirope y la leche vegetal se cobran aparte. Si el precio del extra no está definido, se define en Ajustes.");
    b.appendChild(p);
    EXTRAS.forEach(function(x){
      var pr=POS.cfg.extras[x.id];
      var puesto=l.mod.some(function(m){ return m.id===x.id; });
      var btn=el("button","btn suave lleno"); btn.type="button";
      btn.textContent=(puesto?"Quitar ":"Agregar ")+x.n+(pr!=null?" ("+plata(pr)+")":" (sin precio definido)");
      btn.onclick=function(){
        if(puesto) l.mod=l.mod.filter(function(m){ return m.id!==x.id; });
        else l.mod.push({id:x.id, n:x.n, p:pr||0});
        pintarCuenta(); cerrarHoja();
      };
      b.appendChild(btn);
    });
  });
}

/* ---------- registrar ---------- */
function registrar(){
  if(!carro.length || !pagoActivo) return;
  var t=totalCarro(), pr=propinaSug(), rec=Number($("#inEfectivo").value||0);
  var v={
    id:"V"+Date.now().toString(36).toUpperCase(),
    ts:new Date().toISOString(),
    resp:POS.cfg.respActivo||"(sin asignar)",
    modo:modoActivo, pago:pagoActivo,
    lineas:carro.map(function(l){ return {id:l.id, n:l.n, q:l.q, p:l.p, mod:l.mod.slice()}; }),
    total:t, neto:neto(t), iva:ivaDe(t), propina:pr,
    efectivo: pagoActivo==="efectivo" ? {rec:rec, vuelto:Math.max(0,rec-(t+pr))} : null,
    doc:null, anulada:null
  };
  POS.ventas.push(v);
  v.lineas.forEach(function(l){ descontar(l.id, l.q); });
  guardarPOS(); guardarCtrl();
  carro=[]; pagoActivo=""; $("#inEfectivo").value="";
  pintarPagos(); pintarCuenta(); pintarRejilla(); pintarPanel(); pintarStock();
  var cr=criticos().filter(function(c){ return c.e==="off"; });
  avisar("Venta "+v.id+" registrada por "+plata(v.total+v.propina)+".","bien");
  if(cr.length) setTimeout(function(){ avisar(cr.length+(cr.length===1?" producto quedó":" productos quedaron")+" en cero. Avisa a cocina y a la barra.","alerta"); }, 1400);
  hojaVenta(v, true);
}
function anular(v){
  abrirHoja("Anular venta "+v.id, function(b){
    b.appendChild(el("p","vs","La venta queda en el historial marcada como anulada y el stock vuelve atrás. Si ya se emitió la boleta electrónica, la anulación tributaria se hace con una nota de crédito electrónica (DTE 61) en el sistema emisor: aquí solo queda el registro y el motivo."));
    var c=el("div","campo");
    c.innerHTML='<label for="inMotivo">Motivo</label><input id="inMotivo" type="text" placeholder="Error de digitación, producto devuelto…">';
    b.appendChild(c);
    var btn=el("button","btn grave lleno","Anular y devolver stock"); btn.type="button";
    btn.onclick=function(){
      var m=($("#inMotivo").value||"").trim();
      if(!m){ avisar("Escribe el motivo: es lo que después explica el descuadre.","mal"); return; }
      v.anulada={ts:new Date().toISOString(), motivo:m, por:POS.cfg.respActivo||"(sin asignar)"};
      v.lineas.forEach(function(l){ devolver(l.id, l.q); });
      guardarPOS(); guardarCtrl(); cerrarHoja(); pintarTodo();
      avisar("Venta "+v.id+" anulada. Recuerda la nota de crédito si ya tenía boleta.","bien");
    };
    b.appendChild(btn);
  });
}
</script>

<script>
/* ==================== HOJA, VALE Y DOCUMENTOS ==================== */
function abrirHoja(tit, armar){

function lineasTexto(v){

/* El vale en pantalla es igual al que sale impreso: 80 mm, monoespaciado y
   con el aviso de que no es boleta, que es lo que evita que un cliente se
   vaya creyendo que ya tiene su documento tributario. */
function valeHTML(v, tipo){
  var em=POS.cfg.emisor, esCuenta=(tipo==="cuenta");
  var h='<div class="vale" id="imprimible">';
  h+='<h4>EMPORIO ANDINO</h4><div class="sub">'+esc(em.giro||"")+"<br>"+esc(em.dir||"")+
     (em.razon?"<br>"+esc(em.razon):"")+(em.rut?"<br>RUT "+esc(em.rut):"")+"</div>";
  h+='<div class="sep"></div>';
  h+='<div class="l"><span>'+(esCuenta?"CUENTA":"VALE INTERNO")+'</span><b>'+esc(v.id)+"</b></div>";
  h+='<div class="l"><span>'+fechaLarga(diaDe(v.ts))+'</span><b>'+hora(v.ts)+"</b></div>";
  h+='<div class="l"><span>'+esc(MODOS[v.modo]||v.modo)+'</span><b>'+esc(v.resp||"")+"</b></div>";
  h+='<div class="sep"></div>';
  lineasTexto(v).forEach(function(l){ h+='<div class="l"><span>'+esc(l.n)+'</span><b>'+l.v+"</b></div>"; });
  h+='<div class="sep"></div>';
  h+='<div class="l"><span>Neto</span><b>'+plata(v.neto)+"</b></div>";
  h+='<div class="l"><span>IVA 19%</span><b>'+plata(v.iva)+"</b></div>";
  h+='<div class="l tot"><span>Consumo</span><b>'+plata(v.total)+"</b></div>";
  if(v.propina){
    h+='<div class="l"><span>Propina sugerida '+POS.cfg.propina+"%</span><b>"+plata(v.propina)+"</b></div>";
    h+='<div class="l tot"><span>Total con propina</span><b>'+plata(v.total+v.propina)+"</b></div>";
  }
  if(!esCuenta){
    h+='<div class="sep"></div><div class="l"><span>Pago</span><b>'+esc((PAGOS.filter(function(p){return p.id===v.pago;})[0]||{}).n||v.pago)+"</b></div>";
    if(v.efectivo) h+='<div class="l"><span>Recibido / vuelto</span><b>'+plata(v.efectivo.rec)+" / "+plata(v.efectivo.vuelto)+"</b></div>";
    h+='<div class="l"><span>Boleta electrónica</span><b>'+(v.doc&&v.doc.folio? "DTE "+esc(v.doc.tipo)+" folio "+esc(v.doc.folio) : "pendiente")+"</b></div>";
  }
  if(esCuenta){
    h+='<div class="nota">La propina de '+POS.cfg.propina+'% es una sugerencia y es voluntaria: puedes pedir que se retire (Art. 64 del Código del Trabajo). Este documento es la cuenta del consumo, no es la boleta.</div>';
  } else {
    h+='<div class="nota">DOCUMENTO INTERNO DE CONTROL · NO CONSTITUYE BOLETA NI FACTURA. La boleta electrónica se emite en el sistema autorizado por el SII y se entrega impresa o por medio digital.</div>';
  }
  h+='<div class="pie">Emporio Andino · @emporio.andino<br>Gracias por venir al desierto.</div>';
  return h+"</div>";
}

/* ---------- PDF de 80 mm, escrito a mano ----------
   Sin librerías: el visor de artefactos no permite traer archivos de
   fuera, así que el PDF se arma con Helvetica y codificación WinAnsi,
   que cubre las tildes y la ñ. */
function pdfEsc(s){
  var o="";
  for(var i=0;i<s.length;i++){ var c=s.charCodeAt(i);
    if(c>255) o+="?"; else if(c===40||c===41||c===92) o+="\\"+s[i]; else o+=s[i]; }
  return o;
}
function valePDF(v, tipo){
  var W=226.77, MG=14, ancho=W-MG*2, esCuenta=(tipo==="cuenta"), em=POS.cfg.emisor;
  var fil=[];  /* {t:texto, s:tamaño, b:negrita, a:alineación, d:derecha} */
  function L(t,s,b,a){ fil.push({t:t,s:s||8,b:!!b,a:a||"l"}); }
  function P(t,d,s,b){ fil.push({t:t,d:d,s:s||8,b:!!b,a:"p"}); }
  function R(){ fil.push({r:1}); }
  L("EMPORIO ANDINO",12,true,"c");
  if(em.giro) L(em.giro,7.2,false,"c");
  if(em.dir) L(em.dir,7.2,false,"c");
  if(em.razon) L(em.razon,7.2,false,"c");
  if(em.rut) L("RUT "+em.rut,7.2,false,"c");
  R();
  P(esCuenta?"CUENTA":"VALE INTERNO", v.id, 8.6, true);
  P(fechaLarga(diaDe(v.ts)), hora(v.ts));
  P(MODOS[v.modo]||v.modo, v.resp||"");
  R();
  lineasTexto(v).forEach(function(l){ P(l.n, l.v); });
  R();
  P("Neto", plata(v.neto));
  P("IVA 19%", plata(v.iva));
  P("CONSUMO", plata(v.total), 9.4, true);
  if(v.propina){
    P("Propina sugerida "+POS.cfg.propina+"%", plata(v.propina));
    P("TOTAL CON PROPINA", plata(v.total+v.propina), 9.4, true);
  }
  if(!esCuenta){
    R();
    P("Pago", (PAGOS.filter(function(p){return p.id===v.pago;})[0]||{}).n||v.pago);
    if(v.efectivo){ P("Recibido", plata(v.efectivo.rec)); P("Vuelto", plata(v.efectivo.vuelto)); }
    P("Boleta electrónica", v.doc&&v.doc.folio ? "DTE "+v.doc.tipo+" · "+v.doc.folio : "pendiente");
    R();
    L("DOCUMENTO INTERNO DE CONTROL.",7.4,true,"c");
    L("NO CONSTITUYE BOLETA NI FACTURA.",7.4,true,"c");
    L("La boleta electrónica se emite en el",6.8,false,"c");
    L("sistema autorizado por el SII.",6.8,false,"c");
  } else {
    R();
    L("La propina de "+POS.cfg.propina+"% es sugerida y",6.8,false,"c");
    L("voluntaria (Art. 64 Cód. del Trabajo).",6.8,false,"c");
    L("Esta cuenta no es la boleta.",7.4,true,"c");
  }
  R();
  L("Emporio Andino · @emporio.andino",6.8,false,"c");

  /* alto: cada fila ocupa su tamaño más un aire, cada regla 7 pt */
  var alto=MG*2;
  fil.forEach(function(f){ alto += f.r ? 7 : f.s*1.45; });
  var H=Math.max(200, Math.round(alto));
  var ops=[], y=H-MG;
  fil.forEach(function(f){
    if(f.r){ y-=3.5; ops.push("0.55 0.50 0.45 RG 0.6 w [1.6 1.6] 0 d "+MG+" "+y.toFixed(1)+" m "+(W-MG)+" "+y.toFixed(1)+" l S [] 0 d"); y-=3.5; return; }
    y -= f.s*1.12;
    var fuente=f.b?"/F2":"/F1", x=MG;
    if(f.a==="c"){ var w=f.t.length*f.s*(f.b?.56:.50); x=Math.max(MG,(W-w)/2); }
    ops.push("BT "+fuente+" "+f.s+" Tf 0.11 0.08 0.06 rg 1 0 0 1 "+x.toFixed(1)+" "+y.toFixed(1)+" Tm ("+pdfEsc(f.t)+") Tj ET");
    if(f.a==="p"){
      var wd=String(f.d).length*f.s*(f.b?.58:.52);
      ops.push("BT "+fuente+" "+f.s+" Tf 0.11 0.08 0.06 rg 1 0 0 1 "+(W-MG-wd).toFixed(1)+" "+y.toFixed(1)+" Tm ("+pdfEsc(String(f.d))+") Tj ET");
    }
    y -= f.s*.33;
  });
  var flujo=ops.join("\n");
  var objs=[null,
    "<< /Type /Catalog /Pages 2 0 R >>",
    "<< /Type /Pages /Count 1 /Kids [4 0 R] >>",
    "<< /Font << /F1 6 0 R /F2 7 0 R >> >>",
    "<< /Type /Page /Parent 2 0 R /MediaBox [0 0 "+W.toFixed(2)+" "+H+"] /Resources 3 0 R /Contents 5 0 R >>",
    {s:flujo},
    "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>",
    "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>"];
  var out="%PDF-1.4\n", pos=[];
  for(var n=1;n<objs.length;n++){
    pos[n]=out.length; var o=objs[n];
    out += (o&&o.s!==undefined)
      ? n+" 0 obj\n<< /Length "+o.s.length+" >>\nstream\n"+o.s+"\nendstream\nendobj\n"
      : n+" 0 obj\n"+o+"\nendobj\n";
  }
  var xref=out.length;
  out+="xref\n0 "+objs.length+"\n0000000000 65535 f \n";
  for(var n2=1;n2<objs.length;n2++) out+=("0000000000"+pos[n2]).slice(-10)+" 00000 n \n";
  out+="trailer\n<< /Size "+objs.length+" /Root 1 0 R >>\nstartxref\n"+xref+"\n%%EOF";
  var by=new Uint8Array(out.length);
  for(var i=0;i<out.length;i++) by[i]=out.charCodeAt(i)&0xFF;
  return by;
}

var DESCARGAS=null, descargasListas=false;
(async function(){
  try{ DESCARGAS = window.claude && claude.use ? await claude.use("downloads") : null; }catch(e){ DESCARGAS=null; }
  descargasListas=true;
  if(typeof pintarTodo==="function") pintarTodo();
})();
async function bajar(nombre, datos, texto){
  if(DESCARGAS){
    try{ await DESCARGAS.save({filename:nombre, data:datos}); avisar("Archivo guardado: "+nombre,"bien"); return true; }
    catch(err){
      var c=(err&&err.code)||"unavailable";
      if(c==="declined") return false;
      if(c==="rate_limited"){ avisar("Hay otra descarga esperando respuesta. Termínala y vuelve a intentar.","mal"); return false; }
      avisar("No se pudo guardar el archivo aquí. Usa Imprimir para el vale, o copia los datos del reporte.","mal");
      return false;
    }
  }
  if(texto!==undefined){
    abrirHoja("Copiar "+nombre, function(b){
      b.appendChild(el("p","vs","Este visor no permite descargar archivos. Copia el contenido y pégalo en una planilla."));
      var t=el("textarea"); t.value=texto; t.rows=12; t.style.width="100%"; t.style.fontFamily="var(--mono)"; t.style.fontSize="11px";
      t.style.border="1.5px solid var(--linea)"; t.style.borderRadius="10px"; t.style.padding="10px";
      b.appendChild(t); t.focus(); t.select();
    });
    return false;
  }
  avisar("Este visor no permite descargar. Usa Imprimir.","mal");
  return false;
}
function imprimirVale(){ window.print(); }

/* ---------- ficha de una venta ---------- */
function hojaVenta(v, recien){

        "</b><span>Stock descontado. Falta emitir la boleta electrónica y anotar su folio.</span></div><span></span>";

      '<span class="campo"><label for="inTipo">Documento</label><select id="inTipo">'+
      '<option value="39">39 · Boleta electrónica afecta</option>'+
      '<option value="41">41 · Boleta exenta</option>'+
      '<option value="33">33 · Factura electrónica</option></select></span>'+
      '<span class="campo"><label for="inFolio">Folio</label><input id="inFolio" inputmode="numeric" placeholder="Nº del folio emitido"></span>';
    f.appendChild(g);
    var nota=el("p","mini","El folio viene del sistema emisor autorizado por el SII (portal gratuito o proveedor). Anotarlo aquí deja la venta cuadrada con el libro de ventas; esta caja no emite documentos tributarios.");
    f.appendChild(nota);
    var bg=el("button","btn lleno","Guardar folio"); bg.type="button";
    bg.onclick=function(){
      var fo=($("#inFolio").value||"").trim();
      if(!fo){ avisar("Escribe el folio que entregó el sistema emisor.","mal"); return; }
      v.doc={tipo:$("#inTipo").value, folio:fo, ts:new Date().toISOString()};
      guardarPOS(); cerrarHoja(); pintarTodo(); avisar("Folio "+fo+" anotado en la venta "+v.id+".","bien");
    };

    b.appendChild(f);

    b2.onclick=imprimirVale;
    var b3=el("button","btn suave lleno"); b3.type="button";

    b3.onclick=function(){ cerrarHoja(); setTimeout(function(){ hojaCuenta(v); },60); };

    if(!v.anulada && !recien){
      var b4=el("button","btn suave lleno","Anular esta venta"); b4.type="button";
      b4.style.color="var(--grave)";

      acc.appendChild(b4);

    b.appendChild(acc);
