<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><script>/* EmporioAndinoPOS: deja que el lanzador escuche errores desde el inicio */try{if(parent!==window&&parent.__eaGancho)parent.__eaGancho(window)}catch(e){}</script></head><body>
<title>Comandas · EmporioAndinoPOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap">
<link rel="stylesheet" href="../nucleo/emporio.css">
<style>
/* Layout: la pantalla de cocina con el diseño de Emporio System 1.1. Arriba la
   franja de estaciones (segmentado con indicador que se desliza) y los
   contadores; abajo las comandas como mosaicos de vidrio, la más antigua
   primero. Dentro del sistema general la cabecera propia se esconde. */
.modulo{position:relative;z-index:1;padding-block:16px 40px;padding-inline:16px;display:flex;flex-direction:column;gap:14px;max-width:1500px;margin:0 auto}
html.incrustado .solo{display:none}
html.incrustado .modulo{padding-top:4px}
.seg.est button{padding:7px 14px;font-size:13px;display:inline-flex;align-items:center;gap:8px}
.seg.est button b{font-family:var(--f-num);font-size:16px}
.tablero{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;align-items:start}
.cmdt{--c:var(--ok);border-top:3px solid var(--c);display:flex;flex-direction:column;gap:10px}
.cmdt.aviso{--c:var(--warn)} .cmdt.tarde{--c:var(--crit)}
.cmdt .h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.cmdt .h b{font-family:var(--f-num);font-size:16px}
.cmdt .min{font-family:var(--f-num);font-weight:800;font-size:20px;color:var(--c)}
.cmdt .meta{font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.etq{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--stroke-2);border-radius:99px;padding:1px 8px}
.etq.cocina{color:var(--cocina);border-color:color-mix(in srgb,var(--cocina) 55%,transparent)}
.etq.barra{color:var(--barra);border-color:color-mix(in srgb,var(--barra) 55%,transparent)}
.etq.horno{color:var(--horno);border-color:color-mix(in srgb,var(--horno) 55%,transparent)}
.cmdt ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.cmdt li{display:grid;grid-template-columns:34px minmax(0,1fr);gap:8px;align-items:start;font-size:15px;font-weight:600}
.cmdt li .q{font-family:var(--f-num);font-weight:800;background:var(--glass-2);border:1px solid var(--stroke);border-radius:9px;text-align:center}
.cmdt li small{display:block;color:var(--warn);font-size:12px;font-weight:700}
.cmdt .btn{justify-content:center}
.vacio{grid-column:1/-1}
details summary{cursor:pointer;font-family:var(--f-num);font-weight:700;color:var(--fg-2)}
.hlist{margin-top:10px}
.hlist li{display:flex;justify-content:space-between;gap:10px;align-items:center;border-top:1px solid var(--stroke);padding-top:6px}
</style>

<div class="modulo">
  <header class="top glass solo">
    <div class="ttl"><div><h1>Comandas</h1><p>Lo cobrado en la Caja, separado por estación</p></div></div>
    <div class="ctl"><span class="clock num" id="reloj">--:--</span></div>
  </header>
  <article class="tile glass">
    <div class="tc"><div class="hd"><div><h2>Estaciones</h2><p id="sub">Lo cobrado en la Caja, separado por estación</p></div>
      <button class="btn sm" type="button" id="sonido" aria-pressed="false">Campana apagada</button></div>
      <div class="seg est" role="group" aria-label="Estación" id="estaciones"><span class="ind" id="estInd"></span></div></div>
  </article>
  <section class="tablero" id="tablero" aria-live="polite"></section>
  <article class="tile glass"><div class="tc"><details id="hechas"><summary id="hechasT">Listas hoy</summary><ul class="log hlist" id="hlist"></ul></details></div></article>
</div>

<script src="../nucleo/datos.js"></script>
<script src="../nucleo/nucleo.js"></script>
<script src="../nucleo/emporio.js"></script>
<script>
/* ====================================================================
   Comandas: la pieza que faltaba entre la Caja y la cocina.
   Cada venta registrada en la Caja se reparte por estación según el grupo
   de cada producto. Marcar "Listo" queda guardado por día en este equipo
   (eapos_comandas); la venta en sí no se toca.
   ==================================================================== */
var ESTACIONES=[
  {id:"cocina", n:"Cocina"},
  {id:"barra",  n:"Barra"},
  {id:"horno",  n:"Horno y vitrina"},
  {id:"todo",   n:"Todo"}
];
var MODOS={local:"Local", llevar:"Para llevar", delivery:"DesertGo"};
var AVISO_MIN=8, TARDE_MIN=15, U=EA_UI;
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function hoyISO(d){ d=d||new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function hora(ts){ return U.hhmm(new Date(ts)); }
function leer(k,def){ try{ var r=localStorage.getItem(k); return r?JSON.parse(r):def; }catch(e){ return def; } }
function guardar(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }

var est=(function(){ try{ return localStorage.getItem("eapos_comandas_est")||""; }catch(e){ return ""; } })();
/* La estación por defecto sale del cargo de quien está en sesión. */
if(!est){ var s0=EAPOS.sesion(); est = !s0 ? "todo" : (s0.r==="cocina" ? "cocina" : (s0.r==="barista"||s0.r==="barista_enc") ? "barra" : "todo"); }
var sonido=false, vistos=null, deslizador=null;

function marcas(){ var m=leer("eapos_comandas",null); if(!m||m.fecha!==hoyISO()) m={fecha:hoyISO(), listo:{}}; return m; }
function estacionDe(id){ var p=EAPOS.producto(id), g=p?p.g:""; return g==="coc"?"cocina":g==="bar"?"barra":(g==="emp"||g==="past")?"horno":"todo"; }
/* Todas las comandas del día: una por venta y estación con algo que preparar. */
function comandas(){
  var pos=leer("ea_pos",{}), vs=(pos&&Array.isArray(pos.ventas))?pos.ventas:[], hoy=hoyISO(), out=[];
  vs.forEach(function(v){
    if(v.anulada || hoyISO(new Date(v.ts))!==hoy) return;
    var por={};
    (v.lineas||[]).forEach(function(l){ var e=estacionDe(l.id); (por[e]=por[e]||[]).push(l); });
    Object.keys(por).forEach(function(e){ out.push({clave:v.id+"|"+e, venta:v, est:e, lineas:por[e]}); });
  });
  return out;
}
function minutos(ts){ return Math.max(0, Math.floor((Date.now()-new Date(ts).getTime())/60000)); }
function nombreEst(id){ return (ESTACIONES.filter(function(e){ return e.id===id; })[0]||{}).n||""; }

function pintar(revelar){
  var todas=comandas(), m=marcas();
  var pend=todas.filter(function(c){ return !m.listo[c.clave]; });
  var cuenta={cocina:0,barra:0,horno:0,todo:pend.length};
  pend.forEach(function(c){ cuenta[c.est]=(cuenta[c.est]||0)+1; });
  var cont=$("estaciones");
  if(!cont.querySelector("button")){
    cont.insertAdjacentHTML("beforeend",ESTACIONES.map(function(e){ return '<button type="button" data-est="'+e.id+'" aria-pressed="false">'+esc(e.n)+' <b class="num" data-n="'+e.id+'">0</b></button>'; }).join(""));
    deslizador=U.deslizador($("estInd"));
  }
  cont.querySelectorAll("[data-est]").forEach(function(b){ b.setAttribute("aria-pressed",String(b.dataset.est===est)); });
  ESTACIONES.forEach(function(e){ U.numero(cont.querySelector('[data-n="'+e.id+'"]'),cuenta[e.id]||0,Math.round); });
  deslizador.to(cont.querySelector('[aria-pressed="true"]'),!revelar);
  var vis=pend.filter(function(c){ return est==="todo" || c.est===est; }).sort(function(a,b){ return a.venta.ts<b.venta.ts?-1:1; });
  if(!vis.length){
    $("tablero").innerHTML='<article class="tile glass vacio"><div class="tc"><div class="empty"><span class="ic">'+U.icono("cocina")+'</span><p><b>Sin comandas pendientes.</b> Lo que se cobre en la Caja aparece aquí al instante, separado por estación.</p></div></div></article>';
  } else {
    $("tablero").innerHTML=vis.map(function(c){
      var mi=minutos(c.venta.ts), cl=mi>=TARDE_MIN?" tarde":mi>=AVISO_MIN?" aviso":"";
      return '<article class="tile glass lift comanda cmdt'+cl+'"><div class="h"><b>'+esc(c.venta.id.slice(-5))+'</b><span class="min">'+mi+' min</span></div>'+
        '<div class="meta"><span class="etq '+c.est+'">'+esc(nombreEst(c.est))+'</span><span>'+hora(c.venta.ts)+' · '+esc(MODOS[c.venta.modo]||c.venta.modo)+' · '+esc(c.venta.resp||"")+'</span></div>'+
        '<ul>'+c.lineas.map(function(l){
          return '<li><span class="q">'+l.q+'</span><span>'+esc(l.n)+((l.mod&&l.mod.length)?'<small>'+esc(l.mod.map(function(x){ return x.n; }).join(" · "))+'</small>':'')+'</span></li>';
        }).join("")+'</ul>'+
        '<button class="btn pri" type="button" data-listo="'+esc(c.clave)+'">Listo</button></article>';
    }).join("");
  }
  U.mosaicos($("tablero"));
  if(revelar) U.revelar(document);
  var hechas=todas.filter(function(c){ return m.listo[c.clave] && (est==="todo"||c.est===est); })
    .sort(function(a,b){ return m.listo[b.clave]<m.listo[a.clave]?-1:1; }).slice(0,30);
  $("hechasT").textContent="Listas hoy ("+hechas.length+")";
  $("hlist").innerHTML=hechas.map(function(c){
    return '<li><span><b>'+hora(m.listo[c.clave])+'</b>'+esc(c.venta.id.slice(-5))+' · '+esc(c.lineas.map(function(l){ return l.q+"× "+l.n; }).join(", "))+'</span><button class="btn sm" type="button" data-volver="'+esc(c.clave)+'">Volver a pendiente</button></li>';
  }).join("")||'<li>Nada marcado como listo todavía.</li>';
  $("sub").textContent=pend.length? pend.length+(pend.length===1?" comanda pendiente":" comandas pendientes")+" en total" : "Lo cobrado en la Caja, separado por estación";
  /* campana: suena cuando entra una comanda nueva a la estación que se mira */
  var claves=vis.map(function(c){ return c.clave; });
  if(vistos && sonido && claves.some(function(k){ return vistos.indexOf(k)<0; })) campana();
  vistos=claves;
}
var AC=null;
function campana(){
  try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==="suspended") AC.resume();
    [[880,0],[660,.18]].forEach(function(n){ var o=AC.createOscillator(), g=AC.createGain(), t=AC.currentTime+n[1];
      o.frequency.value=n[0]; g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.18,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+.25);
      o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+.3); }); }catch(e){}
}

$("estaciones").addEventListener("click",function(e){ var b=e.target.closest("[data-est]"); if(!b) return; est=b.dataset.est; try{ localStorage.setItem("eapos_comandas_est",est); }catch(x){} vistos=null; pintar(true); });
$("tablero").addEventListener("click",function(e){ var b=e.target.closest("[data-listo]"); if(!b) return;
  var m=marcas(); m.listo[b.dataset.listo]=new Date().toISOString(); guardar("eapos_comandas",m); U.aviso("Comanda lista"); pintar(); });
$("hlist").addEventListener("click",function(e){ var b=e.target.closest("[data-volver]"); if(!b) return;
  var m=marcas(); delete m.listo[b.dataset.volver]; guardar("eapos_comandas",m); pintar(); });
$("sonido").addEventListener("click",function(){ sonido=!sonido; this.setAttribute("aria-pressed",String(sonido)); this.textContent=sonido?"Campana encendida":"Campana apagada"; this.classList.toggle("pri",sonido); if(sonido) campana(); });
addEventListener("storage",function(ev){ if(ev.key==="ea_pos"||ev.key==="eapos_comandas") pintar(); });
if(EAPOS.canal) EAPOS.canal.onmessage=function(){ pintar(); };
new ResizeObserver(function(){ if(deslizador) deslizador.to($("estaciones").querySelector('[aria-pressed="true"]'),true); }).observe(document.body);
U.reloj($("reloj")); pintar(true);
setInterval(pintar,15000);
</script>
</body></html>
